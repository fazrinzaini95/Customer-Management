# Single site serving both the static frontend (this repo's root) AND the
# API as a Netlify Function (backend/netlify/functions/api.js). Same
# origin for both means no CORS configuration is needed at all — the
# frontend's API_BASE is just '/api'.

[build]
  publish = "."
  command = "echo 'no build step needed — npm install still runs to populate node_modules for the API function'"
  functions = "backend/netlify/functions"

# Forwards every /api/... request to the single "api" function. Netlify
# strips the "/api" prefix via :splat, so Express still sees the same
# paths it always has (e.g. /auth/login, /trips, /bootstrap).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
