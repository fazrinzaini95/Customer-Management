<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excapism · Passenger Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0F2C4C;
    --navy-deep:#081A2E;
    --gold:#F4B93C;
    --coral:#E15554;
    --green:#2E8B57;
    --paper:#FBF3E3;
    --paper-dim:#F2E8D5;
    --ink:#1C2B39;
    --ink-soft:#5A6B7A;
    --line: rgba(15,44,76,0.16);
    --radius: 14px;
    --shadow: 0 6px 20px rgba(15,44,76,0.10);
    --font-display:'Fredoka', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  body{min-height:100vh;}
  ::selection{background:var(--gold);color:var(--navy-deep);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{
    width:44px;height:44px;border-radius:10px;background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);color:var(--gold);font-weight:700;font-size:16px;
    box-shadow: var(--shadow);
    transform: rotate(-4deg);
  }
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0;color:var(--navy-deep);letter-spacing:0.2px;}
  .brand p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .topbar-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(15,44,76,0.28);}
  .btn-primary:hover{box-shadow:0 6px 16px rgba(15,44,76,0.36);}
  .btn-gold{background:var(--gold);color:var(--navy-deep);box-shadow:0 4px 12px rgba(244,185,60,0.35);}
  .btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-danger{background:#fff;color:var(--coral);border:1.5px solid rgba(225,85,84,0.4);}
  .btn-danger:hover{background:rgba(225,85,84,0.08);}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .search{
    flex:1;min-width:180px;background:#fff;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 14px;font-size:14px;color:var(--ink);
  }
  .search:focus{outline:none;border-color:var(--navy);}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;
    padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;
  }
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  /* ---------- Trip cards (boarding-pass stub) ---------- */
  .trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .stub{
    position:relative;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;cursor:pointer;border:1px solid var(--line);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .stub:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(15,44,76,0.18);}
  .stub-top{padding:16px 18px 14px;position:relative;}
  .stub-type{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.5px;color:var(--ink-soft);
    text-transform:uppercase;margin-bottom:6px;
  }
  .stub-name{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--navy-deep);margin:0 0 4px;line-height:1.25;}
  .stub-dest{font-size:13px;color:var(--ink-soft);margin:0;}
  .stub-code{
    position:absolute;top:16px;right:18px;font-family:var(--font-mono);font-size:11px;color:var(--navy);
    background:var(--paper-dim);padding:3px 8px;border-radius:6px;font-weight:600;
  }
  .stub-perf{
    position:relative;height:0;border-top:2px dashed var(--line);margin:0 0;
  }
  .stub-perf::before,.stub-perf::after{
    content:"";position:absolute;top:-9px;width:18px;height:18px;background:var(--paper);border-radius:50%;
  }
  .stub-perf::before{left:-9px;}
  .stub-perf::after{right:-9px;}
  .stub-bottom{padding:13px 18px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .stub-dates{font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);}
  .stamp{
    font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;
    padding:5px 10px;border-radius:7px;transform:rotate(-3deg);border:2px solid currentColor;
  }
  .stamp.Draft{color:var(--ink-soft);background:rgba(90,107,122,0.12);}
  .stamp.Pending{color:#9C7A16;background:rgba(244,185,60,0.16);}
  .stamp.Approved{color:var(--green);background:rgba(46,139,87,0.12);}
  .stamp.Declined{color:var(--coral);background:rgba(225,85,84,0.10);}
  .stamp.Cancelled{color:var(--coral);background:rgba(225,85,84,0.10);}
  .stamp.Completed{color:var(--navy);background:rgba(15,44,76,0.10);}
  .stub-meta{padding:0 18px 16px;display:flex;gap:14px;font-size:12px;color:var(--ink-soft);}
  .stub-meta b{color:var(--ink);font-weight:600;}

  .empty{
    text-align:center;padding:70px 20px;background:#fff;border-radius:var(--radius);border:1.5px dashed var(--line);
  }
  .empty h3{font-family:var(--font-display);font-size:19px;color:var(--navy-deep);margin:0 0 6px;}
  .empty p{color:var(--ink-soft);font-size:14px;margin:0 0 18px;}

  /* ---------- Detail view ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-soft);font-weight:600;margin-bottom:16px;background:none;border:none;padding:0;}
  .back-link:hover{color:var(--navy);}
  .manifest-head{
    background:var(--navy);color:#fff;border-radius:var(--radius);padding:22px 24px;
    display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .manifest-head .mh-left .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  .manifest-head h2{font-family:var(--font-display);font-size:24px;margin:0 0 6px;font-weight:600;}
  .manifest-head .mh-sub{font-size:13px;color:rgba(255,255,255,0.72);}
  .mh-edit{background:none;border:1.5px solid rgba(255,255,255,0.35);color:#fff;border-radius:7px;padding:3px 10px;font-size:11.5px;font-weight:600;margin-top:8px;}
  .mh-edit:hover{border-color:#fff;}
  .mh-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .approval-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}

  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
  .stat-card .value{font-family:var(--font-display);font-size:22px;color:var(--navy-deep);font-weight:600;}

  .panel{background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;}
  .panel-head h3{font-family:var(--font-display);font-size:16px;margin:0;color:var(--navy-deep);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);
    padding:10px 16px;border-bottom:1.5px solid var(--line);background:var(--paper-dim);font-weight:600;
  }
  tbody td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(15,44,76,0.03);}
  .cust-name{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;}
  .cust-sub{font-size:11.5px;color:var(--ink-soft);}
  .med-flag{color:var(--coral);font-size:12px;cursor:help;}
  .status-select{
    border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:600;background:#fff;
  }
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .badge.Paid{background:rgba(46,139,87,0.12);color:var(--green);}
  .badge.Deposit{background:rgba(244,185,60,0.18);color:#9C7A16;}
  .badge.Pending{background:rgba(90,107,122,0.12);color:var(--ink-soft);}
  .badge.Cancelled{background:rgba(225,85,84,0.10);color:var(--coral);}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}
  .icon-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;padding:4px 7px;border-radius:6px;}
  .icon-btn:hover{color:var(--navy);background:rgba(15,44,76,0.08);}
  .icon-btn.danger:hover{color:var(--coral);background:rgba(225,85,84,0.08);}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,26,46,0.55);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .modal-head{padding:20px 24px;border-bottom:1.5px dashed var(--line);display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{font-family:var(--font-display);font-size:18px;margin:0;color:var(--navy-deep);}
  .modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);line-height:1;}
  .modal-body{padding:22px 24px;}
  .modal-foot{padding:16px 24px 22px;display:flex;justify-content:space-between;gap:10px;align-items:center;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;background:#fff;color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .seg button.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .dropzone{
    border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;background:#fff;
    cursor:pointer;transition:border-color .12s ease, background .12s ease;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--navy);background:rgba(15,44,76,0.03);}
  .dropzone p{margin:0;font-size:13.5px;color:var(--ink-soft);}
  .dropzone strong{color:var(--navy);}
  .file-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--paper-dim);border-radius:9px;padding:8px 12px;
    font-size:13px;margin-top:10px;font-weight:600;color:var(--navy-deep);
  }
  .preview-note{font-size:12.5px;color:var(--ink-soft);margin:12px 0 4px;}
  .preview-group{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;}
  .preview-group-head{background:var(--paper-dim);padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--navy-deep);display:flex;justify-content:space-between;}
  .preview-group-head span.tag{font-family:var(--font-mono);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:#fff;color:var(--ink-soft);margin-left:6px;}
  .preview-table-wrap{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:9px;}
  .preview-table-wrap table{font-size:12px;}
  .preview-table-wrap th,.preview-table-wrap td{padding:7px 10px;white-space:nowrap;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;
    padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);
    z-index:100;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .link-btn{background:none;border:none;color:var(--navy);font-weight:600;font-size:13px;text-decoration:underline;padding:0;}

  @media (max-width:640px){
    .field-row{grid-template-columns:1fr;}
    .manifest-head{flex-direction:column;}
    .mh-right{align-items:flex-start;}
    .approval-row{justify-content:flex-start;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Backend API
   Talks to the Passenger Manifest API (see /backend) — Express +
   Postgres, deployed as a Netlify Function, with Supabase as the
   hosted database. Set API_BASE to your deployed API's URL once
   it's live (see backend/DEPLOYMENT.md).
   ========================================================= */
const API_BASE = '/api';
const API_NOT_CONFIGURED = API_BASE.includes('YOUR-API-SITE');

let authToken = null; // JWT — persisted to localStorage so a page refresh doesn't require signing in again
let DEMO_MODE = false; // true = every request is served locally by demoFetch(), nothing leaves the browser

const SESSION_KEY = 'excapism_manifest_session';
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ token: authToken, demoMode: DEMO_MODE })); }
  catch(e){ /* storage unavailable (e.g. sandboxed preview) — session just won't survive a refresh */ }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){ /* nothing to clean up if storage was never available */ }
}
async function restoreSession(){
  let saved;
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return false;
    saved = JSON.parse(raw);
  }catch(e){ return false; }
  if(!saved || !saved.token) return false;

  DEMO_MODE = !!saved.demoMode;
  authToken = saved.token;
  try{
    currentUser = await apiFetch('/auth/me');
    authView = 'app';
    await loadBootstrap();
    return true;
  }catch(e){
    // token expired, revoked, or the API is unreachable — fall back to a clean login screen
    authToken = null;
    currentUser = null;
    DEMO_MODE = false;
    clearSession();
    return false;
  }
}

async function apiFetch(path, options = {}){
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  if(DEMO_MODE) return demoFetch(path, { ...options, headers });
  let res;
  try{
    res = await fetch(API_BASE + path, { ...options, headers });
  }catch(networkErr){
    const err = new Error('Could not reach the server — check your connection and try again.');
    err.network = true;
    throw err;
  }
  let body = null;
  try{ body = await res.json(); }catch(e){ /* empty body, e.g. 204 */ }
  if(!res.ok){
    const err = new Error((body && body.error) || `Request failed (${res.status})`);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return body;
}

// Used only by the public self-registration page — a visitor filling this
// out was never logged in, so this never attaches an Authorization header
// and never depends on this tab's DEMO_MODE state (which reflects a
// staff member's own local testing, not the site's actual configuration).
// If the real API is genuinely configured (the normal deployed case),
// this always talks to it directly; only falls back to the local demo
// mock when the whole site is still unconfigured, for template preview.
async function publicApiFetch(path, options = {}){
  if(API_NOT_CONFIGURED) return demoFetch(path, options);
  let res;
  try{
    res = await fetch(API_BASE + path, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
  }catch(networkErr){
    const err = new Error('Could not reach the server — check your connection and try again.');
    err.network = true;
    throw err;
  }
  let body = null;
  try{ body = await res.json(); }catch(e){ /* empty body */ }
  if(!res.ok){
    const err = new Error((body && body.error) || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return body;
}

/* =========================================================
   Demo mode
   A complete mock of the backend's routes, running entirely in this
   browser tab and persisted to localStorage — so the app can be tried
   end-to-end (accounts, roles, approval workflow, bulk upload) before a
   real API is deployed. Nothing here leaves the browser; nothing here is
   shared between people. Mirrors backend/src/routes/*.js route-for-route
   so switching to a real API later needs zero UI changes.
   ========================================================= */
const DEMO_STORAGE_KEY = 'excapism_demo_v1';
let demoState = null;
function demoId(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
async function demoHash(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function ensureDemoState(){
  if(demoState) return demoState;
  try{
    const raw = localStorage.getItem(DEMO_STORAGE_KEY);
    demoState = raw ? JSON.parse(raw) : null;
  }catch(e){ demoState = null; }
  if(!demoState){
    demoState = { users:[], trips:[], passengers:[], settings:{prefix:'EXC',includeYear:true,padding:3}, tripSeq:0, activityLog:[] };
  }
  if(!demoState.activityLog) demoState.activityLog = []; // upgrade older saved demo data
  return demoState;
}
function persistDemo(){
  try{ localStorage.setItem(DEMO_STORAGE_KEY, JSON.stringify(demoState)); }catch(e){ /* demo data just won't survive a refresh */ }
}
function resetDemoData(){
  demoState = { users:[], trips:[], passengers:[], settings:{prefix:'EXC',includeYear:true,padding:3}, tripSeq:0, activityLog:[] };
  persistDemo();
}
function logDemoActivity(state, actor, action, entityType, entityId, entityLabel, details){
  state.activityLog.unshift({
    id: demoId('log'), actorId: actor.id, actorName: actor.name, actorEmail: actor.email,
    action, entityType, entityId: entityId ?? null, entityLabel: entityLabel ?? null,
    details: details || {}, createdAt: new Date().toISOString()
  });
  if(state.activityLog.length > 200) state.activityLog.length = 200;
}

// Thin wrapper: deep-clones whatever demoFetchInner returns before handing
// it back. Without this, response objects are the SAME references living
// inside demoState — so an optimistic UI update in the frontend (setting
// a field before the "network" call resolves) would silently mutate
// demoState's copy too, corrupting things like activity-log before/after
// values. A real HTTP API can't have this problem (JSON travels over the
// wire), so this clone step is what makes demo mode behave like one.
async function demoFetch(path, options = {}){
  const result = await demoFetchInner(path, options);
  return result == null ? result : JSON.parse(JSON.stringify(result));
}

async function demoFetchInner(path, options = {}){
  const state = ensureDemoState();
  const method = (options.method || 'GET').toUpperCase();
  const body = options.body ? JSON.parse(options.body) : {};
  const authHeader = (options.headers && options.headers['Authorization']) || '';
  const token = authHeader.startsWith('Bearer ') ? authHeader.slice(7) : null;
  const me = token ? state.users.find(u=>u.id===token) : null;

  function fail(status, error){ const e = new Error(error); e.status = status; e.body = { error }; throw e; }
  function requireAuthed(){ if(!me) fail(401,'Missing or invalid Authorization header'); return me; }
  function requireRoleIn(...roles){ const u = requireAuthed(); if(!roles.includes(u.role)) fail(403,'You do not have permission to perform this action'); return u; }
  function publicUser(u){ return { id:u.id, name:u.name, email:u.email, role:u.role, isTemp:!!u.isTemp, createdAt:u.createdAt }; }
  function adminCount(){ return state.users.filter(u=>u.role==='admin').length; }
  let m;

  // ---- Auth ----
  if(path==='/auth/signup' && method==='POST'){
    const { name, email, password } = body;
    if(!name || !email) fail(400,'Name and email are required');
    if(!password || password.length<6) fail(400,'Password must be at least 6 characters');
    if(state.users.some(u=>u.email.toLowerCase()===String(email).toLowerCase())) fail(409,'An account with that email already exists');
    const role = state.users.length===0 ? 'admin' : 'user';
    const u = { id:demoId('user'), name, email, passwordHash: await demoHash(password), role, isTemp:false, createdAt:new Date().toISOString() };
    state.users.push(u); persistDemo();
    return { token:u.id, user:publicUser(u) };
  }
  if(path==='/auth/login' && method==='POST'){
    const { email, password } = body;
    const u = state.users.find(x=>x.email.toLowerCase()===String(email||'').toLowerCase());
    if(!u) fail(401,'Incorrect email or password');
    if(await demoHash(password||'') !== u.passwordHash) fail(401,'Incorrect email or password');
    return { token:u.id, user:publicUser(u) };
  }
  if(path==='/auth/temp-account' && method==='POST'){
    const suffix = Math.random().toString(36).slice(2,10);
    const email = `guest.${suffix}@temp.excapism`;
    const password = Math.random().toString(36).slice(2,12);
    const role = state.users.length===0 ? 'admin' : 'user';
    const u = { id:demoId('user'), name:'Guest User', email, passwordHash: await demoHash(password), role, isTemp:true, createdAt:new Date().toISOString() };
    state.users.push(u); persistDemo();
    return { token:u.id, user:publicUser(u), tempPassword:password };
  }
  if(path==='/auth/me' && method==='GET'){
    return publicUser(requireAuthed());
  }

  // ---- Bootstrap ----
  if(path==='/bootstrap' && method==='GET'){
    const u = requireAuthed();
    return {
      trips: state.trips.map(t=>({ ...t, passengerCount: state.passengers.filter(p=>p.tripId===t.id).length })),
      passengers: state.passengers.slice(),
      users: u.role==='admin' ? state.users.map(publicUser) : undefined,
      settings: { ...state.settings, runningNumber: state.tripSeq, nextNumber: state.tripSeq+1 }
    };
  }

  // ---- Trips ----
  if(path==='/trips' && method==='POST'){
    const u = requireAuthed();
    if(!body.name) fail(400,'Trip name is required');
    state.tripSeq += 1;
    const t = { id:demoId('trip'), seq:state.tripSeq, name:body.name, type:body.type||'open', destination:body.destination||null,
      startDate:body.startDate||null, endDate:body.endDate||null, status:'Draft',
      history:[{status:'Draft',date:new Date().toISOString()}], createdAt:new Date().toISOString(), publicToken:demoId('tok') };
    state.trips.push(t);
    logDemoActivity(state, u, 'trip.created', 'trip', t.id, t.name, { type:t.type, destination:t.destination });
    persistDemo();
    return t;
  }
  if((m=path.match(/^\/trips\/([^/]+)$/)) && method==='PUT'){
    const u = requireAuthed();
    const t = state.trips.find(x=>x.id===m[1]); if(!t) fail(404,'Trip not found');
    Object.assign(t, body);
    logDemoActivity(state, u, 'trip.updated', 'trip', t.id, t.name, { updatedFields:Object.keys(body) });
    persistDemo();
    return t;
  }
  if((m=path.match(/^\/trips\/([^/]+)$/)) && method==='DELETE'){
    const u = requireRoleIn('admin');
    const idx = state.trips.findIndex(x=>x.id===m[1]); if(idx<0) fail(404,'Trip not found');
    const [removed] = state.trips.splice(idx,1);
    state.passengers = state.passengers.filter(p=>p.tripId!==m[1]);
    logDemoActivity(state, u, 'trip.deleted', 'trip', removed.id, removed.name, { destination:removed.destination });
    persistDemo();
    return null;
  }
  if((m=path.match(/^\/trips\/([^/]+)\/status$/)) && method==='POST'){
    const u = requireAuthed();
    const t = state.trips.find(x=>x.id===m[1]); if(!t) fail(404,'Trip not found');
    const TRANSITIONS = {
      Draft:[{to:'Pending',anyRole:true}],
      Pending:[{to:'Approved',anyRole:false},{to:'Declined',anyRole:false}],
      Approved:[{to:'Completed',anyRole:false},{to:'Cancelled',anyRole:false}],
      Declined:[{to:'Draft',anyRole:true}],
      Cancelled:[{to:'Draft',anyRole:true}],
      Completed:[]
    };
    const move = (TRANSITIONS[t.status]||[]).find(a=>a.to===body.status);
    if(!move) fail(400,`Can't move a trip from ${t.status} to ${body.status}`);
    if(!move.anyRole && !['approver','admin'].includes(u.role)) fail(403,'Only an approver or admin can do that');
    const fromStatus = t.status;
    t.status = body.status;
    t.history.push({status:body.status, date:new Date().toISOString()});
    logDemoActivity(state, u, 'trip.status_changed', 'trip', t.id, t.name, { from:fromStatus, to:body.status });
    persistDemo();
    return t;
  }
  if(path==='/trips/bulk-import' && method==='POST'){
    const u = requireAuthed();
    const rows = body.rows || [];
    const groups = new Map();
    rows.forEach(r=>{
      const type = /private/i.test(r.tripType||'') ? 'private' : 'open';
      const location = (r.location||'').trim() || 'Unspecified destination';
      const key = type+'|'+location.toLowerCase();
      if(!groups.has(key)) groups.set(key,{type,location,rows:[]});
      groups.get(key).rows.push(r);
    });
    let importedCount=0, createdTripCount=0; const tripIds=[];
    for(const g of groups.values()){
      let t = state.trips.find(x=>normType(x.type)===g.type && String(x.destination||'').trim().toLowerCase()===g.location.toLowerCase());
      if(!t){
        state.tripSeq += 1;
        t = { id:demoId('trip'), seq:state.tripSeq, name:g.location, type:g.type, destination:g.location, startDate:null, endDate:null,
          status:'Draft', history:[{status:'Draft',date:new Date().toISOString()}], createdAt:new Date().toISOString(), publicToken:demoId('tok') };
        state.trips.push(t); createdTripCount += 1;
      }
      tripIds.push(t.id);
      g.rows.forEach(r=>{
        state.passengers.push({ id:demoId('cust'), tripId:t.id, name:r.name, dob:r.dob||null, phone:r.phone||null,
          idNumber:r.idNumber||null, medicalCondition:r.medicalCondition||null, passportNumber:r.passportNumber||null, passportExpiry:r.passportExpiry||null,
          amount:0, depositAmount:0, paymentStatus:'Pending', notes:r.notes||null, submittedAt:r.timestamp||null,
          addedAt:new Date().toISOString() });
        importedCount += 1;
      });
    }
    logDemoActivity(state, u, 'trip.bulk_import', 'bulk_import', null, `Bulk import (${importedCount} passenger${importedCount===1?'':'s'})`, { importedCount, createdTripCount });
    persistDemo();
    return { importedCount, createdTripCount, tripIds:[...new Set(tripIds)] };
  }

  // ---- Passengers ----
  if((m=path.match(/^\/trips\/([^/]+)\/passengers$/)) && method==='POST'){
    const u = requireAuthed();
    const c = { id:demoId('cust'), tripId:m[1], amount:0, depositAmount:0, paymentStatus:'Pending', addedAt:new Date().toISOString(), ...body };
    state.passengers.push(c);
    logDemoActivity(state, u, 'passenger.created', 'passenger', c.id, c.name, { tripId:c.tripId });
    persistDemo();
    return c;
  }
  if((m=path.match(/^\/passengers\/([^/]+)$/)) && method==='PUT'){
    const u = requireAuthed();
    const c = state.passengers.find(x=>x.id===m[1]); if(!c) fail(404,'Passenger not found');
    Object.assign(c, body);
    logDemoActivity(state, u, 'passenger.updated', 'passenger', c.id, c.name, { updatedFields:Object.keys(body) });
    persistDemo();
    return c;
  }
  if((m=path.match(/^\/passengers\/([^/]+)\/payment-status$/)) && method==='PUT'){
    const u = requireAuthed();
    const c = state.passengers.find(x=>x.id===m[1]); if(!c) fail(404,'Passenger not found');
    const fromStatus = c.paymentStatus;
    c.paymentStatus = body.paymentStatus;
    logDemoActivity(state, u, 'passenger.payment_status_changed', 'passenger', c.id, c.name, { from:fromStatus, to:body.paymentStatus });
    persistDemo();
    return c;
  }
  if((m=path.match(/^\/passengers\/([^/]+)\/ticket-status$/)) && method==='PUT'){
    const u = requireAuthed();
    const c = state.passengers.find(x=>x.id===m[1]); if(!c) fail(404,'Passenger not found');
    const fromStatus = c.ticketStatus;
    c.ticketStatus = body.ticketStatus;
    logDemoActivity(state, u, 'passenger.ticket_status_changed', 'passenger', c.id, c.name, { from:fromStatus, to:body.ticketStatus });
    persistDemo();
    return c;
  }
  if((m=path.match(/^\/passengers\/([^/]+)$/)) && method==='DELETE'){
    const u = requireAuthed();
    const idx = state.passengers.findIndex(x=>x.id===m[1]); if(idx<0) fail(404,'Passenger not found');
    const [removed] = state.passengers.splice(idx,1);
    logDemoActivity(state, u, 'passenger.deleted', 'passenger', removed.id, removed.name, { tripId:removed.tripId });
    persistDemo();
    return null;
  }

  // ---- Users ----
  if(path==='/users' && method==='GET'){
    requireRoleIn('admin');
    return state.users.map(publicUser);
  }
  if(path==='/users' && method==='POST'){
    const u = requireRoleIn('admin');
    const { name, email, password, role } = body;
    if(!name || !email) fail(400,'Name and email are required');
    if(!password || password.length<6) fail(400,'Password must be at least 6 characters');
    if(state.users.some(x=>x.email.toLowerCase()===String(email).toLowerCase())) fail(409,'That email is already registered');
    const newUser = { id:demoId('user'), name, email, passwordHash: await demoHash(password), role: role||'user', isTemp:false, createdAt:new Date().toISOString() };
    state.users.push(newUser);
    logDemoActivity(state, u, 'user.created', 'user', newUser.id, newUser.email, { role:newUser.role });
    persistDemo();
    return publicUser(newUser);
  }
  if((m=path.match(/^\/users\/([^/]+)\/role$/)) && method==='PUT'){
    const u = requireRoleIn('admin');
    const target = state.users.find(x=>x.id===m[1]); if(!target) fail(404,'User not found');
    if(target.role==='admin' && body.role!=='admin' && adminCount()<=1) fail(400,'At least one admin is required');
    const fromRole = target.role;
    target.role = body.role;
    logDemoActivity(state, u, 'user.role_changed', 'user', target.id, target.email, { from:fromRole, to:body.role });
    persistDemo();
    return publicUser(target);
  }
  if((m=path.match(/^\/users\/([^/]+)$/)) && method==='DELETE'){
    const admin = requireRoleIn('admin');
    if(m[1]===admin.id) fail(400,"You can't remove your own account");
    const target = state.users.find(x=>x.id===m[1]); if(!target) fail(404,'User not found');
    if(target.role==='admin' && adminCount()<=1) fail(400,'At least one admin is required');
    state.users = state.users.filter(x=>x.id!==m[1]);
    logDemoActivity(state, admin, 'user.deleted', 'user', target.id, target.email, { role:target.role });
    persistDemo();
    return null;
  }

  // ---- Settings ----
  if(path==='/settings' && method==='GET'){
    requireAuthed();
    return { ...state.settings, runningNumber: state.tripSeq, nextNumber: state.tripSeq+1 };
  }
  if(path==='/settings' && method==='PUT'){
    const u = requireRoleIn('admin');
    state.settings = { prefix:body.prefix, includeYear:body.includeYear, padding:body.padding };
    logDemoActivity(state, u, 'settings.updated', 'settings', null, 'Trip numbering format', state.settings);
    persistDemo();
    return state.settings;
  }
  if(path==='/settings/trip-sequence' && method==='POST'){
    const u = requireRoleIn('admin');
    const maxExisting = state.trips.length ? Math.max(...state.trips.map(t=>t.seq||0)) : 0;
    const desired = body.nextNumber - 1;
    if(desired < maxExisting) fail(400, `Can't go below ${maxExisting+1} — that would collide with an existing trip.`);
    state.tripSeq = desired;
    logDemoActivity(state, u, 'trip_sequence.updated', 'settings', null, 'Trip numbering sequence', { nextNumber:body.nextNumber });
    persistDemo();
    return { runningNumber: state.tripSeq, nextNumber: state.tripSeq+1 };
  }

  // ---- Activity log ----
  if(path==='/activity' && method==='GET'){
    requireRoleIn('admin');
    return state.activityLog.slice(0, 200);
  }

  // ---- Public self-registration (no auth) ----
  if((m=path.match(/^\/public\/trips\/([^/]+)$/)) && method==='GET'){
    const t = state.trips.find(x=>x.publicToken===m[1]);
    if(!t) fail(404,'Registration link not found');
    const closed = ['Declined','Cancelled','Completed'].includes(t.status);
    return { name:t.name, type:t.type, destination:t.destination, startDate:t.startDate, endDate:t.endDate, acceptingRegistrations:!closed };
  }
  if((m=path.match(/^\/public\/trips\/([^/]+)\/register$/)) && method==='POST'){
    const t = state.trips.find(x=>x.publicToken===m[1]);
    if(!t) fail(404,'Registration link not found');
    const closed = ['Declined','Cancelled','Completed'].includes(t.status);
    if(closed) fail(400,'Registration is closed for this trip');
    if(!body.name) fail(400,'Name is required');
    const c = { id:demoId('cust'), tripId:t.id, name:body.name, dob:body.dob||null, phone:body.phone||null,
      idNumber:body.idNumber||null, medicalCondition:body.medicalCondition||null, passportNumber:body.passportNumber||null, passportExpiry:body.passportExpiry||null,
      amount:0, depositAmount:0, paymentStatus:'Pending', ticketPurchaser:null, ticketStatus:'Pending', airline:null,
      bookingReference:null, notes:body.notes||null, addedAt:new Date().toISOString() };
    state.passengers.push(c);
    logDemoActivity(state, { id:null, name:`${c.name} (self-registered)`, email:'public-registration@excapism.local' },
      'passenger.self_registered', 'passenger', c.id, c.name, { tripId:t.id, tripName:t.name });
    persistDemo();
    return { name:c.name };
  }

  fail(404, 'Not found');
}

   ========================================================= */
async function loadBootstrap(){
  try{
    const data = await apiFetch('/bootstrap');
    trips = data.trips || [];
    customers = data.passengers || [];
    users = data.users || [];
    numberSettings = Object.assign({prefix:'EXC',includeYear:true,padding:3,runningNumber:0,nextNumber:1}, data.settings || {});
  }catch(e){
    showToast(e.message || 'Could not load data from the server');
  }
}

/* =========================================================
   Auth
   Real server-side accounts — the API hashes passwords and
   issues a JWT; this client just holds that token in memory
   and sends it back on every request.
   ========================================================= */
function isAdmin(){ return !!currentUser && currentUser.role==='admin'; }
function isApproverOrAdmin(){ return !!currentUser && (currentUser.role==='approver' || currentUser.role==='admin'); }
function roleLabel(r){ return r.charAt(0).toUpperCase()+r.slice(1); }
function adminCount(){ return users.filter(u=>u.role==='admin').length; }

/* =========================================================
   Helpers
   ========================================================= */
function tripCode(t){
  const parts = [(numberSettings.prefix || 'EXC').toUpperCase()];
  if(numberSettings.includeYear){
    const yr = t.startDate ? new Date(t.startDate).getFullYear() : new Date(t.createdAt||Date.now()).getFullYear();
    parts.push(yr);
  }
  parts.push(String(t.seq).padStart(numberSettings.padding||3,'0'));
  return parts.join('-');
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + (String(d).length<=10 ? 'T00:00:00' : ''));
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtMoney(n){
  const v = Number(n)||0;
  return 'RM ' + v.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function custByTrip(tripId){ return customers.filter(c=>c.tripId===tripId); }
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>el.classList.remove('show'), 2400);
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function normType(v){
  const s = String(v||'').trim().toLowerCase();
  if(s.includes('private')) return 'private';
  return 'open';
}

/* =========================================================
   Approval flow rules
   ========================================================= */
function nextActions(status){
  if(status==='Draft') return [{to:'Pending',label:'Submit for approval',cls:'btn-primary',anyRole:true}];
  if(status==='Pending') return [{to:'Approved',label:'Approve trip',cls:'btn-gold'},{to:'Declined',label:'Decline trip',cls:'btn-danger'}];
  if(status==='Approved') return [{to:'Completed',label:'Mark completed',cls:'btn-gold'},{to:'Cancelled',label:'Cancel trip',cls:'btn-danger'}];
  if(status==='Declined' || status==='Cancelled') return [{to:'Draft',label:'Reopen as draft',cls:'btn-ghost',anyRole:true}];
  return [];
}
async function setTripStatus(tripId, newStatus){
  try{
    const updated = await apiFetch(`/trips/${tripId}/status`, { method:'POST', body: JSON.stringify({ status: newStatus }) });
    const idx = trips.findIndex(t=>t.id===tripId);
    if(idx>-1) trips[idx] = { ...trips[idx], ...updated };
    showToast('Trip marked ' + newStatus);
  }catch(e){
    showToast(e.message || 'Could not update trip status');
  }
  render();
}

/* =========================================================
   Render: root switch
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = '<div class="empty"><p>Loading manifest…</p></div>'; return; }
  if(API_NOT_CONFIGURED && !DEMO_MODE){ app.innerHTML = apiNotConfiguredHTML(); bindAuthEvents(); return; }
  if(authView==='signup'){ app.innerHTML = signupHTML(); bindAuthEvents(); return; }
  if(authView==='login'){ app.innerHTML = loginHTML(); bindAuthEvents(); return; }
  app.innerHTML = headerHTML() + tempBannerHTML() + (view.mode==='detail' ? detailHTML() : listHTML()) + modalsHTML() + (isAdmin() ? manageUsersModalHTML() + settingsModalHTML() + activityLogModalHTML() : '');
  bindEvents();
}

function listHTML(){
  let list = trips.filter(t=>{
    const matchSearch = !view.search || (t.name+t.destination+tripCode(t)).toLowerCase().includes(view.search.toLowerCase());
    const matchStatus = view.statusFilter==='All' || t.status===view.statusFilter;
    const matchType = view.typeFilter==='All' || t.type===view.typeFilter;
    return matchSearch && matchStatus && matchType;
  }).sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));

  const toolbar = `
  <div class="toolbar">
    <input class="search" id="search-input" placeholder="Search trips by name, destination or code…" value="${esc(view.search)}">
    <div class="chip-row" id="status-chips">
      ${['All',...TRIP_STATUSES].map(s=>`<button class="chip ${view.statusFilter===s?'active':''}" data-filter-status="${s}">${s}</button>`).join('')}
    </div>
    <div class="chip-row" id="type-chips">
      ${['All','open','private'].map(s=>`<button class="chip ${view.typeFilter===s?'active':''}" data-filter-type="${s}">${s==='All'?'All types':s.charAt(0).toUpperCase()+s.slice(1)+' trip'}</button>`).join('')}
    </div>
  </div>`;

  if(!trips.length){
    return toolbar + `
    <div class="empty">
      <h3>No trips yet</h3>
      <p>Create a trip or bulk-upload an Excel sheet of passengers to get started.</p>
      <button class="btn btn-primary" data-action="open-new-trip">+ New trip</button>
    </div>`;
  }
  if(!list.length){
    return toolbar + `<div class="empty"><h3>No trips match your filters</h3><p>Try clearing the search or filters.</p></div>`;
  }

  const cards = list.map(t=>{
    const cs = custByTrip(t.id);
    const paid = cs.filter(c=>c.paymentStatus==='Paid').length;
    return `
    <div class="stub" data-open-trip="${t.id}">
      <div class="stub-top">
        <div class="stub-code">${tripCode(t)}</div>
        <div class="stub-type">${t.type} trip</div>
        <p class="stub-name">${esc(t.name)}</p>
        <p class="stub-dest">${esc(t.destination||'Destination TBC')}</p>
      </div>
      <div class="stub-perf"></div>
      <div class="stub-bottom">
        <div class="stub-dates">${fmtDate(t.startDate)} → ${fmtDate(t.endDate)}</div>
        <div class="stamp ${t.status}">${t.status}</div>
      </div>
      <div class="stub-meta">
        <span><b>${cs.length}</b> pax</span>
        <span><b>${paid}</b> paid</span>
      </div>
    </div>`;
  }).join('');

  return toolbar + `<div class="trip-grid">${cards}</div>`;
}

/* =========================================================
   Render: detail view
   ========================================================= */
function detailHTML(){
  const t = trips.find(x=>x.id===view.tripId);
  if(!t){ view.mode='list'; return listHTML(); }
  const cs = custByTrip(t.id).sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||''));
  const total = cs.reduce((s,c)=>s+(Number(c.amount)||0),0);
  const collected = cs.reduce((s,c)=>{
    if(c.paymentStatus==='Paid') return s+(Number(c.amount)||0);
    if(c.paymentStatus==='Deposit') return s+(Number(c.depositAmount)||0);
    return s;
  },0);
  const paidCount = cs.filter(c=>c.paymentStatus==='Paid').length;

  const allActions = nextActions(t.status);
  const visibleActions = allActions.filter(a => a.anyRole || isApproverOrAdmin());
  const actions = visibleActions.length
    ? visibleActions.map(a=>`<button class="btn btn-sm ${a.cls}" data-trip-action="${a.to}">${a.label}</button>`).join('')
    : (allActions.length ? `<span class="hint" style="color:rgba(255,255,255,0.6);">Awaiting an approver</span>` : '');

  const showTicketCols = t.status==='Approved' || t.status==='Completed';
  const ticketHeaderCells = showTicketCols ? `<th>Ticket purchaser</th><th>Airline / Ref</th><th>Ticket status</th>` : '';
  const colCount = showTicketCols ? 9 : 6;

  const rows = cs.length ? cs.map(c=>`
    <tr data-cust-row="${c.id}">
      <td>
        <div class="cust-name">${esc(c.name)} ${c.medicalCondition ? `<span class="med-flag" title="${esc(c.medicalCondition)}">⚠</span>` : ''}</div>
        <div class="cust-sub">${c.dob ? 'DOB ' + fmtDate(c.dob) : (c.idNumber ? esc(c.idNumber) : '—')}</div>
      </td>
      <td>
        <div>${esc(c.phone||'—')}</div>
        ${c.passportNumber ? `<div class="cust-sub">🛂 ${esc(c.passportNumber)}${c.passportExpiry ? ' · exp ' + fmtDate(c.passportExpiry) : ''}</div>` : ''}
      </td>
      <td>${fmtMoney(c.amount)}</td>
      <td>${c.paymentStatus==='Deposit' ? fmtMoney(c.depositAmount) : '—'}</td>
      <td>
        <select class="status-select" data-cust-status="${c.id}">
          ${PAY_STATUSES.map(s=>`<option value="${s}" ${c.paymentStatus===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      ${showTicketCols ? `
      <td>${c.ticketPurchaser ? esc(c.ticketPurchaser) : '<span class="cust-sub">Not set</span>'}</td>
      <td>
        <div>${esc(c.airline||'—')}</div>
        ${c.bookingReference ? `<div class="cust-sub">${esc(c.bookingReference)}</div>` : ''}
      </td>
      <td>
        <select class="status-select" data-ticket-status="${c.id}">
          ${TICKET_STATUS_OPTIONS.map(s=>`<option value="${s}" ${c.ticketStatus===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>` : ''}
      <td>
        <div class="row-actions">
          <button class="icon-btn" data-edit-cust="${c.id}" title="Edit">✎</button>
          <button class="icon-btn danger" data-del-cust="${c.id}" title="Remove">✕</button>
        </div>
      </td>
    </tr>`).join('') :
    `<tr><td colspan="${colCount}" style="text-align:center;color:var(--ink-soft);padding:28px;">No passengers yet. Add one or bulk-upload an Excel sheet.</td></tr>`;

  return `
  <button class="back-link" data-action="back-to-list">← All trips</button>
  <div class="manifest-head">
    <div class="mh-left">
      <div class="eyebrow">${tripCode(t)} · ${t.type} trip</div>
      <h2>${esc(t.name)}</h2>
      <div class="mh-sub">${esc(t.destination||'Destination TBC')} · ${fmtDate(t.startDate)} → ${fmtDate(t.endDate)}</div>
      <button class="mh-edit" data-action="open-edit-trip">Edit trip details</button>
    </div>
    <div class="mh-right">
      <div class="stamp ${t.status}">${t.status}</div>
      <div class="approval-row">${actions}</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="label">Passengers</div><div class="value">${cs.length}</div></div>
    <div class="stat-card"><div class="label">Paid</div><div class="value">${paidCount}</div></div>
    <div class="stat-card"><div class="label">Expected total</div><div class="value">${fmtMoney(total)}</div></div>
    <div class="stat-card"><div class="label">Collected</div><div class="value">${fmtMoney(collected)}</div></div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h3>Passenger list</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">

  'passenger.created': 'added passenger',
  'passenger.updated': 'edited passenger',
  'passenger.payment_status_changed': 'updated payment status for',
  'passenger.ticket_status_changed': 'updated ticket status for',
  'passenger.deleted': 'removed passenger',
  'user.created': 'created account for',

function activityDetailText(entry){
  const d = entry.details || {};
  if(entry.action==='trip.status_changed' || entry.action==='passenger.payment_status_changed' || entry.action==='passenger.ticket_status_changed' || entry.action==='user.role_changed'){
    return `${d.from || '—'} → ${d.to || '—'}`;
  }
  if(entry.action==='trip.updated' || entry.action==='passenger.updated'){
    return d.updatedFields && d.updatedFields.length ? `Changed: ${d.updatedFields.join(', ')}` : '';
  }
  if(entry.action==='trip.bulk_import'){
    return `${d.importedCount||0} passenger(s), ${d.createdTripCount||0} new trip(s)`;
  }
  if(entry.action==='trip_sequence.updated'){
    return `Next number: ${d.nextNumber}`;
  }
  if(entry.action==='user.created' || entry.action==='user.deleted'){
    return d.role ? `Role: ${roleLabel(d.role)}` : '';
  }
  return '';
}

function exportTripToExcel(tripId){
  const t = trips.find(x=>x.id===tripId);
  if(!t) return;
  const cs = custByTrip(tripId);
  if(!cs.length){ showToast('No passengers to export yet'); return; }

  const rows = cs.map(c=>({
    'Full Name (As per IC)': c.name || '',
    'Date of Birth': c.dob || '',
    'IC/Passport': c.idNumber || '',
    'Contact Number': c.phone || '',
    'Trip Type': t.type === 'private' ? 'Private Trip' : 'Open Trip',
    'Location': t.destination || '',
    'Medical Condition/ history if applicable': c.medicalCondition || '',
    'Passport Number': c.passportNumber || '',
    'Passport Expiry': c.passportExpiry || '',
    'Payment Status': c.paymentStatus || 'Pending',
    'Amount (RM)': Number(c.amount)||0,
    'Deposit Paid (RM)': Number(c.depositAmount)||0,
    'Ticket Purchased By': c.ticketPurchaser || '',
    'Ticket Status': c.ticketStatus || 'Pending',
    'Airline': c.airline || '',
    'Booking Reference': c.bookingReference || '',
    'Notes': c.notes || '',
    'Submitted': c.submittedAt || ''
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [
    {wch:26},{wch:14},{wch:16},{wch:16},{wch:12},{wch:20},
    {wch:30},{wch:16},{wch:14},{wch:14},{wch:12},{wch:14},{wch:18},{wch:14},{wch:16},{wch:18},{wch:24},{wch:14}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Passengers');

  const safeName = (t.name||'trip').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'');
  const filename = `${tripCode(t)}_${safeName}_passengers.xlsx`;
  try{
    XLSX.writeFile(wb, filename);
    showToast('Passenger list downloading…');
  }catch(e){
    showToast('Could not export the passenger list');
  }
}

   ========================================================= */
function downloadTemplate(){
  try{
    const byteChars = atob(TEMPLATE_BASE64);
    const byteNumbers = new Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Excapism_Passenger_Upload_Template.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showToast('Template downloading…');
  }catch(e){
    showToast('Could not download the template');
  }
}

/* =========================================================
   Excel parsing
   ========================================================= */
const HEADER_MAP = {
  timestamp: ['timestamp'],
  name: ['full name (as per ic)','full name','name','customer name','passenger name','pax name'],
  dob: ['date of birth (d.o.b)','date of birth','dob','d.o.b'],
  phone: ['contact number','phone','phone number','contact','mobile','mobile number'],
  tripType: ['trip type','type'],
  location: ['location','destination'],
  medicalCondition: ['medical condition/ history if applicable','medical condition/history if applicable','medical condition','medical history','medical condition/ history'],
  passportNumber: ['passport number','passport no','passport num'],
  passportExpiry: ['passport expiry','passport expiry date','passport exp','expiry date'],
  idNumber: ['ic','ic no','ic number','identification','id no'],
  notes: ['notes','remarks','remark','note']
};
function normalizeHeader(h){ return String(h||'').trim().toLowerCase(); }
function mapHeaders(headerRow){
  const map = {};
  headerRow.forEach((h,i)=>{
    const norm = normalizeHeader(h);
    for(const key in HEADER_MAP){
      if(HEADER_MAP[key].includes(norm) && map[key]===undefined){ map[key]=i; }
    }
  });
  return map;
}
function excelDateToStr(v){
  if(v==null || v==='') return '';
  if(typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  const s = String(v).trim();
  const dt = new Date(s);
  if(!isNaN(dt) && /\d{4}/.test(s)) return dt.toISOString().slice(0,10);
  return s;
}
function parseWorkbookFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:false});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
        if(!rows.length){ resolve({rows:[], hasTripColumns:false}); return; }
        const headerRow = rows[0];
        const map = mapHeaders(headerRow);
        const hasTripColumns = map.tripType!==undefined && map.location!==undefined;
        const out = [];
        for(let i=1;i<rows.length;i++){
          const r = rows[i];
          if(!r || r.every(cell=>cell==='' || cell==null)) continue;
          const name = map.name!==undefined ? r[map.name] : '';
          if(!name) continue;
          out.push({
            timestamp: map.timestamp!==undefined ? excelDateToStr(r[map.timestamp]) : '',
            name: String(name).trim(),
            dob: map.dob!==undefined ? excelDateToStr(r[map.dob]) : '',
            phone: map.phone!==undefined ? String(r[map.phone]||'').trim() : '',
            tripType: map.tripType!==undefined ? String(r[map.tripType]||'').trim() : 'Open',
            location: map.location!==undefined ? String(r[map.location]||'').trim() : '',
            medicalCondition: map.medicalCondition!==undefined ? String(r[map.medicalCondition]||'').trim() : '',
            passportNumber: map.passportNumber!==undefined ? String(r[map.passportNumber]||'').trim() : '',
            passportExpiry: map.passportExpiry!==undefined ? excelDateToStr(r[map.passportExpiry]) : '',
            idNumber: map.idNumber!==undefined ? String(r[map.idNumber]||'').trim() : '',
            notes: map.notes!==undefined ? String(r[map.notes]||'').trim() : ''
          });
        }
        resolve({rows: out, hasTripColumns});
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
function buildGroups(rows){
  const map = new Map();
  rows.forEach(r=>{
    const type = normType(r.tripType);
    const location = r.location || 'Unspecified destination';
    const key = type + '|' + location.toLowerCase();
    if(!map.has(key)) map.set(key, {type, location, rows:[]});
    map.get(key).rows.push(r);
  });
  const groups = Array.from(map.values());
  groups.forEach(g=>{
    const existing = trips.find(x => normType(x.type)+'|'+String(x.destination||'').trim().toLowerCase() === g.type+'|'+g.location.toLowerCase());
    g.existingTripId = existing ? existing.id : null;
  });
  return groups;
}

function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

async function handleSignup(){
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim().toLowerCase();
  const password = document.getElementById('su-password').value;
  const password2 = document.getElementById('su-password2').value;
  if(!name || !email){ authError = 'Name and email are required.'; render(); return; }
  if(!isValidEmail(email)){ authError = 'Enter a valid email address.'; render(); return; }
  if(password.length < 6){ authError = 'Password must be at least 6 characters.'; render(); return; }
  if(password !== password2){ authError = 'Passwords do not match.'; render(); return; }

  try{
    const data = await apiFetch('/auth/signup', { method:'POST', body: JSON.stringify({ name, email, password }) });
    authToken = data.token;
    currentUser = data.user;
    saveSession();
    authError = '';
    authView = 'app';
    view = { mode:'list', tripId:null, search:'', statusFilter:'All', typeFilter:'All' };
    await loadBootstrap();
    showToast(currentUser.role==='admin' ? 'Admin account created — welcome!' : 'Account created — welcome!');
  }catch(e){
    authError = e.message || 'Could not create the account.';
  }
  render();
}

async function handleChangeRole(userId, newRole){
  const u = users.find(x=>x.id===userId);
  if(!u) return;
  try{
    const updated = await apiFetch(`/users/${userId}/role`, { method:'PUT', body: JSON.stringify({ role: newRole }) });
    Object.assign(u, updated);
    if(currentUser && currentUser.id===u.id) currentUser = { ...currentUser, role: updated.role };
    showToast('Role updated');
  }catch(e){
    showToast(e.message || 'Could not update that role');
  }
  render();
  openOverlay('overlay-users');
}

async function handleDeleteUser(userId){
  const u = users.find(x=>x.id===userId);
  if(!u || u.id===currentUser.id) return;
  if(!confirm(`Remove ${u.name}'s account?`)) return;
  try{
    await apiFetch(`/users/${userId}`, { method:'DELETE' });
    users = users.filter(x=>x.id!==userId);
    showToast('User removed');
  }catch(e){
    showToast(e.message || 'Could not remove that user');
  }
  render();
  openOverlay('overlay-users');
}

async function handleSaveTrip(){
  const name = document.getElementById('tr-name').value.trim();
  if(!name){ showToast('Trip name is required'); return; }
  const payload = {
    name,
    type: document.getElementById('tr-type').value,
    destination: document.getElementById('tr-dest').value.trim(),
    startDate: document.getElementById('tr-start').value,
    endDate: document.getElementById('tr-end').value
  };
  if(editingTripId){
    try{
      const updated = await apiFetch(`/trips/${editingTripId}`, { method:'PUT', body: JSON.stringify(payload) });
      const idx = trips.findIndex(t=>t.id===editingTripId);
      if(idx>-1) trips[idx] = { ...trips[idx], ...updated };
      showToast('Trip updated');
      closeOverlay('overlay-trip');
    }catch(e){
      showToast(e.message || 'Could not update the trip');
    }
    render();
  } else {
    try{
      const t = await apiFetch('/trips', { method:'POST', body: JSON.stringify(payload) });
      trips.push({ ...t, passengerCount: 0 });
      closeOverlay('overlay-trip');
      showToast('Trip created');
      view.mode='detail'; view.tripId=t.id;
    }catch(e){
      showToast(e.message || 'Could not create the trip');
    }
    render();
  }
}

async function handleDeleteTrip(){
  if(!editingTripId) return;
  if(!confirm('Delete this trip and all its passenger records? This cannot be undone.')) return;
  try{
    await apiFetch(`/trips/${editingTripId}`, { method:'DELETE' });
    trips = trips.filter(t=>t.id!==editingTripId);
    customers = customers.filter(c=>c.tripId!==editingTripId);
    closeOverlay('overlay-trip');
    showToast('Trip deleted');
    view.mode='list'; view.tripId=null;
  }catch(e){
    showToast(e.message || 'Could not delete the trip');
  }
  render();
}

async function handleSaveCustomer(){
  const name = document.getElementById('cu-name').value.trim();
  if(!name){ showToast('Passenger name is required'); return; }
  const payload = {
    name,
    dob: document.getElementById('cu-dob').value,
    phone: document.getElementById('cu-phone').value.trim(),
    idNumber: document.getElementById('cu-idnum').value.trim(),
    medicalCondition: document.getElementById('cu-medical').value.trim(),
    passportNumber: document.getElementById('cu-passport-number').value.trim(),
    passportExpiry: document.getElementById('cu-passport-expiry').value,
    amount: Number(document.getElementById('cu-amount').value)||0,
    depositAmount: Number(document.getElementById('cu-deposit').value)||0,
    paymentStatus: document.getElementById('cu-status').value,
    notes: document.getElementById('cu-notes').value.trim()
  };
  // Ticket fields only render in the modal once the trip is Approved+ —
  // guard each lookup so this doesn't break when they're absent.
  const ticketPurchaserEl = document.getElementById('cu-ticket-purchaser');
  const ticketStatusEl = document.getElementById('cu-ticket-status');
  const airlineEl = document.getElementById('cu-airline');
  const bookingRefEl = document.getElementById('cu-booking-ref');
  if(ticketPurchaserEl) payload.ticketPurchaser = ticketPurchaserEl.value;
  if(ticketStatusEl) payload.ticketStatus = ticketStatusEl.value;
  if(airlineEl) payload.airline = airlineEl.value.trim();
  if(bookingRefEl) payload.bookingReference = bookingRefEl.value.trim();
  if(editingCustomerId){
    try{
      const updated = await apiFetch(`/passengers/${editingCustomerId}`, { method:'PUT', body: JSON.stringify(payload) });
      const idx = customers.findIndex(c=>c.id===editingCustomerId);
      if(idx>-1) customers[idx] = updated;
      showToast('Passenger updated');
    }catch(e){
      showToast(e.message || 'Could not update the passenger');
    }
  } else {
    try{
      const created = await apiFetch(`/trips/${view.tripId}/passengers`, { method:'POST', body: JSON.stringify(payload) });
      customers.push(created);
      const t = trips.find(x=>x.id===view.tripId);
      if(t) t.passengerCount = (t.passengerCount||0) + 1;
      showToast('Passenger added');
    }catch(e){
      showToast(e.message || 'Could not add the passenger');
    }
  }
  closeOverlay('overlay-customer');
  render();
}

async function handleDeleteCustomer(id, fromModal){
  if(!id) return;
  if(!confirm('Remove this passenger from the trip?')) return;
  try{
    const c = customers.find(x=>x.id===id);
    await apiFetch(`/passengers/${id}`, { method:'DELETE' });
    customers = customers.filter(x=>x.id!==id);
    if(c){ const t = trips.find(x=>x.id===c.tripId); if(t) t.passengerCount = Math.max(0,(t.passengerCount||1)-1); }
    if(fromModal) closeOverlay('overlay-customer');
    showToast('Passenger removed');
  }catch(e){
    showToast(e.message || 'Could not remove that passenger');
  }
  render();
}

async function handleFile(file){
  uploadCtx.fileName = file.name;
  try{
    const {rows, hasTripColumns} = await parseWorkbookFile(file);
    if(!rows.length){
      showToast('No passenger rows detected — check the file has a Name column');
      uploadCtx.parsedRows = [];
      uploadCtx.groups = [];
    }else{
      uploadCtx.parsedRows = rows;
      uploadCtx.hasTripColumns = hasTripColumns;
      uploadCtx.groups = hasTripColumns ? buildGroups(rows) : [];
    }
  }catch(err){
    showToast('Could not read that file');
    uploadCtx.parsedRows = [];
    uploadCtx.groups = [];
  }
  render();
  openOverlay('overlay-upload');
}

async function handleConfirmUpload(){
  const rowsToImport = uploadCtx.parsedRows;

  if(uploadCtx.groups.length){
    // Trip Type + Location present — the server groups rows into the right
    // trips (matching existing ones or creating new Draft trips) atomically.
    try{
      const result = await apiFetch('/trips/bulk-import', { method:'POST', body: JSON.stringify({ rows: rowsToImport }) });
      await loadBootstrap();
      closeOverlay('overlay-upload');
      showToast(`${result.importedCount} passenger(s) imported`);
      uploadCtx = {mode:'existing', targetTripId:null, parsedRows:[], fileName:'', groups:[], hasTripColumns:false};
      if(result.tripIds && result.tripIds.length===1){
        view.mode='detail'; view.tripId=result.tripIds[0];
      } else {
        view.mode='list';
      }
    }catch(e){
      showToast(e.message || 'Could not import passengers');
    }
    render();
    return;
  }

  // Manual single-target flow (fallback when Trip Type/Location columns are absent)
  let targetId = null;
  if(uploadCtx.mode==='existing'){
    const sel = document.getElementById('up-trip-select');
    targetId = sel ? sel.value : uploadCtx.targetTripId;
    if(!targetId){ showToast('Choose a trip to upload into'); return; }
  } else {
    const nameEl = document.getElementById('up-nt-name');
    const name = nameEl ? nameEl.value.trim() : '';
    if(!name){ showToast('Trip name is required'); return; }
    try{
      const t = await apiFetch('/trips', { method:'POST', body: JSON.stringify({
        name,
        type: document.getElementById('up-nt-type').value,
        destination: document.getElementById('up-nt-dest').value.trim(),
        startDate:'', endDate:''
      }) });
      trips.push({ ...t, passengerCount: 0 });
      targetId = t.id;
    }catch(e){
      showToast(e.message || 'Could not create the trip');
      return;
    }
  }

  try{
    const created = await Promise.all(rowsToImport.map(r => apiFetch(`/trips/${targetId}/passengers`, {
      method:'POST',
      body: JSON.stringify({
        name: r.name, dob: r.dob, phone: r.phone, idNumber: r.idNumber,
        medicalCondition: r.medicalCondition, passportNumber: r.passportNumber, passportExpiry: r.passportExpiry, notes: r.notes,
      })
    })));
    customers = customers.concat(created);
    const t = trips.find(x=>x.id===targetId);
    if(t) t.passengerCount = (t.passengerCount||0) + created.length;

    closeOverlay('overlay-upload');
    showToast(`${created.length} passenger(s) imported`);
    uploadCtx = {mode:'existing', targetTripId:null, parsedRows:[], fileName:'', groups:[], hasTripColumns:false};
    view.mode='detail'; view.tripId=targetId;
  }catch(e){
    showToast(e.message || 'Some passengers could not be imported');
  }
  render();
}

/* =========================================================
   Public self-registration page
   A completely separate, unauthenticated view — reached via
   ?register=TOKEN in the URL. Never touches currentUser, trips,
   customers, or any other app state; only ever knows about the one
   trip its token points to.
   ========================================================= */
let publicReg = { status:'loading', trip:null, error:'', submittedName:'' }; // status: loading|form|closed|invalid|success

function publicRegShell(inner){
  return `
  <div style="max-width:460px;margin:60px auto 0;">
    <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:26px;">
      <div class="brand-badge">EX</div>
      <div>
        <h1 style="font-family:var(--font-display);font-weight:700;font-size:20px;margin:0;color:var(--navy-deep);">Excapism Passenger Manifest</h1>
        <p style="margin:0;font-size:12.5px;color:var(--ink-soft);">Passenger registration</p>
      </div>
    </div>
    <div class="panel" style="padding:26px 24px;">${inner}</div>
  </div>`;
}
function publicRegistrationHTML(){
  if(publicReg.status==='loading'){
    return publicRegShell(`<p style="text-align:center;color:var(--ink-soft);margin:20px 0;">Loading…</p>`);
  }
  if(publicReg.status==='invalid'){
    return publicRegShell(`
      <h3 style="font-family:var(--font-display);font-size:18px;margin:0 0 8px;color:var(--navy-deep);">Link not found</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0;">This registration link isn't valid. Please double-check the link, or contact whoever sent it to you.</p>
    `);
  }
  if(publicReg.status==='closed'){
    const t = publicReg.trip;
    return publicRegShell(`
      <h3 style="font-family:var(--font-display);font-size:18px;margin:0 0 8px;color:var(--navy-deep);">${esc(t.name)}</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0;">Registration is closed for this trip. Please contact your travel coordinator if you believe this is a mistake.</p>
    `);
  }
  if(publicReg.status==='success'){
    return publicRegShell(`
      <h3 style="font-family:var(--font-display);font-size:18px;margin:0 0 8px;color:var(--navy-deep);">You're registered! 🎉</h3>
      <p style="font-size:13.5px;color:var(--ink);margin:0;">Thanks, <b>${esc(publicReg.submittedName)}</b> — your details have been received. Your travel coordinator will be in touch with next steps.</p>
    `);
  }

  const t = publicReg.trip;
  return publicRegShell(`
    <div style="margin-bottom:16px;">
      <h3 style="font-family:var(--font-display);font-size:18px;margin:0 0 4px;color:var(--navy-deep);">${esc(t.name)}</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin:0;">${esc(t.destination||'Destination TBC')} ${t.startDate ? '· ' + fmtDate(t.startDate) + ' → ' + fmtDate(t.endDate) : ''}</p>
    </div>
    ${publicReg.error ? `<p style="color:var(--coral);font-size:13px;margin:0 0 12px;font-weight:600;">${esc(publicReg.error)}</p>` : ''}
    <div class="field"><label>Full name (as per IC)</label><input id="pr-name" placeholder="As per IC / passport"></div>
    <div class="field-row">
      <div class="field"><label>Date of birth</label><input type="date" id="pr-dob"></div>
      <div class="field"><label>Contact number</label><input id="pr-phone"></div>
    </div>
    <div class="field"><label>IC / Passport no. <span style="font-weight:400;">(optional)</span></label><input id="pr-idnum"></div>
    <div class="field"><label>Medical condition / history <span style="font-weight:400;">(if applicable)</span></label><textarea id="pr-medical" rows="2" placeholder="Leave blank if none"></textarea></div>
    <div class="field-row">
      <div class="field"><label>Passport number <span style="font-weight:400;">(optional)</span></label><input id="pr-passport-number"></div>
      <div class="field"><label>Passport expiry date</label><input type="date" id="pr-passport-expiry"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="pr-notes" rows="2"></textarea></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" data-action="submit-public-registration">Submit registration</button>
    <p class="hint" style="margin-top:14px;">Your details are only visible to your travel coordinator's team — this link doesn't show you anyone else's information.</p>
  `);
}
async function loadPublicTrip(token){
  try{
    const trip = await publicApiFetch(`/public/trips/${token}`);
    publicReg.trip = trip;
    publicReg.status = trip.acceptingRegistrations ? 'form' : 'closed';
  }catch(e){
    publicReg.status = 'invalid';
  }
  render();
}
async function handlePublicRegistrationSubmit(token){
  const name = document.getElementById('pr-name').value.trim();
  if(!name){ publicReg.error = 'Full name is required.'; render(); return; }
  const payload = {
    name,
    dob: document.getElementById('pr-dob').value,
    phone: document.getElementById('pr-phone').value.trim(),
    idNumber: document.getElementById('pr-idnum').value.trim(),
    medicalCondition: document.getElementById('pr-medical').value.trim(),
    passportNumber: document.getElementById('pr-passport-number').value.trim(),
    passportExpiry: document.getElementById('pr-passport-expiry').value,
    notes: document.getElementById('pr-notes').value.trim(),
  };
  try{
    const result = await publicApiFetch(`/public/trips/${token}/register`, { method:'POST', body: JSON.stringify(payload) });
    publicReg.status = 'success';
    publicReg.submittedName = result.name || name;
    publicReg.error = '';
  }catch(e){
    publicReg.error = e.message || 'Could not submit your registration — please try again.';
  }
  render();
}
function bindPublicRegistrationEvents(token){
  const app = document.getElementById('app');
  const btn = app.querySelector('[data-action="submit-public-registration"]');
  if(btn) btn.addEventListener('click', ()=>handlePublicRegistrationSubmit(token));
  app.querySelectorAll('input, textarea').forEach(inp=>{
    inp.addEventListener('keydown', (e)=>{ if(e.key==='Enter' && e.target.tagName==='INPUT'){ const b = app.querySelector('[data-action="submit-public-registration"]'); if(b) b.click(); } });
  });
}

/* =========================================================
   Init
   If a saved session exists (from a previous sign-in) and its token
   still checks out against the API, restore it straight into the app
   instead of showing the login screen again.
   ========================================================= */
(async function init(){
  loaded = true;
  const registerToken = new URLSearchParams(location.search).get('register');
  if(registerToken){
    // Public registration is a fully separate flow — never touches
    // login state, never calls restoreSession/loadBootstrap.
    render = (function(originalRender){
      return function(){
        const app = document.getElementById('app');
        app.innerHTML = publicRegistrationHTML();
        bindPublicRegistrationEvents(registerToken);
      };
    })(render);
    render();
    await loadPublicTrip(registerToken);
    return;
  }
  const restored = await restoreSession();
  if(!restored) authView = 'login';
  render();
})();
</script>
</body>
</html>
