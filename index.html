    ${anyFilter ? `<button class="btn btn-sm btn-ghost" data-dash-reset>Reset filters</button>` : ''}
  </div>
  <p class="dash-scope">Showing: <b>${esc(scope)}</b> · ${m.list.length} trip${m.list.length===1?'':'s'}</p>`;

  const canApprove = isApproverOrAdmin();
  const approvedUp = m.upcoming.filter(t=>tripMainStatus(t)==='Paid').length;
  const approvedMonth = m.thisMonth.filter(t=>tripMainStatus(t)==='Paid').length;
  const deadN = m.list.length - m.activeCount;
  const kpi = (label, value, sub, extra='', title='') => `
    <div class="stat-card ${extra}" ${title?`title="${esc(title)}"`:''}><div class="label">${label}</div><div class="value">${value}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;

  const row1 = `
  <div class="dash-kpis">
    ${kpi('Total trips', m.list.length, `${m.activeCount} active${deadN?` · ${deadN} cancelled`:''}`, '', 'All trips matching the filters, whatever their status')}
    ${kpi('Trips this month', m.thisMonth.length, `${approvedMonth} paid · ${m.thisMonth.length-approvedMonth} not yet paid`, '', 'Trips starting this month that have not ended yet (cancelled excluded)')}
    ${kpi('Upcoming trips', m.upcoming.length, `${approvedUp} paid · ${m.upcoming.length-approvedUp} draft / pending payment`, '', 'Trips not yet completed whose end date has not passed (cancelled excluded)')}
    ${canApprove
      ? `<button class="stat-card is-link ${m.awaiting.length?'is-alert':''}" data-dash-approvals title="Open the trips that need action"><div class="label">Actions needed</div><div class="value">${m.awaiting.length}</div><div class="sub">${m.awaiting.length?'Click to review':'Nothing waiting'}</div></button>`
      : kpi('Actions needed', m.awaiting.length, m.awaiting.length?'With the approvers':'Nothing waiting', m.awaiting.length?'is-alert':'')}
  </div>`;

  const t = m.totals;
  const row2 = `
  <div class="dash-kpis">
    ${kpi('Total passengers', t.pax, m.countedList.length ? `avg ${(t.pax/m.countedList.length).toFixed(1)} per trip` : '', '', 'Passengers on the trips in view (cancelled trips excluded unless filtered)')}
    ${kpi('Total amount', fmtRM(t.amount), 'Package amounts, all passengers')}
    ${kpi('Total payment', fmtRM(t.collected), `${pctText(t.collected, t.amount)} of amount collected`, '', 'Paid = full amount; Deposit = deposit + payment')}
    ${kpi('Outstanding balance', fmtRM(t.balance), `${m.countedList.filter(x=>m.money(x).balance>0).length} trip(s) still owing`)}
  </div>`;

  // ---- Period chart / table ----
  const md = DASH_METRICS[dashMetric];
  const unitLabel = f.year==='All' ? 'year' : `month · ${f.year}`;
  const metricChips = Object.entries(DASH_METRICS).map(([k,d])=>chip('data-dash-metric', k, d.label, dashMetric===k)).join('');
  const viewChips = [['chart','Chart'],['table','Table']].map(([k,l])=>chip('data-dash-periodview', k, l, dashPeriodView===k)).join('');
  const periodBody = dashPeriodView==='table' ? periodTableHTML(m.buckets, f.year==='All' ? 'Year' : 'Month') : columnChartSVG(m.buckets, dashMetric);
  const periodPanel = `
  <div class="panel">
    <div class="panel-head"><h3>${md.label} by ${unitLabel}</h3><div class="chip-row">${viewChips}</div></div>
    <div class="dash-body">
      <div class="chip-row" style="margin-bottom:10px;">${metricChips}</div>
      ${periodBody}
    </div>
  </div>`;

  // ---- Yearly summary ----
  const yTot = m.yearly.reduce((a,r)=>({trips:a.trips+r.trips,pax:a.pax+r.pax,amount:a.amount+r.amount,collected:a.collected+r.collected,balance:a.balance+r.balance}),{trips:0,pax:0,amount:0,collected:0,balance:0});
  const yearlyPanel = `
  <div class="panel">
    <div class="panel-head"><h3>Yearly summary</h3><span class="dash-note" style="margin:0;">Click a year to filter</span></div>
    <div style="overflow-x:auto;"><table class="dash-table">
      <thead><tr><th>Year</th><th class="num">Trips</th><th class="num">Pax</th><th class="num">Amount</th><th class="num">Payment</th><th class="num">Balance</th><th class="num">% paid</th></tr></thead>
      <tbody>
        ${m.yearly.length ? m.yearly.map(r=>`<tr data-dash-year="${esc(r.label)}" class="${String(f.year)===r.label?'is-selected':''}">
          <td><b>${esc(r.label)}</b></td><td class="num">${r.trips}</td><td class="num">${r.pax}</td><td class="num">${fmtRM(r.amount)}</td><td class="num">${fmtRM(r.collected)}</td><td class="num">${fmtRM(r.balance)}</td><td class="num">${pctText(r.collected,r.amount)}</td></tr>`).join('')
          + (m.yearly.length>1 ? `<tr class="is-total"><td>All years</td><td class="num">${yTot.trips}</td><td class="num">${yTot.pax}</td><td class="num">${fmtRM(yTot.amount)}</td><td class="num">${fmtRM(yTot.collected)}</td><td class="num">${fmtRM(yTot.balance)}</td><td class="num">${pctText(yTot.collected,yTot.amount)}</td></tr>` : '')
          : `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);">No trips match.</td></tr>`}
      </tbody>
    </table></div>
  </div>`;

  // ---- Status / type / payment ----
  const maxStatus = Math.max(1, ...m.statusRows.map(r=>r.n));
  const maxPay = Math.max(1, ...m.payRows.map(r=>r.n));
  const hbars = (rows, max) => rows.map(r=>`<div class="hbar-row"><div class="hbar-label">${esc(r.label)}</div><div class="hbar-track"><div class="hbar-fill" style="width:${r.n/max*100}%;${r.n>0?'min-width:4px;':''}"></div></div><div class="hbar-val">${r.n}</div></div>`).join('');
  const breakdownPanel = `
  <div class="panel">
    <div class="panel-head"><h3>Trips &amp; passengers breakdown</h3></div>
    <div class="dash-body">
      <div class="dash-sub" style="margin-top:0;">Trips by status</div>
      ${hbars(m.statusRows, maxStatus)}
      <div class="dash-sub">Operations (submitted trips)</div>
      ${hbars(m.opsRows, Math.max(1, ...m.opsRows.map(r=>r.n)))}
      <div class="dash-sub">Passengers by payment status</div>
      ${hbars(m.payRows, maxPay)}
      <div class="dash-sub">Open vs private</div>
      ${m.typeRows.map(r=>`<div class="hbar-row" style="grid-template-columns:96px 1fr;"><div class="hbar-label">${esc(r.label)}</div><div>${r.trips} trip${r.trips===1?'':'s'} · ${r.pax} pax</div></div>`).join('')}
    </div>
  </div>`;

  // ---- Attention ----
  const attn = (n, title, detail) => `<li><span class="n ${n===0?'ok':''}">${n===0?'✓':n}</span><span>${title}<span class="t">${n===0?'All clear':detail}</span></span></li>`;
  const attentionPanel = `
  <div class="panel">
    <div class="panel-head"><h3>Needs attention</h3></div>
    <div class="dash-body"><ul class="dash-attn">
      ${attn(m.awaiting.length, 'Trips need action', 'Pending Payment, Pending Ops, Ongoing or On-hold')}
      ${attn(m.ticketPax, 'Flight tickets to purchase', `${m.ticketPax} passenger(s) on ${m.ticketTrips.size} trip(s) in Operations with the ticket still Pending`)}
      ${attn(m.due30.length, 'Departing within 30 days with a balance due', 'Collect the remaining payment before departure')}
      ${attn(m.emptyTrips.length, 'Upcoming trips with no passengers', 'Add passengers or share the registration link')}
    </ul></div>
  </div>`;

  // ---- Destinations ----
  const destPanel = `
  <div class="panel">
    <div class="panel-head"><h3>Top destinations</h3><span class="dash-note" style="margin:0;">By passengers</span></div>
    <div style="overflow-x:auto;"><table class="dash-table">
      <thead><tr><th>Destination</th><th class="num">Trips</th><th class="num">Pax</th><th class="num">Amount</th><th class="num">Payment</th></tr></thead>
      <tbody>${m.destinations.length ? m.destinations.map(d=>`<tr><td>${esc(d.name)}</td><td class="num">${d.trips}</td><td class="num">${d.pax}</td><td class="num">${fmtRM(d.amount)}</td><td class="num">${fmtRM(d.collected)}</td></tr>`).join('')
        : `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);">No trips match.</td></tr>`}</tbody>
    </table></div>
  </div>`;

  // ---- Upcoming departures ----
  const upRows = m.upcoming.slice(0,8).map(tr=>{
    const start = tripStartYmd(tr);
    const days = daysBetweenYmd(m.today, start);
    const when = days<0 ? 'Ongoing' : days===0 ? 'Today' : `in ${days} day${days===1?'':'s'}`;
    const x = m.money(tr);
    const warn = x.balance>0 && days>=0 && days<=30;
    return `<tr data-dash-open-trip="${esc(tr.id)}">
      <td>${fmtDate(start)}<div class="cust-sub">${when}</div></td>
      <td><span style="font-family:var(--font-mono);font-size:12px;color:var(--navy);font-weight:600;">${esc(tripCode(tr))}</span><div class="cust-sub">${esc(tr.name)}</div></td>
      <td>${stampHTML(tr, 'style="display:inline-block;"')}</td>
      <td class="num">${x.pax}</td>
      <td class="num">${warn?`<span title="Departing within 30 days with a balance due">⚠ </span>`:''}${fmtRM(x.balance)}</td></tr>`;
  }).join('');
  const upcomingPanel = `
  <div class="panel">
    <div class="panel-head"><h3>Next departures</h3><span class="dash-note" style="margin:0;">${m.upcoming.length>8?`Next 8 of ${m.upcoming.length}`:'Click a trip to open it'}</span></div>
    <div style="overflow-x:auto;"><table class="dash-table">
      <thead><tr><th>Departs</th><th>Trip</th><th>Status</th><th class="num">Pax</th><th class="num">Balance</th></tr></thead>
      <tbody>${upRows || `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);">No upcoming trips.</td></tr>`}</tbody>
    </table></div>
  </div>`;

  return `
  ${filters}
  ${row1}
  ${row2}
  <div class="dash-grid2">${periodPanel}${yearlyPanel}</div>
  <div class="dash-grid2">${upcomingPanel}${attentionPanel}</div>
  <div class="dash-grid2">${breakdownPanel}${destPanel}</div>
  <p class="dash-note">Year follows the trip code (the year of the start date). Passengers and money leave out Declined/Cancelled trips unless you filter to them, and use the same rules as each trip page: Paid = full amount, Deposit = deposit + payment. Balance = amount − payment.</p>`;
}

function periodTableHTML(buckets, firstCol){
  return `<div style="overflow-x:auto;"><table class="dash-table">
    <thead><tr><th>${firstCol}</th><th class="num">Trips</th><th class="num">Pax</th><th class="num">Amount</th><th class="num">Payment</th><th class="num">Balance</th></tr></thead>
    <tbody>${buckets.map(b=>`<tr><td>${esc(b.full)}</td><td class="num">${b.trips}</td><td class="num">${b.pax}</td><td class="num">${fmtRM(b.amount)}</td><td class="num">${fmtRM(b.collected)}</td><td class="num">${fmtRM(b.balance)}</td></tr>`).join('')}</tbody>
  </table></div>`;
}

function columnChartSVG(buckets, metric){
  const def = DASH_METRICS[metric];
  const vals = buckets.map(b=>Number(b[metric])||0);
  const maxVal = Math.max(0, ...vals);
  if(!buckets.length || maxVal===0){
    return `<p class="dash-note" style="padding:26px 0;text-align:center;">No ${def.label.toLowerCase()} to chart for these filters.</p>`;
  }
  const niceCeil = v => { const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; };
  let step = niceCeil(maxVal/4);
  if(!def.money) step = Math.max(1, step);
  const top = step*Math.ceil(maxVal/step);
  const W=640, H=250, L=54, R=10, T=22, B=28;
  const pw=W-L-R, ph=H-T-B, base=T+ph;
  const y = v => T + ph - (v/top)*ph;
  const band = pw/buckets.length;
  const bw = Math.min(24, band-4);
  const fmtTick = v => def.money ? (v===0?'0':'RM '+fmtCompact(v)) : String(v);
  const fmtVal = v => def.money ? fmtRM(v) : String(v);
  let g = '';
  for(let v=0; v<=top+1e-9; v+=step){
    g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${fmtTick(v)}</text>`;
  }
  const peakIdx = vals.indexOf(maxVal);
  buckets.forEach((b,i)=>{
    const v = vals[i];
    const cx = L + band*i + band/2, x = cx - bw/2;
    if(v>0){
      const yy = y(v), h = base-yy, r = Math.min(4, h);
      g += `<path class="bar" d="M${x},${base} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${base} Z"/>`;
    }
    if(i===peakIdx) g += `<text class="peak" x="${cx}" y="${Math.max(12, y(v)-6)}" text-anchor="middle">${fmtVal(v)}</text>`;
    g += `<text x="${cx}" y="${H-9}" text-anchor="middle">${esc(b.label)}</text>`;
    const tip = `${b.trips} trip${b.trips===1?'':'s'} · ${b.pax} pax`;
    g += `<rect class="hit" x="${L+band*i}" y="${T}" width="${band}" height="${ph}" tabindex="0" data-tv="${esc(fmtVal(v))}" data-tl="${esc(b.full+' · '+def.label)}" data-tx="${esc(tip)}" aria-label="${esc(b.full+': '+fmtVal(v)+' '+def.label.toLowerCase())}"/>`;
  });
  return `<svg class="dash-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(def.label)} chart, highest ${esc(buckets[peakIdx].full)} at ${esc(fmtVal(maxVal))}">${g}</svg>`;
}

function tabsHTML(){
  if(view.mode==='detail') return '';
  const m = view.mode;
  const t = (id,label)=>`<button class="tab ${m===id?'active':''}" role="tab" aria-selected="${m===id}" data-view-mode="${id}">${label}</button>`;
  return `<div class="tabs" role="tablist">
    ${t('list','Trips')}${t('dashboard','Dashboard')}${t('calendar','Calendar')}
  </div>`;
}

function bindDashboardEvents(app){
  let tip = document.getElementById('dash-tip');
  if(!tip){ tip = document.createElement('div'); tip.id = 'dash-tip'; tip.setAttribute('role','tooltip'); document.body.appendChild(tip); }
  tip.style.display = 'none';

  app.querySelectorAll('[data-view-mode]').forEach(el=>{
    el.addEventListener('click', ()=>{ view.mode = el.dataset.viewMode; view.returnTo = null; render(); });
  });
  if(view.mode!=='dashboard') return;

  const set = (k, v) => { dashFilter[k] = v; render(); };
  app.querySelectorAll('[data-dash-year]').forEach(el=>el.addEventListener('click', ()=>set('year', el.dataset.dashYear)));
  app.querySelectorAll('[data-dash-type]').forEach(el=>el.addEventListener('click', ()=>set('type', el.dataset.dashType)));
  const mSel = app.querySelector('#dash-month'); if(mSel) mSel.addEventListener('change', ()=>set('month', mSel.value));
  const sSel = app.querySelector('#dash-status'); if(sSel) sSel.addEventListener('change', ()=>set('status', sSel.value));
  const reset = app.querySelector('[data-dash-reset]');
  if(reset) reset.addEventListener('click', ()=>{ dashFilter = { year:'All', month:'All', type:'All', status:'All' }; render(); });
  app.querySelectorAll('[data-dash-metric]').forEach(el=>el.addEventListener('click', ()=>{ dashMetric = el.dataset.dashMetric; render(); }));
  app.querySelectorAll('[data-dash-periodview]').forEach(el=>el.addEventListener('click', ()=>{ dashPeriodView = el.dataset.dashPeriodview; render(); }));
  const appr = app.querySelector('[data-dash-approvals]');
  if(appr) appr.addEventListener('click', ()=>{
    view = { mode:'list', tripId:null, search:'', statusFilter:'All', opsFilter:'Action', typeFilter:'All', layout:view.layout };
    render();
  });
  app.querySelectorAll('[data-dash-open-trip]').forEach(el=>el.addEventListener('click', ()=>{
    view.mode = 'detail'; view.tripId = el.dataset.dashOpenTrip; view.returnTo = 'dashboard'; passengerFilterKeyword = ''; render();
  }));

  // Chart tooltip: value first, then what it is, then context. textContent only.
  const showTip = (el, x, y) => {
    tip.textContent = '';
    [['tip-v', el.dataset.tv], ['tip-l', el.dataset.tl], ['tip-l', el.dataset.tx]].forEach(([cls, txt])=>{
      if(!txt) return;
      const d = document.createElement('div'); d.className = cls; d.textContent = txt; tip.appendChild(d);
    });
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(x+14, window.innerWidth-w-8)) + 'px';
    tip.style.top = Math.max(8, Math.min(y-h-10, window.innerHeight-h-8)) + 'px';
  };
  const hideTip = () => { tip.style.display = 'none'; };
  app.querySelectorAll('.dash-chart .hit').forEach(el=>{
    el.addEventListener('pointermove', e=>showTip(el, e.clientX, e.clientY));
    el.addEventListener('pointerleave', hideTip);
    el.addEventListener('focus', ()=>{ const r=el.getBoundingClientRect(); showTip(el, r.left+r.width/2, r.top+30); });
    el.addEventListener('blur', hideTip);
  });
}

/* =========================================================
   Calendar — one month at a time; each trip is a bar across its dates
   (it wraps across week rows and continues into the next month).
   Same data as everything else (trips[]), so nothing extra to load.
   ========================================================= */
let calCursor = null;        // { y, m } with m = 0..11; null means "the current month"
let calType = 'All';         // 'All' | 'open' | 'private'
let calShowDead = false;     // declined / cancelled trips hidden unless switched on
let calKeysBound = false;
const CAL_HEAD = 28, CAL_LANE = 24, CAL_MIN_WEEK = 92;
const DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function dayNum(s){ const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d)/86400000; }
function dayYmd(n){ const d = new Date(n*86400000); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`; }
function calEnsure(){
  if(!calCursor){ const t = todayYmd(); calCursor = { y:Number(t.slice(0,4)), m:Number(t.slice(5,7))-1 }; }
  return calCursor;
}
function calShift(delta){
  const c = calEnsure();
  const total = c.y*12 + c.m + delta;
  calCursor = { y:Math.floor(total/12), m:((total%12)+12)%12 };
}
function calItems(){
  return trips.filter(t=>ymd(t.startDate) && (calShowDead || !isCancelledTrip(t)) && (calType==='All' || t.type===calType))
    .map(t=>{
      const s = dayNum(ymd(t.startDate));
      const e = Math.max(s, ymd(t.endDate) ? dayNum(ymd(t.endDate)) : s);
      return { t, s, e };
    })
    .sort((a,b)=>a.s-b.s || (b.e-b.s)-(a.e-a.s) || (a.t.name||'').localeCompare(b.t.name||''));
}
function calWeekStarts(y, m){
  const first = Date.UTC(y, m, 1)/86400000;
  const dow = new Date(first*86400000).getUTCDay();            // 0 = Sunday
  const dim = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
  return Array.from({ length: Math.ceil((dow+dim)/7) }, (_, w)=>first - dow + w*7);
}

function calWeekHTML(ws, y, m, items, todayN){
  const we = ws + 6;
  const segs = items.filter(i=>i.s<=we && i.e>=ws).map(i=>({
    ...i, c0: Math.max(i.s, ws)-ws, c1: Math.min(i.e, we)-ws, startsHere: i.s>=ws, endsHere: i.e<=we,
  }));
  const laneEnd = [];
  segs.forEach(sg=>{
    let l = laneEnd.findIndex(end=>end < sg.c0);
    if(l < 0){ l = laneEnd.length; laneEnd.push(-1); }
    laneEnd[l] = sg.c1; sg.lane = l;
  });
  const height = Math.max(CAL_MIN_WEEK, CAL_HEAD + laneEnd.length*CAL_LANE + 8);

  const days = Array.from({ length:7 }, (_, i)=>{
    const n = ws + i, d = new Date(n*86400000);
    const inMonth = d.getUTCMonth()===m && d.getUTCFullYear()===y;
    const label = d.getUTCDate()===1 ? `${d.getUTCDate()} ${MONTH_SHORT[d.getUTCMonth()]}` : d.getUTCDate();
    return `<div class="cal-day ${inMonth?'':'out'} ${n===todayN?'today':''}"><span class="dn" ${n===todayN?'aria-label="Today"':''}>${label}</span></div>`;
  }).join('');

  const bars = segs.map(sg=>{
    const t = sg.t, span = sg.c1 - sg.c0 + 1;
    const pax = custByTrip(t.id).length;
    const tip = `${tripCode(t)} · ${t.name}\n${fmtDate(dayYmd(sg.s))} → ${fmtDate(dayYmd(sg.e))}\n${tripMainStatus(t)}${isSubmittedTrip(t)?' · Ops: '+opsLabel(tripOpsStatus(t)):''} · ${pax} pax`;
    return `<button class="cal-bar st-${slugS(tripMainStatus(t))} ${sg.startsHere?'is-start':''} ${sg.endsHere?'is-end':''}" data-cal-trip="${esc(t.id)}"
      style="left:calc(${sg.c0}/7*100% + 2px);width:calc(${span}/7*100% - 4px);top:${CAL_HEAD + sg.lane*CAL_LANE}px;"
      title="${esc(tip)}" aria-label="${esc(tip.replace(/\n/g,', '))}">${sg.startsHere?'':'◂ '}${esc(t.name)}${sg.endsHere?'':' ▸'}</button>`;
  }).join('');

  return `<div class="cal-week" style="height:${height}px;"><div class="cal-days">${days}</div>${bars}</div>`;
}

function calendarHTML(){
  const { y, m } = calEnsure();
  const today = todayYmd(), todayN = dayNum(today);
  const items = calItems();
  const monthStart = Date.UTC(y, m, 1)/86400000, monthEnd = Date.UTC(y, m+1, 0)/86400000;
  const inMonth = items.filter(i=>i.s<=monthEnd && i.e>=monthStart);
  const weeks = calWeekStarts(y, m).map(ws=>calWeekHTML(ws, y, m, items, todayN)).join('');

  const yearSet = new Set([y, Number(today.slice(0,4))-1, Number(today.slice(0,4)), Number(today.slice(0,4))+1]);
  items.forEach(i=>yearSet.add(new Date(i.s*86400000).getUTCFullYear()));
  const yearOpts = [...yearSet].sort((a,b)=>a-b).map(v=>`<option value="${v}" ${v===y?'selected':''}>${v}</option>`).join('');
  const monthOpts = MONTH_NAMES.map((n,i)=>`<option value="${i}" ${i===m?'selected':''}>${n}</option>`).join('');
  const chip = (attr, val, label, on) => `<button class="chip ${on?'active':''}" ${attr}="${esc(val)}">${esc(label)}</button>`;

  const legendStatuses = ['Draft','Pending Payment','Paid', ...(calShowDead ? ['Cancelled'] : [])];
  const legend = `<div class="cal-legend" aria-label="Colour key">${legendStatuses.map(s=>`<span><span class="cal-sw st-${slugS(s)}"></span>${s}</span>`).join('')}</div>`;

  // Agenda for the month (also the easy way to read it on a phone)
  let agenda;
  if(inMonth.length){
    agenda = `<div style="overflow-x:auto;"><table class="dash-table">
      <thead><tr><th>Dates</th><th>Trip</th><th>Status</th><th class="num">Pax</th></tr></thead>
      <tbody>${inMonth.map(i=>`<tr data-cal-trip="${esc(i.t.id)}">
        <td>${fmtDate(dayYmd(i.s))}${i.e>i.s?` → ${fmtDate(dayYmd(i.e))}`:''}</td>
        <td><b>${esc(i.t.name)}</b><div class="cust-sub">${esc(tripCode(i.t))}${i.t.destination?' · '+esc(i.t.destination):''}</div></td>
        <td>${stampHTML(i.t, 'style="display:inline-block;"')}${opsPillHTML(i.t) ? ' ' + opsPillHTML(i.t, true) : ''}</td>
        <td class="num">${custByTrip(i.t.id).length}</td></tr>`).join('')}</tbody></table></div>`;
  } else {
    const prev = [...items].filter(i=>i.e<monthStart).sort((a,b)=>b.e-a.e)[0];
    const next = items.find(i=>i.s>monthEnd);
    const jump = (it, label) => { if(!it) return ''; const d = new Date(it.s*86400000); return `<button class="btn btn-sm btn-ghost" data-cal-jump="${d.getUTCFullYear()}-${d.getUTCMonth()}">${label}: ${esc(it.t.name)} (${MONTH_SHORT[d.getUTCMonth()]} ${d.getUTCFullYear()})</button>`; };
    agenda = `<div class="cal-empty"><span>No trips in ${MONTH_NAMES[m]} ${y}.</span>${jump(prev,'← Previous trip')}${jump(next,'Next trip →')}</div>`;
  }

  return `
  <div class="cal-head">
    <button class="cal-arrow" data-cal-shift="-1" aria-label="Previous month" title="Previous month (←)">‹</button>
    <h2 class="cal-title" aria-live="polite">${MONTH_NAMES[m]} ${y}</h2>
    <button class="cal-arrow" data-cal-shift="1" aria-label="Next month" title="Next month (→)">›</button>
    <button class="btn btn-ghost" data-cal-today title="Back to this month (T)">Today</button>
    <span class="cal-count">${inMonth.length} trip${inMonth.length===1?'':'s'} this month · tip: use ← → keys to change month</span>
  </div>
  <div class="cal-tools">
    <select class="status-select" id="cal-month" aria-label="Month">${monthOpts}</select>
    <select class="status-select" id="cal-year" aria-label="Year">${yearOpts}</select>
    <div class="chip-row">${[['All','All types'],['open','Open trip'],['private','Private trip']].map(([v,l])=>chip('data-cal-type', v, l, calType===v)).join('')}</div>
    <button class="chip ${calShowDead?'active':''}" data-cal-dead title="Show or hide declined and cancelled trips">Declined / cancelled: ${calShowDead?'shown':'hidden'}</button>
  </div>

  <div class="cal">
    <div class="cal-dow">${DOW_SHORT.map(d=>`<div>${d}</div>`).join('')}</div>
    ${weeks}
  </div>
  <div class="panel"><div class="panel-head"><h3>Trips in ${MONTH_NAMES[m]} ${y}</h3><span class="dash-note" style="margin:0;">Click a trip to open it</span></div>${agenda}</div>`;
}

function bindCalendarEvents(app){
  if(!calKeysBound){
    calKeysBound = true;
    document.addEventListener('keydown', e=>{
      if(view.mode!=='calendar' || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || '';
      if(/INPUT|TEXTAREA|SELECT/.test(tag) || document.querySelector('.overlay.open')) return;
      if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); calShift(-1); render(); }
      else if(e.key==='ArrowRight' || e.key==='PageDown'){ e.preventDefault(); calShift(1); render(); }
      else if(e.key==='t' || e.key==='T'){ calCursor = null; render(); }
    });
  }
  if(view.mode!=='calendar') return;
  app.querySelectorAll('[data-cal-shift]').forEach(el=>el.addEventListener('click', ()=>{ calShift(Number(el.dataset.calShift)); render(); }));
  const todayBtn = app.querySelector('[data-cal-today]');
  if(todayBtn) todayBtn.addEventListener('click', ()=>{ calCursor = null; render(); });
  const jumpTo = () => { calCursor = { y:Number(app.querySelector('#cal-year').value), m:Number(app.querySelector('#cal-month').value) }; render(); };
  const ms = app.querySelector('#cal-month'), ys = app.querySelector('#cal-year');
  if(ms) ms.addEventListener('change', jumpTo);
  if(ys) ys.addEventListener('change', jumpTo);
  app.querySelectorAll('[data-cal-type]').forEach(el=>el.addEventListener('click', ()=>{ calType = el.dataset.calType; render(); }));
  const dead = app.querySelector('[data-cal-dead]');
  if(dead) dead.addEventListener('click', ()=>{ calShowDead = !calShowDead; render(); });
  app.querySelectorAll('[data-cal-jump]').forEach(el=>el.addEventListener('click', ()=>{
    const [yy, mm] = el.dataset.calJump.split('-').map(Number); calCursor = { y:yy, m:mm }; render();
  }));
  app.querySelectorAll('[data-cal-trip]').forEach(el=>el.addEventListener('click', ()=>{
    view.mode = 'detail'; view.tripId = el.dataset.calTrip; view.returnTo = 'calendar'; passengerFilterKeyword = ''; render();
  }));
}

function sortHeader(label, key, sortState, extraAttrs){
  const active = sortState.col === key;
  const arrow = active ? (sortState.dir==='asc' ? ' \u25b2' : ' \u25bc') : '';
  return `<th data-sort-key="${key}" ${extraAttrs||''} style="cursor:pointer;user-select:none;" title="Sort by ${esc(label)}">${esc(label)}${arrow}</th>`;
}
function applySort(list, sortState, extractors){
  if(!sortState.col || !extractors[sortState.col]) return list;
  const extract = extractors[sortState.col];
  const dir = sortState.dir==='asc' ? 1 : -1;
  return [...list].sort((a,b)=>{
    const av = extract(a), bv = extract(b);
    if(av < bv) return -1*dir;
    if(av > bv) return 1*dir;
    return 0;
  });
}

    [c.name, c.phone, c.idNumber, paxStatus(c), c.picName, c.ticketPurchaser, c.airline, c.bookingReference, c.ticketStatus, c.notes]
      .some(v => v && String(v).toLowerCase().includes(kw))
  ) : allCs;

  const passengerSortExtractors = {
    name: c=>(c.name||'').toLowerCase(),                                          // alphabetical
    contact: c=>{ const digits=(c.phone||'').replace(/\D/g,''); return digits ? Number(digits) : 0; }, // numerical
    amount: c=>Number(c.amount)||0,                                               // numerical
    deposit: c=>Number(c.depositAmount)||0,                                       // numerical
    balancePaid: c=>Number(c.balancePaid)||0,                                     // numerical — "Payment" column
    balanceAmount: c=>paxBalance(c), // numerical — "Balance" column
    paymentStatus: c=>paxStatus(c).toLowerCase(),                                 // alphabetical

    airline: c=>(c.airline||'').toLowerCase(),                                    // alphabetical

  const sortedCs = applySort(filteredCs, passengerSort, passengerSortExtractors);

  if(!sortedCs.length){

  return sortedCs.map(c=>{

        <div>${esc(c.phone||'—')}</div>
        ${c.passportNumber ? `<div class="cust-sub">🛂 ${esc(c.passportNumber)}${c.passportExpiry ? ' · exp ' + fmtDate(c.passportExpiry) : ''}</div>` : ''}
      </td>
      <td>${fmtMoney(c.amount)}</td>
      <td>${(Number(c.depositAmount)||0)>0 ? fmtMoney(c.depositAmount) : '—'}</td>
      <td>${fmtMoney(c.balancePaid)}</td>

      <td>${c.ticketPurchaser ? esc(c.ticketPurchaser) : '<span class="cust-sub">Not set</span>'}</td>

        <div>${esc(c.airline||'—')}</div>

      <td>
        <select class="status-select" data-ticket-status="${c.id}">

      <td>

const DEFAULT_FAV_COUNTRIES = ['Indonesia','Vietnam','Thailand','New Zealand'];
const AUTO_FAV_AFTER = 5;   // a country used on MORE than this many trips is pinned automatically

function favStoreKey(){ return 'excapism_fav_countries_' + (currentUser ? currentUser.id : 'anon'); }
function loadFavStore(){
  try{
    const raw = JSON.parse(localStorage.getItem(favStoreKey()) || 'null');
    if(raw && Array.isArray(raw.pinned) && Array.isArray(raw.unpinned)) return raw;
  }catch(e){}
  return { pinned: DEFAULT_FAV_COUNTRIES.slice(), unpinned: [] };
}
function saveFavStore(st){ try{ localStorage.setItem(favStoreKey(), JSON.stringify(st)); }catch(e){} }

// How many trips use each country. Counted from the trips themselves (shared,
// persistent, includes bulk imports) rather than a per-browser counter.
// A trip counts for a country if one of its comma/dash separated parts equals it.
function countryUsage(){
  const counts = {};
  const byLower = new Map(COUNTRIES.map(c=>[c.toLowerCase(), c]));
  trips.forEach(t=>{
    const seen = new Set();
    String(t.destination||'').split(/[,–—\-\/]/).forEach(part=>{
      const c = byLower.get(part.replace(/\(.*?\)/g,'').trim().toLowerCase());
      if(c && !seen.has(c)){ seen.add(c); counts[c] = (counts[c]||0) + 1; }
    });
  });
  return counts;
}
// Returns { favs:[names in display order], isFav:Set, auto:Set, counts }
function countryFavourites(){
  const st = loadFavStore(), counts = countryUsage();
  const auto = new Set(COUNTRIES.filter(c=>(counts[c]||0) > AUTO_FAV_AFTER && !st.unpinned.includes(c)));
  const manual = st.pinned.filter(c=>COUNTRIES.includes(c));
  const set = new Set([...manual, ...auto]);
  const favs = [...set].sort((a,b)=>(counts[b]||0)-(counts[a]||0) || [...set].indexOf(a)-[...set].indexOf(b));
  // most-used first; ties keep pin order (so the four defaults stay Indonesia, Vietnam, Thailand, New Zealand)
  return { favs, isFav:set, auto, counts, manual:new Set(manual) };
}
function toggleFavCountry(c){
  const st = loadFavStore(), f = countryFavourites();
  if(f.isFav.has(c)){
    st.pinned = st.pinned.filter(x=>x!==c);
    if(f.auto.has(c) && !st.unpinned.includes(c)) st.unpinned.push(c);
  } else {
    st.unpinned = st.unpinned.filter(x=>x!==c);
    if(!st.pinned.includes(c)) st.pinned.push(c);
  }
  saveFavStore(st);
}

function bindCountryCombo(){
  const input = document.getElementById('tr-dest'), list = document.getElementById('tr-dest-list');
  if(!input || !list) return;
  const toggle = document.querySelector('.combo-toggle');
  const original = input.dataset.original || '';
  let hl = -1, rows = [];

  const exact = v => COUNTRIES.find(c=>c.toLowerCase()===String(v).trim().toLowerCase());
  const build = (filterText) => {
    const f = countryFavourites(), q = (filterText||'').trim().toLowerCase();
    const match = c => !q || c.toLowerCase().includes(q);
    const row = c => {
      const on = f.isFav.has(c), n = f.counts[c]||0;
      const why = on ? (f.manual.has(c) ? 'Pinned — click to unpin' : `Pinned automatically (used on ${n} trips) — click to unpin`) : 'Pin to top';
      return `<div class="combo-row ${exact(input.value)===c?'sel':''}" role="option" data-country="${esc(c)}">
        <span class="nm">${esc(c)}</span>${n?`<span class="ct">${n} trip${n===1?'':'s'}</span>`:''}
        <button type="button" class="combo-star ${on?'on':''}" data-star="${esc(c)}" aria-pressed="${on}" aria-label="${esc(why+': '+c)}" title="${esc(why)}">${on?'★':'☆'}</button>
      </div>`;
    };
    const favs = f.favs.filter(match), rest = COUNTRIES.filter(c=>!f.isFav.has(c) && match(c));
    let h = '';
    if(favs.length) h += `<div class="combo-sec">Favourites</div>` + favs.map(row).join('');
    if(rest.length) h += `<div class="combo-sec">${favs.length?'All countries':'Countries'}</div>` + rest.map(row).join('');
    if(!h) h = `<div class="combo-empty">No country matches “${esc(filterText)}”.</div>`;
    list.innerHTML = h;
    rows = [...list.querySelectorAll('.combo-row')]; hl = -1;
  };
  const open = (filterText) => { build(filterText); list.hidden = false; input.setAttribute('aria-expanded','true'); };
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded','false'); hl = -1; };
  const choose = c => { input.value = c; input.dataset.chosen = c; close(); };
  const mark = () => { rows.forEach((r,i)=>r.classList.toggle('hl', i===hl)); if(rows[hl]) rows[hl].scrollIntoView({block:'nearest'}); };

  // Opening with a value already chosen shows the full list so it is easy to change.
  input.addEventListener('focus', ()=>open(exact(input.value) ? '' : input.value));
  input.addEventListener('input', ()=>open(input.value));
  toggle.addEventListener('click', ()=>{ if(list.hidden){ input.focus(); open(''); } else close(); });
  input.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ e.preventDefault(); if(list.hidden) open(input.value); hl = Math.min(rows.length-1, hl+1); mark(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); hl = Math.max(0, hl-1); mark(); }
    else if(e.key==='Enter' && !list.hidden){ e.preventDefault(); const r = rows[hl>=0?hl:0]; if(r && r.dataset.country) choose(r.dataset.country); }
    else if(e.key==='Escape' && !list.hidden){ e.stopPropagation(); close(); }
  });
  // mousedown keeps focus in the input so the list does not close before the click lands
  list.addEventListener('mousedown', e=>e.preventDefault());
  list.addEventListener('click', e=>{
    const star = e.target.closest('[data-star]');
    if(star){ e.stopPropagation(); toggleFavCountry(star.dataset.star); build(input.value && !exact(input.value) ? input.value : ''); return; }
    const r = e.target.closest('[data-country]'); if(r) choose(r.dataset.country);
  });
  document.addEventListener('click', e=>{ if(!document.body.contains(input)) return; if(!e.target.closest('.combo')) close(); });
  input.addEventListener('blur', ()=>setTimeout(()=>{ if(document.activeElement!==input && !list.matches(':hover')) close(); }, 120));
}
// Resolves what to save from the combobox: a listed country, or the trip's
// existing legacy text if it was left untouched. Returns null if invalid.
function resolveCountryValue(){
  const input = document.getElementById('tr-dest'), v = input.value.trim();
  if(!v) return '';
  const hit = COUNTRIES.find(c=>c.toLowerCase()===v.toLowerCase());
  if(hit) return hit;
  if(v === (input.dataset.original||'')) return v;
  return null;
}

/* ---- Range calendar (start + end picked in one calendar) ---- */
let rp = { start:'', end:'', anchor:null, dragging:false, y:0, m:0, open:false, hoverEnd:null };
function rpInit(start, end){
  const t = ymd(start) || todayYmd();
  rp = { start: ymd(start)||'', end: ymd(end)||'', anchor:null, dragging:false, y:Number(t.slice(0,4)), m:Number(t.slice(5,7))-1, open:false, hoverEnd:null };
}
function rpDuration(s, e){
  if(!s || !e) return '';
  const days = daysBetweenYmd(s, e) + 1;
  return days===1 ? '1 day' : `${days} days · ${days-1} night${days-1===1?'':'s'}`;
}
function rpFieldsHTML(){
  const f = (label, v, which) => `<button type="button" class="rp-field ${rp.open && ((which==='start' && !rp.anchor) || (which==='end' && rp.anchor))?'active':''}" data-rp-open="${which}"><small>${label}</small>${v ? esc(fmtDate(v)) : '<span class="ph">Select date</span>'}</button>`;
  return f('Start date', rp.start, 'start') + f('End date', rp.end, 'end');
}
function rpGridHTML(){
  const first = Date.UTC(rp.y, rp.m, 1)/86400000, dow = new Date(first*86400000).getUTCDay();
  const dim = new Date(Date.UTC(rp.y, rp.m+1, 0)).getUTCDate();
  const total = Math.ceil((dow+dim)/7)*7, today = todayYmd();
  let h = DOW_SHORT.map(d=>`<div class="rp-dow">${d.slice(0,2)}</div>`).join('');
  for(let i=0;i<total;i++){
    const n = first - dow + i, s = dayYmd(n), inM = new Date(n*86400000).getUTCMonth()===rp.m;
    h += `<button type="button" class="rp-day ${inM?'':'out'} ${s===today?'today':''}" data-rp-day="${s}" aria-label="${esc(fmtDate(s))}">${Number(s.slice(8))}</button>`;
  }
  return h;
}
function rpPaint(){
  const grid = document.getElementById('rp-grid'); if(!grid) return;
  const a = rp.anchor ? rp.anchor : rp.start;
  let s = rp.start, e = rp.end;
  if(rp.anchor){ s = rp.anchor; e = rp.hoverEnd || rp.anchor; if(e < s){ const x=s; s=e; e=x; } }
  grid.querySelectorAll('.rp-day').forEach(b=>{
    const d = b.dataset.rpDay;
    b.classList.toggle('s', !!s && d===s);
    b.classList.toggle('e', !!e && d===e);
    b.classList.toggle('inr', !!s && !!e && d>s && d<e);
  });
  const sum = document.getElementById('rp-sum');
  if(sum) sum.textContent = rp.anchor ? (rp.hoverEnd && rp.hoverEnd!==rp.anchor ? rpDuration(...[rp.anchor, rp.hoverEnd].sort()) : 'Now pick the end date (or drag)') : (rp.start && rp.end ? rpDuration(rp.start, rp.end) : 'Pick a start date, then an end date');
  document.getElementById('rp-label').textContent = `${MONTH_NAMES[rp.m]} ${rp.y}`;
  const box = document.getElementById('rp-box'); if(box) box.innerHTML = rpFieldsHTML();
  document.getElementById('tr-start').value = rp.start; document.getElementById('tr-end').value = rp.end;
}
function rpRenderGrid(){ const g = document.getElementById('rp-grid'); if(g){ g.innerHTML = rpGridHTML(); rpPaint(); } }
function rpComplete(a, b){
  const [s, e] = a <= b ? [a, b] : [b, a];
  rp.start = s; rp.end = e; rp.anchor = null; rp.dragging = false; rp.hoverEnd = null; rpPaint();
}
function rpDown(day){
  if(rp.anchor){ rpComplete(rp.anchor, day); rp.justDone = true; return; }   // second click finishes the range
  rp.start = ''; rp.end = ''; rp.anchor = day; rp.dragging = true; rp.hoverEnd = day; rp.justDone = false; rpPaint();
}
function rpUp(day){
  if(rp.justDone){ rp.justDone = false; return; }
  if(rp.dragging && rp.anchor && day && day!==rp.anchor) rpComplete(rp.anchor, day);   // dragged to another day
  rp.dragging = false;                                                                   // plain click: wait for the end date
}
function rpDayAt(x, y){ const el = document.elementFromPoint(x, y); const b = el && el.closest ? el.closest('[data-rp-day]') : null; return b ? b.dataset.rpDay : null; }

function bindRangePicker(){
  const cal = document.getElementById('rp-cal'); if(!cal) return;
  const setOpen = o => { rp.open = o; cal.hidden = !o; rpPaint(); };
  document.getElementById('rp-box').addEventListener('click', e=>{
    const b = e.target.closest('[data-rp-open]'); if(!b) return;
    const t = rp.start || todayYmd(); rp.y = Number(t.slice(0,4)); rp.m = Number(t.slice(5,7))-1; rpRenderGrid();
    if(b.dataset.rpOpen==='end' && rp.start && !rp.anchor){ rp.anchor = rp.start; rp.hoverEnd = rp.start; }   // jump straight to choosing the end date
    setOpen(true);
  });
  const grid = document.getElementById('rp-grid');
  grid.addEventListener('pointerdown', e=>{ const b = e.target.closest('[data-rp-day]'); if(!b || e.button>0) return; e.preventDefault(); rpDown(b.dataset.rpDay); });
  grid.addEventListener('pointermove', e=>{ if(!rp.anchor) return; const d = rpDayAt(e.clientX, e.clientY); if(d && d!==rp.hoverEnd){ rp.hoverEnd = d; rpPaint(); } });
  grid.addEventListener('pointerup', e=>{ rpUp(rpDayAt(e.clientX, e.clientY)); });
  grid.addEventListener('click', e=>{ const b = e.target.closest('[data-rp-day]'); if(b && e.detail===0){ rpDown(b.dataset.rpDay); rp.justDone = false; rpUp(null); } });   // keyboard Enter/Space
  cal.querySelector('[data-rp-nav="-1"]').addEventListener('click', ()=>{ rp.m--; if(rp.m<0){ rp.m=11; rp.y--; } rpRenderGrid(); });
  cal.querySelector('[data-rp-nav="1"]').addEventListener('click', ()=>{ rp.m++; if(rp.m>11){ rp.m=0; rp.y++; } rpRenderGrid(); });
  cal.querySelector('[data-rp-clear]').addEventListener('click', ()=>{ rp.start=''; rp.end=''; rp.anchor=null; rp.hoverEnd=null; rpPaint(); });
  cal.querySelector('[data-rp-done]').addEventListener('click', ()=>{ if(rp.anchor){ rpComplete(rp.anchor, rp.anchor); } setOpen(false); });
  rpRenderGrid();
}



/* ---- Trip flow ------------------------------------------------------
   Main status:  Draft -> Pending Payment -> Paid   (or Cancelled)
     - Draft: the creator is still filling things in.
     - Submit moves it to Pending Payment (stored as 'Pending').
     - Paid is not stored: a submitted trip shows Paid as soon as its balance is zero.
     - Cancelled: an approver/admin declined it.
   Operations sub-status (set from Submit onwards, routed by approver/admin):
     Pending Ops -> Ongoing -> Ready -> Completed, or On-hold / Rejected at any stage. */
const MAIN_STATUSES = ['Draft','Pending Payment','Paid','Cancelled'];
const OPS_STATUSES = ['Pending Ops','Ongoing','Ready','Completed','Onhold','Rejected'];
const OPS_FLOW = ['Pending Ops','Ongoing','Ready','Completed'];
function opsLabel(s){ return s==='Onhold' ? 'On-hold' : s; }
function slugS(s){ return String(s).replace(/[\s-]+/g,''); }
function isCancelledTrip(t){ return t.status==='Cancelled' || t.status==='Declined'; }
function isSubmittedTrip(t){ return !isCancelledTrip(t) && t.status!=='Draft'; }
function tripMainStatus(t){
  if(isCancelledTrip(t)) return 'Cancelled';
  if(!isSubmittedTrip(t)) return 'Draft';
  const m = tripMoney(t);
  return (m.amount>0 && m.balance===0) ? 'Paid' : 'Pending Payment';
}
function tripOpsStatus(t){ return OPS_STATUSES.includes(t.opsStatus) ? t.opsStatus : 'Pending Ops'; }
function opsClosed(t){ return isSubmittedTrip(t) && ['Completed','Rejected'].includes(tripOpsStatus(t)); }
function ticketStageTrip(t){ return isSubmittedTrip(t) && ['Ongoing','Ready','Completed'].includes(tripOpsStatus(t)); }
function needsOpsAction(t){ return isSubmittedTrip(t) && !isCancelledTrip(t) && (tripMainStatus(t)==='Pending Payment' || ['Pending Ops','Ongoing','Onhold'].includes(tripOpsStatus(t))); }
function stampHTML(t, attrs){ const m = tripMainStatus(t); return `<div class="stamp ${slugS(m)}" ${attrs||''}>${m}</div>`; }
function opsPillHTML(t, bare){
  if(!isSubmittedTrip(t)) return '';
  const o = tripOpsStatus(t);
  return `<span class="pill s-${slugS(o)}" title="Operations: ${esc(opsLabel(o))}">${bare ? '' : '<i>Ops</i> '}${esc(opsLabel(o))}</span>`;
}
// ---------------------------------------------------------------
// Operations checklist — accommodation, flights to/return, add-ons per
// passenger. Hotels and flights are defined ONCE per trip (setup lists), then
// assigned to passengers; room details, luggage and notes are per passenger.
// Stored on the trip as `opsChecklist` and saved through a debounced PATCH.
// ---------------------------------------------------------------
let clOpen=false, clDetail=false, clFull=false, clSetup=false;
const clSel = new Set();
const CL_DONE = ['hotelDone','toDone','retDone','addonsDone'];
function clDoc(t){
  const d = t.opsChecklist || (t.opsChecklist = {});
  d.hotels = d.hotels || []; d.flightsTo = d.flightsTo || []; d.flightsReturn = d.flightsReturn || []; d.pax = d.pax || {};
  return d;
}
function clPaxList(t){ return customers.filter(c=>c.tripId===t.id && paxCounted(c)); }
function clProgress(t){
  const px = clPaxList(t), d = clDoc(t); let done = 0;
  px.forEach(c=>{ const r = d.pax[c.id] || {}; CL_DONE.forEach(k=>{ if(r[k]) done++; }); });
  return { done, total: px.length*4 };
}
function clFmtDT(s){
  if(!s) return '';
  const d = new Date(s); if(isNaN(d)) return String(s);
  return d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});
}
function clNewId(p){ return p + Math.random().toString(36).slice(2,8); }
const clQueueMap = {}; let clTimer = null;
function clQueue(tripId, patch){
  const q = clQueueMap[tripId] || (clQueueMap[tripId] = {});
  if(patch.lists) q.lists = Object.assign(q.lists||{}, patch.lists);
  if(patch.pax){ q.pax = q.pax || {}; Object.entries(patch.pax).forEach(([pid,f])=>{ q.pax[pid] = Object.assign(q.pax[pid]||{}, f); }); }
  clearTimeout(clTimer); clTimer = setTimeout(clFlush, 600);
}
async function clFlush(){
  clearTimeout(clTimer);
  for(const id of Object.keys(clQueueMap)){
    const body = clQueueMap[id]; delete clQueueMap[id];
    try{ await apiFetch(`/trips/${id}/ops-checklist`, { method:'PATCH', body: JSON.stringify(body) }); }
    catch(e){ showToast(e.message || 'Could not save the checklist'); }
  }
}
function clSetPax(t, pids, fields){
  const d = clDoc(t), patch = {};
  pids.forEach(pid=>{ d.pax[pid] = Object.assign(d.pax[pid]||{}, fields); patch[pid] = fields; });
  clQueue(t.id, { pax: patch });
}
function clQueueList(t, key){
  const d = clDoc(t);
  clQueue(t.id, { lists: { [key]: d[key].map(x=>({ ...x })) } });
}
function clHotelLabel(h){ return h.name || '(unnamed hotel)'; }
function clFlightLabel(f){ return [f.airline || '(airline)', f.ref].filter(Boolean).join(' · ') + (f.departure ? ' · ' + clFmtDT(f.departure) : ''); }

function clSetupHTML(t){
  const d = clDoc(t), can = isApproverOrAdmin(), dis = can ? '' : 'disabled';
  const del = (key,id) => can ? `<button type="button" class="cl-x" data-cl-del="${key}" data-lid="${esc(id)}" title="Remove">✕</button>` : '';
  const add = (key,label) => can ? `<button type="button" class="btn btn-ghost btn-sm" data-cl-add="${key}">+ ${label}</button>` : '';
  const flightRows = key => d[key].length ? d[key].map(f=>`
    <div class="cl-lrow cl-flight">
      <input data-cl-list="${key}" data-lid="${esc(f.id)}" data-lf="airline" placeholder="Airline" value="${esc(f.airline||'')}" ${dis}>
      <input data-cl-list="${key}" data-lid="${esc(f.id)}" data-lf="ref" placeholder="Ref / booking" value="${esc(f.ref||'')}" ${dis}>
      <label>Departure<input type="datetime-local" data-cl-list="${key}" data-lid="${esc(f.id)}" data-lf="departure" value="${esc(f.departure||'')}" ${dis}></label>
      <label>Arrival<input type="datetime-local" data-cl-list="${key}" data-lid="${esc(f.id)}" data-lf="arrival" value="${esc(f.arrival||'')}" ${dis}></label>
      ${del(key,f.id)}
    </div>`).join('') : '<p class="hint" style="margin:4px 0;">None yet.</p>';
  return `<div class="cl-setup">
    <div class="cl-card"><h4>Hotels</h4>
      ${d.hotels.length ? d.hotels.map(h=>`<div class="cl-lrow"><input data-cl-list="hotels" data-lid="${esc(h.id)}" data-lf="name" placeholder="Hotel name" value="${esc(h.name||'')}" ${dis}>${del('hotels',h.id)}</div>`).join('') : '<p class="hint" style="margin:4px 0;">None yet.</p>'}
      ${add('hotels','Add hotel')}</div>
    <div class="cl-card"><h4>Flights to</h4>${flightRows('flightsTo')}${add('flightsTo','Add flight')}</div>
    <div class="cl-card"><h4>Flights return</h4>${flightRows('flightsReturn')}${add('flightsReturn','Add flight')}</div>
  </div>
  <p class="hint" style="margin:6px 0 10px;">Add each hotel / flight once here, then assign passengers to it in the table below.${can?'':' (View only.)'}</p>`;
}

function clTableHTML(t){
  const px = clPaxList(t), d = clDoc(t), can = isApproverOrAdmin(), dis = can ? '' : 'disabled';
  if(!px.length) return '<p class="hint" style="margin:8px 0;">No passengers yet — add passengers first, then they appear here.</p>';
  const opts = (arr, sel, lab) => '<option value="">—</option>' + arr.map(x=>`<option value="${esc(x.id)}" ${x.id===sel?'selected':''}>${esc(lab(x))}</option>`).join('');
  const hotel = id => d.hotels.find(h=>h.id===id), fTo = id => d.flightsTo.find(f=>f.id===id), fRet = id => d.flightsReturn.find(f=>f.id===id);
  const allDone = k => px.every(c=>(d.pax[c.id]||{})[k]);
  const tickHead = (k,label) => `<th class="cl-tick"><label title="Tick / untick everyone">${label}<br><input type="checkbox" data-cl-colall="${k}" ${allDone(k)?'checked':''} ${dis}></label></th>`;
  const tick = (k,c,r) => `<td class="cl-tick"><input type="checkbox" data-cl-done="${k}" data-pid="${esc(c.id)}" ${r[k]?'checked':''} ${dis} aria-label="${k} ${esc(c.name)}"></td>`;
  const txt = (f,c,r,ph,w) => `<td><input class="cl-in" style="min-width:${w||90}px" data-cl-field="${f}" data-pid="${esc(c.id)}" value="${esc(r[f]||'')}" placeholder="${ph||''}" ${dis}></td>`;
  const sel = (f,c,r,arr,lab) => `<td><select class="cl-in" style="min-width:150px" data-cl-field="${f}" data-pid="${esc(c.id)}" ${dis}>${opts(arr,r[f],lab)}</select></td>`;
  const ro = v => `<td class="cl-ro">${v ? esc(v) : '<span class="cl-dash">—</span>'}</td>`;
  const selCount = px.filter(c=>clSel.has(c.id)).length;
  const bulk = can ? `<div class="cl-bulk"><span><b>${selCount}</b> selected</span>
      <label>Hotel <select data-cl-bulk="hotelId"><option value="">assign…</option>${d.hotels.map(h=>`<option value="${esc(h.id)}">${esc(clHotelLabel(h))}</option>`).join('')}</select></label>
      <label>Flight to <select data-cl-bulk="toId"><option value="">assign…</option>${d.flightsTo.map(f=>`<option value="${esc(f.id)}">${esc(clFlightLabel(f))}</option>`).join('')}</select></label>
      <label>Return <select data-cl-bulk="retId"><option value="">assign…</option>${d.flightsReturn.map(f=>`<option value="${esc(f.id)}">${esc(clFlightLabel(f))}</option>`).join('')}</select></label>
      <span class="hint" style="margin:0;">Tick passengers on the left, then pick a hotel / flight to give it to all of them at once.</span></div>` : '';
  let head, rows;
  const selAll = `<th class="cl-sel"><input type="checkbox" data-cl-selall ${selCount===px.length?'checked':''} ${can?'':'disabled'} aria-label="Select all"></th>`;
  if(!clDetail){
    head = `<tr>${selAll}<th class="cl-name">Passenger</th>${tickHead('hotelDone','🏨 Accommodation')}${tickHead('toDone','✈ Flight to')}${tickHead('retDone','✈ Flight return')}${tickHead('addonsDone','＋ Add-ons')}<th>Done</th></tr>`;
    rows = px.map(c=>{ const r = d.pax[c.id] || {}; const n = CL_DONE.filter(k=>r[k]).length;
      return `<tr class="${n===4?'cl-complete':''}"><td class="cl-sel"><input type="checkbox" data-cl-sel="${esc(c.id)}" ${clSel.has(c.id)?'checked':''} ${can?'':'disabled'}></td><td class="cl-name">${esc(c.name)}</td>${tick('hotelDone',c,r)}${tick('toDone',c,r)}${tick('retDone',c,r)}${tick('addonsDone',c,r)}<td class="cl-n">${n}/4</td></tr>`; }).join('');
  } else {
    head = `<tr class="cl-group"><th class="cl-sel"></th><th class="cl-name"></th><th colspan="4">Accommodation</th><th colspan="7">Flight to</th><th colspan="7">Flight return</th><th colspan="2">Add-ons</th></tr>
      <tr>${selAll}<th class="cl-name">Passenger</th>
      <th>Hotel</th><th>Room type</th><th>Room no.</th>${tickHead('hotelDone','Done')}
      <th>Flight</th><th>Airline</th><th>Ref</th><th>Departure</th><th>Arrival</th><th>Luggage</th>${tickHead('toDone','Done')}
      <th>Flight</th><th>Airline</th><th>Ref</th><th>Departure</th><th>Arrival</th><th>Luggage</th>${tickHead('retDone','Done')}
      <th>Note</th>${tickHead('addonsDone','Done')}</tr>`;
    rows = px.map(c=>{ const r = d.pax[c.id] || {}; const to = fTo(r.toId) || {}, rt = fRet(r.retId) || {};
      return `<tr><td class="cl-sel"><input type="checkbox" data-cl-sel="${esc(c.id)}" ${clSel.has(c.id)?'checked':''} ${can?'':'disabled'}></td><td class="cl-name">${esc(c.name)}</td>
        ${sel('hotelId',c,r,d.hotels,clHotelLabel)}<td><input class="cl-in" style="min-width:110px" list="cl-roomtypes" data-cl-field="roomType" data-pid="${esc(c.id)}" value="${esc(r.roomType||'')}" ${dis}></td>${txt('roomNumber',c,r,'',70)}${tick('hotelDone',c,r)}
        ${sel('toId',c,r,d.flightsTo,clFlightLabel)}${ro(to.airline)}${ro(to.ref)}${ro(clFmtDT(to.departure))}${ro(clFmtDT(to.arrival))}${txt('toLuggage',c,r,'e.g. 20kg',80)}${tick('toDone',c,r)}
        ${sel('retId',c,r,d.flightsReturn,clFlightLabel)}${ro(rt.airline)}${ro(rt.ref)}${ro(clFmtDT(rt.departure))}${ro(clFmtDT(rt.arrival))}${txt('retLuggage',c,r,'e.g. 20kg',80)}${tick('retDone',c,r)}
        ${txt('addons',c,r,'Free text note',220)}${tick('addonsDone',c,r)}</tr>`; }).join('');
  }
  return `${bulk}<div class="cl-scroll"><table class="cl-table ${clDetail?'detail':''}"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <datalist id="cl-roomtypes"><option>Single</option><option>Twin</option><option>Double</option><option>Triple</option><option>Family</option></datalist>`;
}

function clBlockHTML(t){
  const pr = clProgress(t);
  const prog = pr.total ? `${pr.done} / ${pr.total} ticked` : 'no passengers yet';
  const tools = clOpen ? `<div class="cl-tools">
      <span class="seg"><button type="button" class="${!clDetail?'on':''}" data-cl-mode="simple">Simple</button><button type="button" class="${clDetail?'on':''}" data-cl-mode="detail">Detailed</button></span>
      <button type="button" class="btn btn-ghost btn-sm" data-cl-setup>${clSetup?'Hide':'Edit'} hotels &amp; flights</button>
      <button type="button" class="btn btn-ghost btn-sm" data-cl-full>${clFull?'✕ Exit full screen':'⤢ Full screen'}</button>
    </div>` : '';
  const head = `<div class="cl-head"><button type="button" class="cl-toggle" data-cl-toggle aria-expanded="${clOpen}"><span class="cl-caret">${clOpen?'▾':'▸'}</span> Operations checklist <span class="cl-prog" id="cl-prog">${prog}</span></button>${tools}</div>`;
  if(!clOpen) return `<div class="cl-wrap" id="ops-cl">${head}</div>`;
  return `<div class="cl-wrap ${clFull?'full':''}" id="ops-cl">${head}<div id="cl-setup-host">${clSetup?clSetupHTML(t):''}</div><div id="cl-table-host">${clTableHTML(t)}</div></div>`;
}
function clRefreshTable(t){
  const host = document.getElementById('cl-table-host'); if(!host) return;
  const sc = host.querySelector('.cl-scroll'); const left = sc ? sc.scrollLeft : 0, top = sc ? sc.scrollTop : 0;
  host.innerHTML = clTableHTML(t);
  const sc2 = host.querySelector('.cl-scroll'); if(sc2){ sc2.scrollLeft = left; sc2.scrollTop = top; }
  const pr = clProgress(t), el = document.getElementById('cl-prog');
  if(el) el.textContent = pr.total ? `${pr.done} / ${pr.total} ticked` : 'no passengers yet';
}
function bindChecklist(){
  const root = document.getElementById('ops-cl'); if(!root) return;
  const t = trips.find(x=>x.id===view.tripId); if(!t) return;
  const can = isApproverOrAdmin();
  root.addEventListener('click', e=>{
    const q = s => e.target.closest(s);
    if(q('[data-cl-toggle]')){ clOpen = !clOpen; if(!clOpen) clFull = false; render(); return; }
    let b;
    if((b = q('[data-cl-mode]'))){ clDetail = b.dataset.clMode==='detail'; render(); return; }
    if(q('[data-cl-setup]')){ clSetup = !clSetup; render(); return; }
    if(q('[data-cl-full]')){ clFull = !clFull; if(clFull) clDetail = true; render(); return; }
    if(!can) return;
    if((b = q('[data-cl-add]'))){
      const key = b.dataset.clAdd, d = clDoc(t);
      d[key].push(key==='hotels' ? { id: clNewId('h'), name:'' } : { id: clNewId('f'), airline:'', ref:'', departure:'', arrival:'' });
      clQueueList(t, key);
      document.getElementById('cl-setup-host').innerHTML = clSetupHTML(t);
      const last = document.querySelectorAll(`#cl-setup-host [data-cl-list="${key}"]`); const target = key==='hotels' ? last[last.length-1] : last[last.length-4]; if(target) target.focus();
      clRefreshTable(t); return;
    }
    if((b = q('[data-cl-del]'))){
      const key = b.dataset.clDel, id = b.dataset.lid, d = clDoc(t);
      if(!confirm('Remove this from the list? Passengers assigned to it will be unassigned.')) return;
      d[key] = d[key].filter(x=>x.id!==id);
      const field = key==='hotels' ? 'hotelId' : key==='flightsTo' ? 'toId' : 'retId';
      const affected = Object.keys(d.pax).filter(pid=>d.pax[pid][field]===id);
      clQueueList(t, key); if(affected.length) clSetPax(t, affected, { [field]: '' });
      document.getElementById('cl-setup-host').innerHTML = clSetupHTML(t); clRefreshTable(t);
    }
  });
  root.addEventListener('change', e=>{
    const el = e.target; if(!can) return;
    if(el.matches('[data-cl-sel]')){ el.checked ? clSel.add(el.dataset.clSel) : clSel.delete(el.dataset.clSel); clRefreshTable(t); return; }
    if(el.matches('[data-cl-selall]')){ clPaxList(t).forEach(c=>{ el.checked ? clSel.add(c.id) : clSel.delete(c.id); }); clRefreshTable(t); return; }
    if(el.matches('[data-cl-bulk]')){
      const ids = clPaxList(t).filter(c=>clSel.has(c.id)).map(c=>c.id);
      if(!el.value){ return; }
      if(!ids.length){ showToast('Tick the passengers on the left first'); el.value=''; return; }
      clSetPax(t, ids, { [el.dataset.clBulk]: el.value }); showToast('Assigned to ' + ids.length + ' passenger' + (ids.length>1?'s':'')); clRefreshTable(t); return;
    }
    if(el.matches('[data-cl-done]')){ clSetPax(t, [el.dataset.pid], { [el.dataset.clDone]: el.checked }); clRefreshTable(t); return; }
    if(el.matches('[data-cl-colall]')){ clSetPax(t, clPaxList(t).map(c=>c.id), { [el.dataset.clColall]: el.checked }); clRefreshTable(t); return; }
    if(el.matches('select[data-cl-field]')){ clSetPax(t, [el.dataset.pid], { [el.dataset.clField]: el.value }); clRefreshTable(t); return; }
    if(el.matches('[data-cl-list]')){ clRefreshTable(t); }   // refresh labels once the field is left
  });
  root.addEventListener('input', e=>{
    const el = e.target; if(!can) return;
    if(el.matches('input[data-cl-field]')){ clSetPax(t, [el.dataset.pid], { [el.dataset.clField]: el.value }); return; }
    if(el.matches('[data-cl-list]')){
      const d = clDoc(t), key = el.dataset.clList, item = d[key].find(x=>x.id===el.dataset.lid);
      if(item){ item[el.dataset.lf] = el.value; clQueueList(t, key); }
    }
  });
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && clFull){ clFull = false; render(); } });

function opsPanelHTML(t){
  if(!isSubmittedTrip(t)){
    return `<div class="panel ops-panel"><div class="panel-head"><h3>Operations</h3></div><div class="ops-body"><p class="hint" style="margin:0;">${isCancelledTrip(t) ? 'This trip is cancelled.' : 'Operations starts once the trip is submitted. Click <b>Submit</b> when all the information is filled in.'}</p></div></div>`;
  }
  const can = isApproverOrAdmin(), cur = tripOpsStatus(t), ci = OPS_FLOW.indexOf(cur);
  const step = (s, i) => `${i?'<span class="ops-arrow">›</span>':''}<button type="button" class="ops-step ${ci>=0 && i<ci?'done':''} ${s===cur?'current':''}" data-ops="${s}" ${can?'':'disabled'} aria-pressed="${s===cur}">${esc(s)}</button>`;
  const side = (s, extra) => `<button type="button" class="ops-step side ${extra} ${s===cur?'current':''}" data-ops="${s}" ${can?'':'disabled'} aria-pressed="${s===cur}">${esc(opsLabel(s))}</button>`;
  return `<div class="panel ops-panel" id="ops-panel"><div class="panel-head"><h3>Operations</h3></div>
    <div class="ops-body">
      <div class="ops-flow">${OPS_FLOW.map(step).join('')}<span class="ops-sep"></span>${side('Onhold','')}${side('Rejected','rej')}</div>
      <p class="hint" style="margin:10px 0 0;">${can ? 'Click a stage to move the trip to it. On-hold and Rejected can be set at any stage.' : 'Only approvers and admins can route Operations.'}</p>
    </div>${clBlockHTML(t)}</div>`;
}
async function setOpsStatus(tripId, opsStatus){
  try{
    const updated = await apiFetch(`/trips/${tripId}/ops-status`, { method:'POST', body: JSON.stringify({ opsStatus }) });
    const idx = trips.findIndex(t=>t.id===tripId);
    if(idx>-1) trips[idx] = { ...trips[idx], ...updated };
    showToast('Operations: ' + opsLabel(opsStatus));
  }catch(e){
    showToast(e.message || 'Could not update Operations');
  }
  render();
}

// Live-recalculates the read-only Balance field in the passenger modal
// whenever Package amount, Deposit paid, or Payment changes.
// Formula: Balance = Package amount - Deposit paid - Payment (floored at 0).
function recalcBalanceField(){
  const amount = Number(document.getElementById('cu-amount').value)||0;
  const deposit = Number(document.getElementById('cu-deposit').value)||0;
  const payment = Number(document.getElementById('cu-payment').value)||0;
  document.getElementById('cu-balance').value = Math.max(0, amount - deposit - payment).toFixed(2);
  const st = document.getElementById('cu-status');
  if(st) st.value = st.dataset.cancelled ? 'Cancelled' : payStatusFrom(amount, deposit, payment);
}

  const cs = custByTrip(tripId);
  if(!cs.length){ showToast('No passengers to export yet'); return; }

  const rows = cs.map(c=>({
    'Full Name (As per IC)': c.name || '',
    'Date of Birth': c.dob || '',
    'IC/Passport': c.idNumber || '',
    'Contact Number': c.phone || '',
    'Trip Type': t.type === 'private' ? 'Private Trip' : 'Open Trip',
    'Location': t.destination || '',
    'Medical Condition/ history if applicable': c.medicalCondition || '',
    'Passport Number': c.passportNumber || '',
    'Passport Expiry': c.passportExpiry || '',
    'Payment Status': paxStatus(c),
    'Amount (RM)': Number(c.amount)||0,
    'Deposit Paid (RM)': Number(c.depositAmount)||0,

    'Ticket Status': c.ticketStatus || 'Pending',
    'Airline': c.airline || '',
    'Booking Reference': c.bookingReference || '',
    'PIC': c.picName || '',
    'Notes': c.notes || '',
    'Submitted': c.submittedAt || ''
  }));

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [
    {wch:26},{wch:14},{wch:16},{wch:16},{wch:12},{wch:20},
    {wch:30},{wch:16},{wch:14},{wch:14},{wch:12},{wch:14},{wch:14},{wch:14},{wch:18},{wch:14},{wch:16},{wch:18},{wch:16},{wch:24},{wch:14}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Passengers');

  const safeName = (t.name||'trip').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'');
  const filename = `${tripCode(t)}_${safeName}_passengers.xlsx`;
  try{
    XLSX.writeFile(wb, filename);
    showToast('Passenger list downloading…');
  }catch(e){
    showToast('Could not export the passenger list');
  }
}

function downloadTemplate(){
  try{
    const byteChars = atob(TEMPLATE_BASE64);
    const byteNumbers = new Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++){ byteNumbers[i] = byteChars.charCodeAt(i); }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Excapism_Passenger_Upload_Template.xlsx';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showToast('Template downloading…');
  }catch(e){
    showToast('Could not download the template');
  }
}

/* =========================================================
   Excel parsing
   ========================================================= */
const HEADER_MAP = {
  timestamp: ['timestamp'],
  name: ['full name (as per ic)','full name','name','customer name','passenger name','pax name'],
  dob: ['date of birth (d.o.b)','date of birth','dob','d.o.b'],
  phone: ['contact number','phone','phone number','contact','mobile','mobile number'],
  tripType: ['trip type','type'],
  location: ['location','destination'],
  medicalCondition: ['medical condition/ history if applicable','medical condition/history if applicable','medical condition','medical history','medical condition/ history'],
  passportNumber: ['passport number','passport no','passport num'],
  passportExpiry: ['passport expiry','passport expiry date','passport exp','expiry date'],
  idNumber: ['ic','ic no','ic number','identification','id no'],
  notes: ['notes','remarks','remark','note']
};
function normalizeHeader(h){ return String(h||'').trim().toLowerCase(); }
function mapHeaders(headerRow){
  const map = {};
  headerRow.forEach((h,i)=>{
    const norm = normalizeHeader(h);
    for(const key in HEADER_MAP){
      if(HEADER_MAP[key].includes(norm) && map[key]===undefined){ map[key]=i; }
    }
  });
  return map;
}
function excelDateToStr(v){
  if(v==null || v==='') return '';
  if(typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  const s = String(v).trim();
  const dt = new Date(s);
  if(!isNaN(dt) && /\d{4}/.test(s)) return dt.toISOString().slice(0,10);
  return s;
}
function parseWorkbookFile(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array', cellDates:false});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
        if(!rows.length){ resolve({rows:[], hasTripColumns:false}); return; }
        const headerRow = rows[0];
        const map = mapHeaders(headerRow);
        const hasTripColumns = map.tripType!==undefined && map.location!==undefined;
        const out = [];
        for(let i=1;i<rows.length;i++){
          const r = rows[i];
          if(!r || r.every(cell=>cell==='' || cell==null)) continue;
          const name = map.name!==undefined ? r[map.name] : '';
          if(!name) continue;
          out.push({
            timestamp: map.timestamp!==undefined ? excelDateToStr(r[map.timestamp]) : '',
            name: String(name).trim(),
            dob: map.dob!==undefined ? excelDateToStr(r[map.dob]) : '',
            phone: map.phone!==undefined ? String(r[map.phone]||'').trim() : '',
            tripType: map.tripType!==undefined ? String(r[map.tripType]||'').trim() : 'Open',
            location: map.location!==undefined ? String(r[map.location]||'').trim() : '',
            medicalCondition: map.medicalCondition!==undefined ? String(r[map.medicalCondition]||'').trim() : '',
            passportNumber: map.passportNumber!==undefined ? String(r[map.passportNumber]||'').trim() : '',
            passportExpiry: map.passportExpiry!==undefined ? excelDateToStr(r[map.passportExpiry]) : '',
            idNumber: map.idNumber!==undefined ? String(r[map.idNumber]||'').trim() : '',
            notes: map.notes!==undefined ? String(r[map.notes]||'').trim() : ''
          });
        }
        resolve({rows: out, hasTripColumns});
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
function buildGroups(rows){
  const map = new Map();
  rows.forEach(r=>{
    const type = normType(r.tripType);
    const location = r.location || 'Unspecified destination';
    const key = type + '|' + location.toLowerCase();
    if(!map.has(key)) map.set(key, {type, location, rows:[]});
    map.get(key).rows.push(r);
  });
  const groups = Array.from(map.values());
  groups.forEach(g=>{
    const existing = trips.find(x => normType(x.type)+'|'+String(x.destination||'').trim().toLowerCase() === g.type+'|'+g.location.toLowerCase());
    g.existingTripId = existing ? existing.id : null;
  });
  return groups;
}

function bindAuthEvents(){
  const app = document.getElementById('app');

  const doSignup = app.querySelector('[data-action="do-signup"]');
  if(doSignup) doSignup.addEventListener('click', handleSignup);

  const doLogin = app.querySelector('[data-action="do-login"]');
  if(doLogin) doLogin.addEventListener('click', handleLogin);

  const doTemp = app.querySelector('[data-action="do-temp-account"]');
  if(doTemp) doTemp.addEventListener('click', handleUseTempAccount);

  const showSignup = app.querySelector('[data-action="show-signup"]');
  if(showSignup) showSignup.addEventListener('click', ()=>{ authError=''; authView='signup'; render(); });
  const showLogin = app.querySelector('[data-action="show-login"]');
  if(showLogin) showLogin.addEventListener('click', ()=>{ authError=''; authView='login'; render(); });

  const enterDemo = app.querySelector('[data-action="enter-demo-mode"]');
  if(enterDemo) enterDemo.addEventListener('click', ()=>{ DEMO_MODE = true; authView='login'; render(); });

  app.querySelectorAll('input').forEach(inp=>{

      if(e.key==='Enter'){
        const btn = app.querySelector('[data-action="do-signup"]') || app.querySelector('[data-action="do-login"]');
        if(btn) btn.click();
      }
    });

}

function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

async function handleSignup(){
  const name = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim().toLowerCase();
  const password = document.getElementById('su-password').value;
  const password2 = document.getElementById('su-password2').value;
  if(!name || !email){ authError = 'Name and email are required.'; render(); return; }
  if(!isValidEmail(email)){ authError = 'Enter a valid email address.'; render(); return; }
  if(password.length < 6){ authError = 'Password must be at least 6 characters.'; render(); return; }
  if(password !== password2){ authError = 'Passwords do not match.'; render(); return; }

  try{
    const data = await apiFetch('/auth/signup', { method:'POST', body: JSON.stringify({ name, email, password }) });
    authToken = data.token;
    currentUser = data.user;
    saveSession();
    authError = '';
    authView = 'app';
    view = { mode:'list', tripId:null, search:'', statusFilter:'All', typeFilter:'All', layout:'grid' };
    await loadBootstrap();
    showToast(currentUser.role==='admin' ? 'Admin account created — welcome!' : 'Account created — welcome!');
  }catch(e){
    authError = e.message || 'Could not create the account.';
  }
  render();
}

async function handleLogin(){

}

  const payload = {
    prefix: (prefixInput || 'EXC').toUpperCase(),
    includeYear: document.getElementById('set-include-year').checked,
    padding: parseInt(document.getElementById('set-padding').value, 10) || 3,
  };
  try{
    const updated = await apiFetch('/settings', { method:'PUT', body: JSON.stringify(payload) });
    Object.assign(numberSettings, updated);
    closeOverlay('overlay-settings');
    showToast('Numbering settings saved');
  }catch(e){
    showToast(e.message || 'Could not save numbering settings');
  }
  render();
}

async function handleApplyNextNumber(){
  const raw = document.getElementById('set-next-number').value;
  const val = parseInt(raw, 10);
  if(!raw || !val || val < 1){ showToast('Enter a valid number'); return; }
  try{
    const seq = await apiFetch('/settings/trip-sequence', { method:'POST', body: JSON.stringify({ nextNumber: val }) });
    Object.assign(numberSettings, seq);
    showToast(`Next trip will be numbered ${val}`);
  }catch(e){
    showToast(e.message || "Couldn't update the next number");
  }
  render();
  openOverlay('overlay-settings');
}

async function handleChangeRole(userId, newRole){
  const u = users.find(x=>x.id===userId);
  if(!u) return;
  try{
    const updated = await apiFetch(`/users/${userId}/role`, { method:'PUT', body: JSON.stringify({ role: newRole }) });
    Object.assign(u, updated);
    if(currentUser && currentUser.id===u.id) currentUser = { ...currentUser, role: updated.role };
    showToast('Role updated');
  }catch(e){
    showToast(e.message || 'Could not update that role');
  }
  render();
  openOverlay('overlay-users');
}

async function handleDeleteUser(userId){
  const u = users.find(x=>x.id===userId);
  if(!u || u.id===currentUser.id) return;
  if(!confirm(`Remove ${u.name}'s account?`)) return;
  try{
    await apiFetch(`/users/${userId}`, { method:'DELETE' });
    users = users.filter(x=>x.id!==userId);
    showToast('User removed');
  }catch(e){
    showToast(e.message || 'Could not remove that user');
  }
  render();
  openOverlay('overlay-users');
}
