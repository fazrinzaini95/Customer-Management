<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excapism · Passenger Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0F2C4C;
    --navy-deep:#081A2E;
    --gold:#F4B93C;
    --coral:#E15554;
    --green:#2E8B57;
    --paper:#FBF3E3;
    --paper-dim:#F2E8D5;
    --ink:#1C2B39;
    --ink-soft:#5A6B7A;
    --line: rgba(15,44,76,0.16);
    --radius: 14px;
    --shadow: 0 6px 20px rgba(15,44,76,0.10);
    --font-display:'Fredoka', sans-serif;
    --font-body:'IBM Plex Sans', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);}
  body{min-height:100vh;}
  ::selection{background:var(--gold);color:var(--navy-deep);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  .app{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{
    width:44px;height:44px;border-radius:10px;background:var(--navy);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display);color:var(--gold);font-weight:700;font-size:16px;
    box-shadow: var(--shadow);
    transform: rotate(-4deg);
  }
  .brand h1{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0;color:var(--navy-deep);letter-spacing:0.2px;}
  .brand p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .topbar-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(15,44,76,0.28);}
  .btn-primary:hover{box-shadow:0 6px 16px rgba(15,44,76,0.36);}
  .btn-gold{background:var(--gold);color:var(--navy-deep);box-shadow:0 4px 12px rgba(244,185,60,0.35);}
  .btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-danger{background:#fff;color:var(--coral);border:1.5px solid rgba(225,85,84,0.4);}
  .btn-danger:hover{background:rgba(225,85,84,0.08);}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .search{
    flex:1;min-width:180px;background:#fff;border:1.5px solid var(--line);border-radius:10px;
    padding:9px 14px;font-size:14px;color:var(--ink);
  }
  .search:focus{outline:none;border-color:var(--navy);}
  .chip-row{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{
    border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:999px;
    padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;
  }
  .chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  /* ---------- Trip cards (boarding-pass stub) ---------- */
  .trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .stub{
    position:relative;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:hidden;cursor:pointer;border:1px solid var(--line);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .stub:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(15,44,76,0.18);}
  .stub-top{padding:16px 18px 14px;position:relative;}
  .stub-type{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.5px;color:var(--ink-soft);
    text-transform:uppercase;margin-bottom:6px;
  }
  .stub-name{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--navy-deep);margin:0 0 4px;line-height:1.25;}
  .stub-dest{font-size:13px;color:var(--ink-soft);margin:0;}
  .stub-code{
    position:absolute;top:16px;right:18px;font-family:var(--font-mono);font-size:11px;color:var(--navy);
    background:var(--paper-dim);padding:3px 8px;border-radius:6px;font-weight:600;
  }
  .stub-perf{
    position:relative;height:0;border-top:2px dashed var(--line);margin:0 0;
  }
  .stub-perf::before,.stub-perf::after{
    content:"";position:absolute;top:-9px;width:18px;height:18px;background:var(--paper);border-radius:50%;
  }
  .stub-perf::before{left:-9px;}
  .stub-perf::after{right:-9px;}
  .stub-bottom{padding:13px 18px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .stub-dates{font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);}
  .stamp{
    font-family:var(--font-display);font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;
    padding:5px 10px;border-radius:7px;transform:rotate(-3deg);border:2px solid currentColor;
  }
  .stamp.Draft{color:var(--ink-soft);background:rgba(90,107,122,0.12);}
  .stamp.Pending{color:#9C7A16;background:rgba(244,185,60,0.16);}
  .stamp.Approved{color:var(--green);background:rgba(46,139,87,0.12);}
  .stamp.Declined{color:var(--coral);background:rgba(225,85,84,0.10);}
  .stamp.Cancelled{color:var(--coral);background:rgba(225,85,84,0.10);}
  .stamp.Completed{color:var(--navy);background:rgba(15,44,76,0.10);}
  .stamp.PendingPayment{color:#9C7A16;background:rgba(244,185,60,0.16);}
  .stamp.Paid{color:var(--green);background:rgba(46,139,87,0.12);}
  .stub-meta{padding:0 18px 16px;display:flex;gap:14px;font-size:12px;color:var(--ink-soft);}
  .stub-meta b{color:var(--ink);font-weight:600;}

  .empty{
    text-align:center;padding:70px 20px;background:#fff;border-radius:var(--radius);border:1.5px dashed var(--line);
  }
  .empty h3{font-family:var(--font-display);font-size:19px;color:var(--navy-deep);margin:0 0 6px;}
  .empty p{color:var(--ink-soft);font-size:14px;margin:0 0 18px;}

  /* ---------- Detail view ---------- */
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-soft);font-weight:600;margin-bottom:16px;background:none;border:none;padding:0;}
  .back-link:hover{color:var(--navy);}
  .manifest-head{
    background:var(--navy);color:#fff;border-radius:var(--radius);padding:22px 24px;
    display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;
    box-shadow:var(--shadow);
  }
  .manifest-head .mh-left .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin-bottom:6px;}
  .manifest-head h2{font-family:var(--font-display);font-size:24px;margin:0 0 6px;font-weight:600;}
  .manifest-head .mh-sub{font-size:13px;color:rgba(255,255,255,0.72);}
  .mh-edit{background:none;border:1.5px solid rgba(255,255,255,0.35);color:#fff;border-radius:7px;padding:3px 10px;font-size:11.5px;font-weight:600;margin-top:8px;}
  .mh-edit:hover{border-color:#fff;}
  .mh-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .approval-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}

  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .stat-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .stat-card .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:600;margin-bottom:4px;}
  .stat-card .value{font-family:var(--font-display);font-size:22px;color:var(--navy-deep);font-weight:600;}

  /* ---------- Tabs + Dashboard ---------- */
  .tabs{display:flex;gap:4px;margin:0 0 18px;border-bottom:1.5px solid var(--line);}
  .tab{background:none;border:none;padding:10px 18px;font-family:inherit;font-weight:600;font-size:14px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1.5px;cursor:pointer;}
  .tab:hover{color:var(--navy);}
  .tab.active{color:var(--navy);border-bottom-color:var(--gold);}
  .dash-filters{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;margin-bottom:14px;}
  .dash-fgroup{display:flex;flex-direction:column;gap:5px;}
  .dash-flabel{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:600;}
  .dash-scope{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}
  .dash-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px;}
  .dash-kpis .stat-card .value{font-size:24px;}
  .stat-card .sub{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.35;}
  .stat-card.is-link{cursor:pointer;text-align:left;font-family:inherit;}
  .stat-card.is-link:hover{border-color:var(--navy);}
  .stat-card.is-alert{border-left:4px solid var(--gold);}
  .dash-grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px;margin:16px 0;}
  .dash-body{padding:14px 20px 18px;}
  .dash-note{font-size:12px;color:var(--ink-soft);margin:6px 0 0;line-height:1.5;}
  .dash-sub{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);font-weight:600;margin:16px 0 4px;}
  .hbar-row{display:grid;grid-template-columns:96px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin:8px 0;}
  .hbar-label{color:var(--ink);}
  .hbar-track{height:12px;background:rgba(15,44,76,0.08);border-radius:4px;}
  .hbar-fill{height:100%;background:var(--navy);border-radius:0 4px 4px 0;}
  .hbar-val{text-align:right;font-weight:600;color:var(--navy-deep);font-variant-numeric:tabular-nums;}
  table.dash-table td,table.dash-table th{padding:9px 10px;text-align:left;white-space:nowrap;}
  table.dash-table th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-soft);background:var(--paper-dim);}
  table.dash-table td.num,table.dash-table th.num{text-align:right;font-variant-numeric:tabular-nums;}
  table.dash-table tr.is-total td{font-weight:700;border-top:1.5px solid var(--line);}
  table.dash-table tr.is-selected td{background:rgba(244,185,60,0.14);}
  table.dash-table tr[data-dash-year],table.dash-table tr[data-dash-open-trip]{cursor:pointer;}
  table.dash-table tbody tr:hover td{background:rgba(15,44,76,0.04);}
  .dash-attn{list-style:none;margin:0;padding:0;}
  .dash-attn li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .dash-attn li:last-child{border-bottom:none;}
  .dash-attn .n{min-width:34px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--navy-deep);}
  .dash-attn .ok{color:var(--green);}
  .dash-attn .t{color:var(--ink-soft);font-size:12.5px;display:block;}
  .dash-chart{width:100%;height:auto;display:block;}
  .dash-chart text{font-family:var(--font-body);fill:var(--ink-soft);font-size:12.5px;}
  .dash-chart .peak{fill:var(--navy-deep);font-weight:600;}
  .dash-chart .grid{stroke:rgba(15,44,76,0.10);stroke-width:1;}
  .dash-chart .bar{fill:var(--navy);}
  .dash-chart .hit{fill:transparent;cursor:default;outline:none;}
  .dash-chart .hit:hover,.dash-chart .hit:focus{fill:rgba(15,44,76,0.07);}
  #dash-tip{position:fixed;display:none;z-index:200;background:var(--navy-deep);color:#fff;border-radius:8px;padding:8px 11px;font-size:12px;pointer-events:none;box-shadow:var(--shadow);max-width:240px;}
  #dash-tip .tip-v{font-weight:700;font-size:14px;}
  #dash-tip .tip-l{opacity:0.85;margin-top:1px;}

  .panel{background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;}
  .panel-head h3{font-family:var(--font-display);font-size:16px;margin:0;color:var(--navy-deep);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);
    padding:10px 16px;border-bottom:1.5px solid var(--line);background:var(--paper-dim);font-weight:600;
  }
  tbody td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(15,44,76,0.03);}
  .cust-name{font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;}
  .cust-sub{font-size:11.5px;color:var(--ink-soft);}
  .med-flag{color:var(--coral);font-size:12px;cursor:help;}
  .status-select{
    border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:600;background:#fff;
  }
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .badge.Paid{background:rgba(46,139,87,0.12);color:var(--green);}
  .badge.Deposit{background:rgba(244,185,60,0.18);color:#9C7A16;}
  .badge.Pending{background:rgba(90,107,122,0.12);color:var(--ink-soft);}
  .badge.Cancelled{background:rgba(225,85,84,0.10);color:var(--coral);}
  .row-actions{display:flex;gap:4px;justify-content:flex-end;}
  .icon-btn{background:none;border:none;color:var(--ink-soft);font-size:13px;padding:4px 7px;border-radius:6px;}
  .icon-btn:hover{color:var(--navy);background:rgba(15,44,76,0.08);}
  .icon-btn.danger:hover{color:var(--coral);background:rgba(225,85,84,0.08);}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(8,26,46,0.55);display:none;align-items:center;justify-content:center;
    padding:20px;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .modal-head{padding:20px 24px;border-bottom:1.5px dashed var(--line);display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{font-family:var(--font-display);font-size:18px;margin:0;color:var(--navy-deep);}
  .modal-close{background:none;border:none;font-size:20px;color:var(--ink-soft);line-height:1;}
  .modal-body{padding:22px 24px;}
  .modal-foot{padding:16px 24px 22px;display:flex;justify-content:space-between;gap:10px;align-items:center;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;background:#fff;color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:9px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .seg button.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .dropzone{
    border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;background:#fff;
    cursor:pointer;transition:border-color .12s ease, background .12s ease;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--navy);background:rgba(15,44,76,0.03);}
  .dropzone p{margin:0;font-size:13.5px;color:var(--ink-soft);}
  .dropzone strong{color:var(--navy);}
  .file-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--paper-dim);border-radius:9px;padding:8px 12px;
    font-size:13px;margin-top:10px;font-weight:600;color:var(--navy-deep);
  }
  .preview-note{font-size:12.5px;color:var(--ink-soft);margin:12px 0 4px;}
  .preview-group{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;}
  .preview-group-head{background:var(--paper-dim);padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--navy-deep);display:flex;justify-content:space-between;}
  .preview-group-head span.tag{font-family:var(--font-mono);font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:#fff;color:var(--ink-soft);margin-left:6px;}
  .preview-table-wrap{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:9px;}
  .preview-table-wrap table{font-size:12px;}
  .preview-table-wrap th,.preview-table-wrap td{padding:7px 10px;white-space:nowrap;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;
    padding:11px 20px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.3);
    z-index:100;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .link-btn{background:none;border:none;color:var(--navy);font-weight:600;font-size:13px;text-decoration:underline;padding:0;}

  @media (max-width:640px){
    .field-row{grid-template-columns:1fr;}
    .manifest-head{flex-direction:column;}
    .mh-right{align-items:flex-start;}
    .approval-row{justify-content:flex-start;}
  }

  /* ---------- Calendar ---------- */
  .cal-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:12px;}
  .cal-arrow{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:22px;line-height:1;cursor:pointer;font-family:inherit;}
  .cal-arrow:hover{border-color:var(--navy);}
  .cal-title{font-family:var(--font-display);font-size:24px;margin:0 4px;color:var(--navy-deep);min-width:200px;text-align:center;}
  .cal-count{font-size:12.5px;color:var(--ink-soft);margin-left:auto;}
  .cal-tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px;}
  .cal-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-soft);margin:0 0 12px;}
  .cal-sw{display:inline-block;width:14px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border-left:3px solid var(--ink-soft);background:rgba(90,107,122,0.14);}
  .cal{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
  .cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--paper-dim);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:600;color:var(--ink-soft);}
  .cal-dow div{padding:8px 10px;}
  .cal-week{position:relative;border-top:1px solid var(--line);}
  .cal-days{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);}
  .cal-day{border-right:1px solid var(--line);padding:5px 6px;font-size:12px;color:var(--ink);}
  .cal-day:last-child{border-right:none;}
  .cal-day.out{background:rgba(15,44,76,0.035);color:rgba(90,107,122,0.75);}
  .cal-day .dn{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 4px;border-radius:11px;font-weight:600;}
  .cal-day.today .dn{background:var(--navy);color:#fff;}

<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Backend API
   Talks to the Passenger Manifest API (see /backend) — Express +
   Postgres, deployed as a Netlify Function, with Supabase as the
   hosted database. Set API_BASE to your deployed API's URL once
   it's live (see backend/DEPLOYMENT.md).
   ========================================================= */
const API_BASE = '/api';
const API_NOT_CONFIGURED = API_BASE.includes('YOUR-API-SITE');

let authToken = null; // JWT — persisted to localStorage so a page refresh doesn't require signing in again
let DEMO_MODE = false; // true = every request is served locally by demoFetch(), nothing leaves the browser

const SESSION_KEY = 'excapism_manifest_session';
function saveSession(){
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify({ token: authToken, demoMode: DEMO_MODE })); }
  catch(e){ /* storage unavailable (e.g. sandboxed preview) — session just won't survive a refresh */ }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){ /* nothing to clean up if storage was never available */ }
}
async function restoreSession(){
  let saved;
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return false;
    saved = JSON.parse(raw);
  }catch(e){ return false; }
  if(!saved || !saved.token) return false;

  DEMO_MODE = !!saved.demoMode;
  authToken = saved.token;
  try{
    currentUser = await apiFetch('/auth/me');
    authView = 'app';
    await loadBootstrap();
    return true;
  }catch(e){
    // token expired, revoked, or the API is unreachable — fall back to a clean login screen
    authToken = null;
    currentUser = null;
    DEMO_MODE = false;
    clearSession();
    return false;
  }
}

async function apiFetch(path, options = {}){
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  if(DEMO_MODE) return demoFetch(path, { ...options, headers });
  let res;
  try{
    res = await fetch(API_BASE + path, { ...options, headers });
  }catch(networkErr){
    const err = new Error('Could not reach the server — check your connection and try again.');
    err.network = true;
    throw err;
  }
  let body = null;
  try{ body = await res.json(); }catch(e){ /* empty body, e.g. 204 */ }
  if(!res.ok){
    const err = new Error((body && body.error) || `Request failed (${res.status})`);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return body;
}

// Used only by the public self-registration page — a visitor filling this
// out was never logged in, so this never attaches an Authorization header
// and never depends on this tab's DEMO_MODE state (which reflects a
// staff member's own local testing, not the site's actual configuration).
// If the real API is genuinely configured (the normal deployed case),
// this always talks to it directly; only falls back to the local demo
// mock when the whole site is still unconfigured, for template preview.
async function publicApiFetch(path, options = {}){
  if(API_NOT_CONFIGURED) return demoFetch(path, options);
  let res;
  try{
    res = await fetch(API_BASE + path, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
  }catch(networkErr){
    const err = new Error('Could not reach the server — check your connection and try again.');
    err.network = true;
    throw err;
  }
  let body = null;
  try{ body = await res.json(); }catch(e){ /* empty body */ }
  if(!res.ok){
    const err = new Error((body && body.error) || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return body;
}

/* =========================================================
   Demo mode
   A complete mock of the backend's routes, running entirely in this
   browser tab and persisted to localStorage — so the app can be tried
   end-to-end (accounts, roles, approval workflow, bulk upload) before a
   real API is deployed. Nothing here leaves the browser; nothing here is
   shared between people. Mirrors backend/src/routes/*.js route-for-route
   so switching to a real API later needs zero UI changes.
   ========================================================= */
const DEMO_STORAGE_KEY = 'excapism_demo_v1';
let demoState = null;
function demoId(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
async function demoHash(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function ensureDemoState(){
  if(demoState) return demoState;
  try{
    const raw = localStorage.getItem(DEMO_STORAGE_KEY);
    demoState = raw ? JSON.parse(raw) : null;
  }catch(e){ demoState = null; }
  if(!demoState){
    demoState = { users:[], trips:[], passengers:[], settings:{prefix:'EXC',includeYear:true,padding:3}, tripSeq:0, activityLog:[] };
  }
  if(!demoState.activityLog) demoState.activityLog = []; // upgrade older saved demo data
  return demoState;
}
function persistDemo(){
  try{ localStorage.setItem(DEMO_STORAGE_KEY, JSON.stringify(demoState)); }catch(e){ /* demo data just won't survive a refresh */ }
}
function resetDemoData(){
  demoState = { users:[], trips:[], passengers:[], settings:{prefix:'EXC',includeYear:true,padding:3}, tripSeq:0, activityLog:[] };
  persistDemo();
}
function logDemoActivity(state, actor, action, entityType, entityId, entityLabel, details){
  state.activityLog.unshift({
    id: demoId('log'), actorId: actor.id, actorName: actor.name, actorEmail: actor.email,
    action, entityType, entityId: entityId ?? null, entityLabel: entityLabel ?? null,
    details: details || {}, createdAt: new Date().toISOString()
  });
  if(state.activityLog.length > 200) state.activityLog.length = 200;
}

// Thin wrapper: deep-clones whatever demoFetchInner returns before handing
// it back. Without this, response objects are the SAME references living
// inside demoState — so an optimistic UI update in the frontend (setting
// a field before the "network" call resolves) would silently mutate
// demoState's copy too, corrupting things like activity-log before/after
// values. A real HTTP API can't have this problem (JSON travels over the
// wire), so this clone step is what makes demo mode behave like one.
async function demoFetch(path, options = {}){
  const result = await demoFetchInner(path, options);
  return result == null ? result : JSON.parse(JSON.stringify(result));
}

async function demoFetchInner(path, options = {}){
  const state = ensureDemoState();
  const method = (options.method || 'GET').toUpperCase();
  const body = options.body ? JSON.parse(options.body) : {};
  const authHeader = (options.headers && options.headers['Authorization']) || '';
  const token = authHeader.startsWith('Bearer ') ? authHeader.slice(7) : null;
  const me = token ? state.users.find(u=>u.id===token) : null;

  function fail(status, error){ const e = new Error(error); e.status = status; e.body = { error }; throw e; }
  function requireAuthed(){ if(!me) fail(401,'Missing or invalid Authorization header'); return me; }
  function requireRoleIn(...roles){ const u = requireAuthed(); if(!roles.includes(u.role)) fail(403,'You do not have permission to perform this action'); return u; }
  function publicUser(u){ return { id:u.id, name:u.name, email:u.email, role:u.role, isTemp:!!u.isTemp, createdAt:u.createdAt }; }
  function adminCount(){ return state.users.filter(u=>u.role==='admin').length; }
  let m;

  // ---- Auth ----
  if(path==='/auth/signup' && method==='POST'){
    const { name, email, password } = body;
    if(!name || !email) fail(400,'Name and email are required');
    if(!password || password.length<6) fail(400,'Password must be at least 6 characters');
    if(state.users.some(u=>u.email.toLowerCase()===String(email).toLowerCase())) fail(409,'An account with that email already exists');
    const role = state.users.length===0 ? 'admin' : 'user';
    const u = { id:demoId('user'), name, email, passwordHash: await demoHash(password), role, isTemp:false, createdAt:new Date().toISOString() };
    state.users.push(u); persistDemo();
    return { token:u.id, user:publicUser(u) };
  }
  if(path==='/auth/login' && method==='POST'){
    const { email, password } = body;
    const u = state.users.find(x=>x.email.toLowerCase()===String(email||'').toLowerCase());
    if(!u) fail(401,'Incorrect email or password');
    if(await demoHash(password||'') !== u.passwordHash) fail(401,'Incorrect email or password');
    return { token:u.id, user:publicUser(u) };
  }
  if(path==='/auth/temp-account' && method==='POST'){
    const suffix = Math.random().toString(36).slice(2,10);
    const email = `guest.${suffix}@temp.excapism`;
    const password = Math.random().toString(36).slice(2,12);
    const role = state.users.length===0 ? 'admin' : 'user';
    const u = { id:demoId('user'), name:'Guest User', email, passwordHash: await demoHash(password), role, isTemp:true, createdAt:new Date().toISOString() };
    state.users.push(u); persistDemo();
    return { token:u.id, user:publicUser(u), tempPassword:password };
  }
  if(path==='/auth/me' && method==='GET'){
    return publicUser(requireAuthed());
  }

  // ---- Bootstrap ----
  if(path==='/bootstrap' && method==='GET'){
    const u = requireAuthed();
    return {
      trips: state.trips.map(t=>({ ...t, passengerCount: state.passengers.filter(p=>p.tripId===t.id).length })),
      passengers: state.passengers.slice(),
      users: u.role==='admin' ? state.users.map(publicUser) : undefined,
      settings: { ...state.settings, runningNumber: state.tripSeq, nextNumber: state.tripSeq+1 }
    };
  }

  // ---- Trips ----
  if(path==='/trips' && method==='POST'){
    const u = requireAuthed();
    if(!body.name) fail(400,'Trip name is required');
    state.tripSeq += 1;
    const t = { id:demoId('trip'), seq:state.tripSeq, name:body.name, type:body.type||'open', destination:body.destination||null,
      startDate:body.startDate||null, endDate:body.endDate||null, status:'Draft',
      opsStatus:'Pending Ops',
      history:[{status:'Draft',date:new Date().toISOString()}], createdAt:new Date().toISOString(), createdByName:u.name, publicToken:demoId('tok') };
    state.trips.push(t);
    logDemoActivity(state, u, 'trip.created', 'trip', t.id, t.name, { type:t.type, destination:t.destination });
    persistDemo();
    return t;
  }
  if((m=path.match(/^\/trips\/([^/]+)$/)) && method==='PUT'){
    const u = requireAuthed();
    const t = state.trips.find(x=>x.id===m[1]); if(!t) fail(404,'Trip not found');
    Object.assign(t, body);
    logDemoActivity(state, u, 'trip.updated', 'trip', t.id, t.name, { updatedFields:Object.keys(body) });
    persistDemo();
    return t;
  }
  if((m=path.match(/^\/trips\/([^/]+)$/)) && method==='DELETE'){
    const u = requireRoleIn('admin');
    const idx = state.trips.findIndex(x=>x.id===m[1]); if(idx<0) fail(404,'Trip not found');
    const [removed] = state.trips.splice(idx,1);
    state.passengers = state.passengers.filter(p=>p.tripId!==m[1]);
    logDemoActivity(state, u, 'trip.deleted', 'trip', removed.id, removed.name, { destination:removed.destination });
    persistDemo();
    return null;
  }
  if((m=path.match(/^\/trips\/([^/]+)\/status$/)) && method==='POST'){
    const u = requireAuthed();
    const t = state.trips.find(x=>x.id===m[1]); if(!t) fail(404,'Trip not found');
    const TRANSITIONS = {
      Draft:[{to:'Pending',anyRole:true}],
      Pending:[{to:'Cancelled',anyRole:false},{to:'Approved',anyRole:false},{to:'Declined',anyRole:false}],
      Approved:[{to:'Completed',anyRole:false},{to:'Cancelled',anyRole:false}],
      Declined:[{to:'Draft',anyRole:true}],
      Cancelled:[{to:'Draft',anyRole:true}],
      Completed:[]
    };
    const move = (TRANSITIONS[t.status]||[]).find(a=>a.to===body.status);
    if(!move) fail(400,`Can't move a trip from ${t.status} to ${body.status}`);
    if(!move.anyRole && !['approver','admin'].includes(u.role)) fail(403,'Only an approver or admin can do that');
    const fromStatus = t.status;
    t.status = body.status;
    if(body.status==='Pending') t.opsStatus = 'Pending Ops';   // submitting always starts Operations at Pending Ops
    t.history.push({status:body.status, date:new Date().toISOString()});
    logDemoActivity(state, u, 'trip.status_changed', 'trip', t.id, t.name, { from:fromStatus, to:body.status });
    persistDemo();
    return t;
  }
  if((m=path.match(/^\/trips\/([^/]+)\/ops-status$/)) && method==='POST'){
    const u = requireRoleIn('approver','admin');
    const t = state.trips.find(x=>x.id===m[1]); if(!t) fail(404,'Trip not found');
    const OPS = ['Pending Ops','Ongoing','Ready','Completed','Onhold','Rejected'];
    if(!OPS.includes(body.opsStatus)) fail(400,'Unknown operations status');
    if(['Draft','Cancelled','Declined'].includes(t.status)) fail(400,'Operations can only be routed once the trip has been submitted');
    const from = t.opsStatus || 'Pending Ops';
    t.opsStatus = body.opsStatus;
    logDemoActivity(state, u, 'trip.ops_status_changed', 'trip', t.id, t.name, { from, to:body.opsStatus });
    persistDemo();
    return t;
  }
  if((m=path.match(/^\/trips\/([^/]+)\/ops-checklist$/)) && method==='PATCH'){
    requireRoleIn('approver','admin');
    const t = state.trips.find(x=>x.id===m[1]); if(!t) fail(404,'Trip not found');
    if(['Draft','Cancelled','Declined'].includes(t.status)) fail(400,'The Operations checklist is available once the trip has been submitted');
    const d = t.opsChecklist = t.opsChecklist || {};
    d.hotels = d.hotels||[]; d.flightsTo = d.flightsTo||[]; d.flightsReturn = d.flightsReturn||[]; d.pax = d.pax||{};
    Object.assign(d, body.lists || {});
    Object.entries(body.pax || {}).forEach(([pid,f])=>{ d.pax[pid] = Object.assign(d.pax[pid]||{}, f); });
    persistDemo();
    return { opsChecklist: d };
  }
  if(path==='/trips/bulk-import' && method==='POST'){
    const u = requireAuthed();
    const rows = body.rows || [];
    const groups = new Map();
    rows.forEach(r=>{
      const type = /private/i.test(r.tripType||'') ? 'private' : 'open';
      const location = (r.location||'').trim() || 'Unspecified destination';
      const key = type+'|'+location.toLowerCase();
      if(!groups.has(key)) groups.set(key,{type,location,rows:[]});
      groups.get(key).rows.push(r);
    });
    let importedCount=0, createdTripCount=0; const tripIds=[];
    for(const g of groups.values()){
      let t = state.trips.find(x=>normType(x.type)===g.type && String(x.destination||'').trim().toLowerCase()===g.location.toLowerCase());
      if(!t){
        state.tripSeq += 1;
        t = { id:demoId('trip'), seq:state.tripSeq, name:g.location, type:g.type, destination:g.location, startDate:null, endDate:null,
          status:'Draft', history:[{status:'Draft',date:new Date().toISOString()}], createdAt:new Date().toISOString(), createdByName:u.name, publicToken:demoId('tok') };
        state.trips.push(t); createdTripCount += 1;
      }
      tripIds.push(t.id);
      g.rows.forEach(r=>{
        state.passengers.push({ id:demoId('cust'), tripId:t.id, name:r.name, dob:r.dob||null, phone:r.phone||null,
          idNumber:r.idNumber||null, medicalCondition:r.medicalCondition||null, passportNumber:r.passportNumber||null, passportExpiry:r.passportExpiry||null,
          amount:0, depositAmount:0, balancePaid:0, paymentStatus:'Pending', notes:r.notes||null, submittedAt:r.timestamp||null,
          addedAt:new Date().toISOString() });
        importedCount += 1;
      });
    }
    logDemoActivity(state, u, 'trip.bulk_import', 'bulk_import', null, `Bulk import (${importedCount} passenger${importedCount===1?'':'s'})`, { importedCount, createdTripCount });
    persistDemo();
    return { importedCount, createdTripCount, tripIds:[...new Set(tripIds)] };
  }

  // ---- Passengers ----
  if((m=path.match(/^\/trips\/([^/]+)\/passengers$/)) && method==='POST'){
    const u = requireAuthed();
    const c = { id:demoId('cust'), tripId:m[1], amount:0, depositAmount:0, balancePaid:0, paymentStatus:'Pending', addedAt:new Date().toISOString(), ...body };
    state.passengers.push(c);
    logDemoActivity(state, u, 'passenger.created', 'passenger', c.id, c.name, { tripId:c.tripId });
    persistDemo();
    return c;
  }
  if((m=path.match(/^\/passengers\/([^/]+)$/)) && method==='PUT'){
    const u = requireAuthed();
    const c = state.passengers.find(x=>x.id===m[1]); if(!c) fail(404,'Passenger not found');
    Object.assign(c, body);
    logDemoActivity(state, u, 'passenger.updated', 'passenger', c.id, c.name, { updatedFields:Object.keys(body) });
    persistDemo();
    return c;
  }
  if((m=path.match(/^\/passengers\/([^/]+)\/payment-status$/)) && method==='PUT'){
    const u = requireAuthed();
    const c = state.passengers.find(x=>x.id===m[1]); if(!c) fail(404,'Passenger not found');
    const fromStatus = c.paymentStatus;
    c.paymentStatus = body.paymentStatus;
    logDemoActivity(state, u, 'passenger.payment_status_changed', 'passenger', c.id, c.name, { from:fromStatus, to:body.paymentStatus });
    persistDemo();
    return c;
  }
  if((m=path.match(/^\/passengers\/([^/]+)\/ticket-status$/)) && method==='PUT'){
    const u = requireAuthed();
    const c = state.passengers.find(x=>x.id===m[1]); if(!c) fail(404,'Passenger not found');
    const fromStatus = c.ticketStatus;
    c.ticketStatus = body.ticketStatus;
    logDemoActivity(state, u, 'passenger.ticket_status_changed', 'passenger', c.id, c.name, { from:fromStatus, to:body.ticketStatus });
    persistDemo();
    return c;
  }
  if((m=path.match(/^\/passengers\/([^/]+)$/)) && method==='DELETE'){
    const u = requireAuthed();
    const idx = state.passengers.findIndex(x=>x.id===m[1]); if(idx<0) fail(404,'Passenger not found');
    const [removed] = state.passengers.splice(idx,1);
    logDemoActivity(state, u, 'passenger.deleted', 'passenger', removed.id, removed.name, { tripId:removed.tripId });
    persistDemo();
    return null;
  }

  // ---- Users ----
  if(path==='/users' && method==='GET'){
    requireRoleIn('admin');
    return state.users.map(publicUser);
  }
  if(path==='/users' && method==='POST'){
    const u = requireRoleIn('admin');
    const { name, email, password, role } = body;
    if(!name || !email) fail(400,'Name and email are required');
    if(!password || password.length<6) fail(400,'Password must be at least 6 characters');
    if(state.users.some(x=>x.email.toLowerCase()===String(email).toLowerCase())) fail(409,'That email is already registered');
    const newUser = { id:demoId('user'), name, email, passwordHash: await demoHash(password), role: role||'user', isTemp:false, createdAt:new Date().toISOString() };
    state.users.push(newUser);
    logDemoActivity(state, u, 'user.created', 'user', newUser.id, newUser.email, { role:newUser.role });
    persistDemo();
    return publicUser(newUser);
  }
  if((m=path.match(/^\/users\/([^/]+)\/role$/)) && method==='PUT'){
    const u = requireRoleIn('admin');
    const target = state.users.find(x=>x.id===m[1]); if(!target) fail(404,'User not found');
    if(target.role==='admin' && body.role!=='admin' && adminCount()<=1) fail(400,'At least one admin is required');
    const fromRole = target.role;
    target.role = body.role;
    logDemoActivity(state, u, 'user.role_changed', 'user', target.id, target.email, { from:fromRole, to:body.role });
    persistDemo();
    return publicUser(target);
  }
  if((m=path.match(/^\/users\/([^/]+)$/)) && method==='DELETE'){
    const admin = requireRoleIn('admin');
    if(m[1]===admin.id) fail(400,"You can't remove your own account");
    const target = state.users.find(x=>x.id===m[1]); if(!target) fail(404,'User not found');
    if(target.role==='admin' && adminCount()<=1) fail(400,'At least one admin is required');
    state.users = state.users.filter(x=>x.id!==m[1]);
    logDemoActivity(state, admin, 'user.deleted', 'user', target.id, target.email, { role:target.role });
    persistDemo();
    return null;
  }

  // ---- Settings ----
  if(path==='/settings' && method==='GET'){
    requireAuthed();
    return { ...state.settings, runningNumber: state.tripSeq, nextNumber: state.tripSeq+1 };
  }
  if(path==='/settings' && method==='PUT'){
    const u = requireRoleIn('admin');
    state.settings = { prefix:body.prefix, includeYear:body.includeYear, padding:body.padding };
    logDemoActivity(state, u, 'settings.updated', 'settings', null, 'Trip numbering format', state.settings);
    persistDemo();
    return state.settings;
  }
  if(path==='/settings/trip-sequence' && method==='POST'){
    const u = requireRoleIn('admin');
    const maxExisting = state.trips.length ? Math.max(...state.trips.map(t=>t.seq||0)) : 0;
    const desired = body.nextNumber - 1;
    if(desired < maxExisting) fail(400, `Can't go below ${maxExisting+1} — that would collide with an existing trip.`);
    state.tripSeq = desired;
    logDemoActivity(state, u, 'trip_sequence.updated', 'settings', null, 'Trip numbering sequence', { nextNumber:body.nextNumber });
    persistDemo();
    return { runningNumber: state.tripSeq, nextNumber: state.tripSeq+1 };
  }

  // ---- Activity log ----
  if(path==='/activity' && method==='GET'){
    requireRoleIn('admin');
    return state.activityLog.slice(0, 200);
  }

  // ---- Public self-registration (no auth) ----
  if((m=path.match(/^\/public\/trips\/([^/]+)$/)) && method==='GET'){
    const t = state.trips.find(x=>x.publicToken===m[1]);
    if(!t) fail(404,'Registration link not found');
    const closed = ['Declined','Cancelled','Completed'].includes(t.status) || ['Completed','Rejected'].includes(t.opsStatus);
    return { name:t.name, type:t.type, destination:t.destination, startDate:t.startDate, endDate:t.endDate, acceptingRegistrations:!closed };
  }
  if((m=path.match(/^\/public\/trips\/([^/]+)\/register$/)) && method==='POST'){
    const t = state.trips.find(x=>x.publicToken===m[1]);
    if(!t) fail(404,'Registration link not found');
    const closed = ['Declined','Cancelled','Completed'].includes(t.status) || ['Completed','Rejected'].includes(t.opsStatus);
    if(closed) fail(400,'Registration is closed for this trip');
    const passengers = Array.isArray(body.passengers) ? body.passengers : [];
    if(!passengers.length) fail(400,'At least one passenger is required');
    for(let idx=0; idx<passengers.length; idx++){
      const p = passengers[idx];
      if(!p.name || !String(p.name).trim()) fail(400,`Passenger ${idx+1}: full name is required.`);
      if(p.wantsFlight && (!p.passportNumber || !String(p.passportNumber).trim() || !p.passportExpiry)){
        fail(400, `Passenger ${idx+1}: passport number and expiry date are required since a flight was requested.`);
      }
    }
    const created = passengers.map(p=>{
      const c = { id:demoId('cust'), tripId:t.id, name:String(p.name).trim().toUpperCase(), dob:p.dob||null, phone:p.phone||null,
        idNumber:p.idNumber||null, medicalCondition:p.medicalCondition||null, passportNumber:p.passportNumber||null, passportExpiry:p.passportExpiry||null,
        amount:0, depositAmount:0, balancePaid:0, paymentStatus:'Pending', ticketPurchaser: p.wantsFlight ? 'Excapism' : null, ticketStatus:'Pending', airline:null,
        bookingReference:null, notes:p.notes||null, addedAt:new Date().toISOString() };
      state.passengers.push(c);
      return c;
    });
    created.forEach(c=>{
      logDemoActivity(state, { id:null, name:`${c.name} (self-registered)`, email:'public-registration@excapism.local' },
        'passenger.self_registered', 'passenger', c.id, c.name, { tripId:t.id, tripName:t.name, batchSize:created.length });
    });
    persistDemo();
    return { names: created.map(c=>c.name) };
  }

  fail(404, 'Not found');
}

   ========================================================= */
async function loadBootstrap(){
  try{
    const data = await apiFetch('/bootstrap');
    trips = data.trips || [];
    customers = data.passengers || [];
    users = data.users || [];
    numberSettings = Object.assign({prefix:'EXC',includeYear:true,padding:3,runningNumber:0,nextNumber:1}, data.settings || {});
  }catch(e){
    showToast(e.message || 'Could not load data from the server');
  }
}

/* =========================================================
   Auth
   Real server-side accounts — the API hashes passwords and
   issues a JWT; this client just holds that token in memory
   and sends it back on every request.
   ========================================================= */
function isAdmin(){ return !!currentUser && currentUser.role==='admin'; }
function isApproverOrAdmin(){ return !!currentUser && (currentUser.role==='approver' || currentUser.role==='admin'); }
function roleLabel(r){ return r.charAt(0).toUpperCase()+r.slice(1); }
function adminCount(){ return users.filter(u=>u.role==='admin').length; }

/* =========================================================
   Helpers
   ========================================================= */
function tripCode(t){
  const parts = [(numberSettings.prefix || 'EXC').toUpperCase()];
  if(numberSettings.includeYear){
    const yr = t.startDate ? new Date(t.startDate).getFullYear() : new Date(t.createdAt||Date.now()).getFullYear();
    parts.push(yr);
  }
  parts.push(String(t.seq).padStart(numberSettings.padding||3,'0'));
  return parts.join('-');
}
// Reads the year straight out of the trip code (e.g. "EXC-2026-017" → "2026"),
// same as the user sees it. Falls back to the trip's start/created date if the
// numbering format doesn't include a year segment (Settings → "Include year" off).
function tripYear(t){
  const m = tripCode(t).match(/-(\d{4})-/);
  if(m) return m[1];
  const d = t.startDate || t.createdAt;
  return d ? String(new Date(d).getFullYear()) : '—';
}
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + (String(d).length<=10 ? 'T00:00:00' : ''));
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtMoney(n){
  const v = Number(n)||0;
  return 'RM ' + v.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function custByTrip(tripId){ return customers.filter(c=>c.tripId===tripId); }
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>el.classList.remove('show'), 2400);
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function normType(v){
  const s = String(v||'').trim().toLowerCase();
  if(s.includes('private')) return 'private';
  return 'open';
}

/* =========================================================
   Approval flow rules
   ========================================================= */
function tripActions(t){
  if(t.status==='Draft') return [{to:'Pending',label:'Submit',cls:'btn-primary',anyRole:true,confirm:'Submit this trip? It moves to Pending Payment and Operations starts at Pending Ops.'}];
  if(['Pending','Approved'].includes(t.status)) return [{to:'Cancelled',label:'Decline trip',cls:'btn-danger',confirm:'Decline this trip? It will be marked Cancelled.'}];
  if(t.status==='Declined' || t.status==='Cancelled') return [{to:'Draft',label:'Reopen as draft',cls:'btn-ghost',anyRole:true}];
  return [];
}
async function setTripStatus(tripId, newStatus){
  try{
    const updated = await apiFetch(`/trips/${tripId}/status`, { method:'POST', body: JSON.stringify({ status: newStatus }) });
    const idx = trips.findIndex(t=>t.id===tripId);
    if(idx>-1) trips[idx] = { ...trips[idx], ...updated };
    showToast(newStatus==='Pending' ? 'Trip submitted — now Pending Payment' : newStatus==='Cancelled' ? 'Trip declined — Cancelled' : newStatus==='Draft' ? 'Trip reopened as draft' : 'Trip marked ' + newStatus);
  }catch(e){
    showToast(e.message || 'Could not update trip status');
  }
  render();
}

/* =========================================================
   Render: root switch
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  if(!loaded){ app.innerHTML = '<div class="empty"><p>Loading manifest…</p></div>'; return; }
  if(API_NOT_CONFIGURED && !DEMO_MODE){ app.innerHTML = apiNotConfiguredHTML(); bindAuthEvents(); return; }
  if(authView==='signup'){ app.innerHTML = signupHTML(); bindAuthEvents(); return; }
  if(authView==='login'){ app.innerHTML = loginHTML(); bindAuthEvents(); return; }
  app.innerHTML = headerHTML() + tempBannerHTML() + tabsHTML() + (view.mode==='detail' ? detailHTML() : view.mode==='dashboard' ? dashboardHTML() : view.mode==='calendar' ? calendarHTML() : listHTML()) + modalsHTML() + (isAdmin() ? manageUsersModalHTML() + settingsModalHTML() + activityLogModalHTML() : '');
  bindEvents();
}

/* =========================================================
   Dashboard — summary across all trips, computed client-side from the
   trips[] and customers[] already loaded (so it also works in demo mode).
   Year = the year in the trip code (same as the list view's Year column).
   Money uses the same rules as each trip page: Paid = full amount,
   Deposit = deposit + payment, anything else = nothing collected yet.
   ========================================================= */
let dashFilter = { year:'All', month:'All', type:'All', status:'All' };
let dashMetric = 'pax';          // 'pax' | 'trips' | 'amount' | 'collected'
let dashPeriodView = 'chart';    // 'chart' | 'table'
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DEAD_STATUSES = ['Declined','Cancelled'];
const DASH_METRICS = {
  pax:       { label:'Passengers', money:false },
  trips:     { label:'Trips',      money:false },
  amount:    { label:'Amount',     money:true  },
  collected: { label:'Collected',  money:true  },
};

function ymd(d){ return d ? String(d).slice(0,10) : ''; }
function pad2(n){ return String(n).padStart(2,'0'); }
function todayYmd(){ const n=new Date(); return `${n.getFullYear()}-${pad2(n.getMonth()+1)}-${pad2(n.getDate())}`; }
function addDaysYmd(s, days){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+days); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function daysBetweenYmd(a, b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function tripStartYmd(t){ return ymd(t.startDate) || ymd(t.createdAt); }
function tripEndYmd(t){ return ymd(t.endDate) || ymd(t.startDate); }
// One set of rules for every figure in the app (passenger table, trip page,
// homepage, dashboard, export). A passenger marked Cancelled is not counted.
// Paid = the full amount is in. Otherwise what is collected is simply
// deposit + payment, whatever the status dropdown says, so the numbers always
// follow what was typed in. Balance = amount - deposit - payment (never below 0).
function paxCounted(c){ return c.paymentStatus!=='Cancelled'; }
function paidOf(c){
  if(!paxCounted(c)) return 0;
  return (Number(c.depositAmount)||0)+(Number(c.balancePaid)||0);
}
function paxBalance(c){
  if(!paxCounted(c)) return 0;
  return Math.max(0, (Number(c.amount)||0)-(Number(c.depositAmount)||0)-(Number(c.balancePaid)||0));
}
// Payment status is automatic — nobody picks it. It follows the three money columns:
//   balance is zero (and there is an amount)  -> Paid
//   deposit paid, nothing in Payment          -> Deposit
//   anything else (nothing yet, or a Payment entered with balance still owing) -> Pending
// A passenger already marked Cancelled stays Cancelled.
function payStatusFrom(amount, deposit, payment){
  const a = Number(amount)||0, d = Number(deposit)||0, p = Number(payment)||0;
  if(a>0 && d+p>=a) return 'Paid';
  if(d>0 && p===0) return 'Deposit';
  return 'Pending';
}
function paxStatus(c){
  if(c.paymentStatus==='Cancelled') return 'Cancelled';
  return payStatusFrom(c.amount, c.depositAmount, c.balancePaid);
}
function tripMoney(t){
  const cs = custByTrip(t.id);
  let amount = 0, collected = 0, balance = 0;
  cs.forEach(c=>{ if(!paxCounted(c)) return; amount += Number(c.amount)||0; collected += paidOf(c); balance += paxBalance(c); });
  return { pax: cs.length, amount, collected, balance };
}
function fmtRM(n){ return 'RM ' + (Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function fmtCompact(n){
  const v = Number(n)||0;
  if(v>=1e6) return (v/1e6).toFixed(v%1e6===0?0:1)+'M';
  if(v>=1e3) return (v/1e3).toFixed(v%1e3===0?0:1)+'K';
  return String(v);
}
function pctText(part, whole){ return whole>0 ? Math.round(part/whole*100)+'%' : '—'; }

function dashModel(){
  const f = dashFilter;
  const today = todayYmd();
  const monthPrefix = today.slice(0,7);
  const in30 = addDaysYmd(today, 30);
  const years = [...new Set(trips.map(tripYear))].filter(y=>/^\d{4}$/.test(y)).sort();
  const isDead = t => isCancelledTrip(t);
  // Declined/Cancelled trips aren't going ahead, so they're left out of pax and money
  // unless the Status filter is set to one of them on purpose.
  const counted = t => f.status!=='All' || !isDead(t);
  const matches = (t, ignoreYear) =>
    (ignoreYear || f.year==='All' || tripYear(t)===String(f.year)) &&
    (f.month==='All' || Number(tripStartYmd(t).slice(5,7))===Number(f.month)) &&
    (f.type==='All' || t.type===f.type) &&
    (f.status==='All' || tripMainStatus(t)===f.status);

  const cache = new Map();
  const money = t => { let x = cache.get(t.id); if(!x){ x = tripMoney(t); cache.set(t.id, x); } return x; };
  const sum = arr => arr.reduce((a,t)=>{ const x=money(t); a.pax+=x.pax; a.amount+=x.amount; a.collected+=x.collected; a.balance+=x.balance; return a; }, {pax:0,amount:0,collected:0,balance:0});
  const bucket = (label, full, tl) => ({ label, full, trips: tl.length, ...sum(tl.filter(counted)) });

  const list = trips.filter(t=>matches(t,false));
  const countedList = list.filter(counted);
  const totals = sum(countedList);
  const activeCount = list.filter(t=>!isDead(t)).length;

  const live = list.filter(t=>!isDead(t) && !opsClosed(t));
  const thisMonth = list.filter(t=>!isDead(t) && ymd(t.startDate).startsWith(monthPrefix) && tripEndYmd(t)>=today);
  const upcoming = live.filter(t=>tripStartYmd(t) && tripEndYmd(t)>=today)
                       .sort((a,b)=>tripStartYmd(a).localeCompare(tripStartYmd(b)));
  const awaiting = list.filter(needsOpsAction);

  const yearly = years.map(y=>bucket(y, y, trips.filter(t=>matches(t,true) && tripYear(t)===y)));
  const buckets = f.year==='All'
    ? yearly
    : MONTH_SHORT.map((lab,i)=>bucket(lab, `${MONTH_NAMES[i]} ${f.year}`, list.filter(t=>Number(tripStartYmd(t).slice(5,7))===i+1)));

  const statusRows = MAIN_STATUSES.map(s=>({ label:s, n:list.filter(t=>tripMainStatus(t)===s).length }));
  const opsRows = OPS_STATUSES.map(s=>({ label:opsLabel(s), n:list.filter(t=>isSubmittedTrip(t) && tripOpsStatus(t)===s).length }));
  const typeRows = [['open','Open trip'],['private','Private trip']].map(([k,label])=>{
    const tl = list.filter(t=>t.type===k);
    return { label, trips: tl.length, pax: sum(tl.filter(counted)).pax };
  });
  const payRows = PAY_STATUSES.map(s=>({ label:s, n:0 }));
  countedList.forEach(t=>custByTrip(t.id).forEach(c=>{ const r=payRows.find(x=>x.label===paxStatus(c)); if(r) r.n++; }));

  const destMap = new Map();
  countedList.forEach(t=>{
    const base = (t.destination||'').trim().replace(/\s*\([^)]*\)\s*$/,'').trim() || 'Unspecified';
    const key = base.toUpperCase();
    let d = destMap.get(key);
    if(!d){ d = { name:base, trips:0, pax:0, amount:0, collected:0 }; destMap.set(key, d); }
    const x = money(t);
    d.trips++; d.pax+=x.pax; d.amount+=x.amount; d.collected+=x.collected;
  });
  const destinations = [...destMap.values()].sort((a,b)=>b.pax-a.pax||b.trips-a.trips||a.name.localeCompare(b.name)).slice(0,8);

  let ticketPax = 0; const ticketTrips = new Set();
  countedList.filter(ticketStageTrip).forEach(t=>custByTrip(t.id).forEach(c=>{
    if(c.ticketPurchaser && c.ticketStatus==='Pending' && c.paymentStatus!=='Cancelled'){ ticketPax++; ticketTrips.add(t.id); }
  }));
  const due30 = upcoming.filter(t=>tripStartYmd(t)>=today && tripStartYmd(t)<=in30 && money(t).balance>0);
  const emptyTrips = upcoming.filter(t=>money(t).pax===0);

  return { f, today, in30, years, list, countedList, totals, activeCount, thisMonth, upcoming, awaiting,
           yearly, buckets, statusRows, opsRows, typeRows, payRows, destinations, ticketPax, ticketTrips, due30, emptyTrips, money };
}

        ${MAIN_STATUSES.map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${s}</option>`).join('')}
