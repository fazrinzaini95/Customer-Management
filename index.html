function renderListOnly(){
  const app = document.getElementById('app');
  const gridArea = app.querySelector('.trip-grid') || app.querySelector('.panel') || app.querySelector('.empty');
  if(gridArea){
    const temp = document.createElement('div');
    temp.innerHTML = listHTML();
    const newGrid = temp.querySelector('.trip-grid') || temp.querySelector('.panel') || temp.querySelector('.empty');
    gridArea.replaceWith(newGrid);
    // This bypasses the normal render()->bindEvents() flow to avoid
    // losing focus on the search input, so the click/toggle handlers for
    // whatever just got swapped in have to be reattached explicitly here
    // — otherwise trip cards/rows shown after typing a search become
    // unclickable (they exist in the DOM but nothing is listening).
    newGrid.querySelectorAll('[data-open-trip]').forEach(el=>{
      el.addEventListener('click', ()=>{ view.mode='detail'; view.tripId = el.dataset.openTrip; view.returnTo = null; passengerFilterKeyword=''; render(); });
    });
    newGrid.querySelectorAll('[data-action="open-new-trip"]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ editingTripId=null; render(); openOverlay('overlay-trip'); });
    });
    newGrid.querySelectorAll('[data-sort-key]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const key = el.dataset.sortKey;
        if(tripListSort.col===key){ tripListSort.dir = tripListSort.dir==='asc' ? 'desc' : 'asc'; }
        else { tripListSort.col = key; tripListSort.dir = 'asc'; }
        render();
      });
    });
  }
}

// Shared between the normal render()->bindEvents() flow and
// renderPassengerTableOnly() below — every interactive element that can
// appear inside a passenger row, bound the same way regardless of
// whether the row just came from a full render or a lightweight
// tbody-only swap.
function bindPassengerRowHandlers(container){
  container.querySelectorAll('[data-ticket-status]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const id = el.dataset.ticketStatus;
      pendingPassengerEdits[id] = { ...(pendingPassengerEdits[id]||{}), ticketStatus: el.value };
      render();
    });
  });
  container.querySelectorAll('[data-save-passenger]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = el.dataset.savePassenger;
      const draft = pendingPassengerEdits[id];
      if(!draft) return;
      try{
        const updated = await apiFetch(`/passengers/${id}`, { method:'PUT', body: JSON.stringify(draft) });
        const idx = customers.findIndex(x=>x.id===id);
        if(idx>-1) customers[idx] = updated;
        delete pendingPassengerEdits[id];
        showToast('Changes saved');
      }catch(e){
        showToast(e.message || 'Could not save changes');
      }
      render();
    });
  });
  container.querySelectorAll('[data-cancel-passenger]').forEach(el=>{
    el.addEventListener('click', ()=>{
      delete pendingPassengerEdits[el.dataset.cancelPassenger];
      render();
    });
  });
  container.querySelectorAll('[data-edit-cust]').forEach(el=>{
    el.addEventListener('click', ()=>{ editingCustomerId = el.dataset.editCust; render(); openOverlay('overlay-customer'); });
  });
  container.querySelectorAll('[data-del-cust]').forEach(el=>{
    el.addEventListener('click', ()=>handleDeleteCustomer(el.dataset.delCust, false));
  });
}

// Lightweight update for the passenger-table keyword filter — swaps only
// the <tbody> (not the whole detail view) so the filter input never loses
// focus/cursor position while typing, the same reasoning as
// renderListOnly() above. Re-binds the row handlers on the swapped
// content for the same reason that function has to.
function renderPassengerTableOnly(){
  const t = trips.find(x=>x.id===view.tripId);
  if(!t) return;
  const tbody = document.getElementById('passenger-tbody');
  if(!tbody) return;
  tbody.innerHTML = passengerRowsHTML(t);
  bindPassengerRowHandlers(tbody);
}

async function handleSaveTrip(){
  const name = document.getElementById('tr-name').value.trim();
  if(!name){ showToast('Trip name is required'); return; }
  const dest = resolveCountryValue();
  if(dest===null){ showToast('Please choose a country from the list'); document.getElementById('tr-dest').focus(); return; }
  const startV = document.getElementById('tr-start').value, endV = document.getElementById('tr-end').value;
  if(startV && endV && endV < startV){ showToast('End date cannot be before the start date'); return; }
  const payload = {
    name,
    type: document.getElementById('tr-type').value,
    destination: dest,
    startDate: document.getElementById('tr-start').value,
    endDate: document.getElementById('tr-end').value
  };
  if(editingTripId){
    try{
      const updated = await apiFetch(`/trips/${editingTripId}`, { method:'PUT', body: JSON.stringify(payload) });
      const idx = trips.findIndex(t=>t.id===editingTripId);
      if(idx>-1) trips[idx] = { ...trips[idx], ...updated };
      // Operations is routed through its own endpoint (approver/admin only, checked server-side).
      const opsSel = document.getElementById('tr-ops-status');
      if(opsSel && idx>-1 && opsSel.value !== tripOpsStatus(trips[idx])){
        try{
          const moved = await apiFetch(`/trips/${editingTripId}/ops-status`, { method:'POST', body: JSON.stringify({ opsStatus: opsSel.value }) });
          trips[idx] = { ...trips[idx], ...moved };
        }catch(e){
          showToast('Trip saved, but Operations was not changed: ' + (e.message || 'not allowed'));
          closeOverlay('overlay-trip'); render(); return;
        }
      }
      showToast('Trip updated');
      closeOverlay('overlay-trip');
    }catch(e){
      showToast(e.message || 'Could not update the trip');
    }
    render();
  } else {
    try{
      const t = await apiFetch('/trips', { method:'POST', body: JSON.stringify(payload) });
      trips.push({ ...t, passengerCount: 0 });
      closeOverlay('overlay-trip');
      showToast('Trip created');
      view.mode='detail'; view.tripId=t.id;
    }catch(e){
      showToast(e.message || 'Could not create the trip');
    }
    render();
  }
}

async function handleDeleteTrip(){
  if(!editingTripId) return;
  if(!confirm('Delete this trip and all its passenger records? This cannot be undone.')) return;
  try{
    await apiFetch(`/trips/${editingTripId}`, { method:'DELETE' });
    trips = trips.filter(t=>t.id!==editingTripId);
    customers = customers.filter(c=>c.tripId!==editingTripId);
    closeOverlay('overlay-trip');
    showToast('Trip deleted');
    view.mode='list'; view.tripId=null;
  }catch(e){
    showToast(e.message || 'Could not delete the trip');
  }
  render();
}

async function handleSaveCustomer(){
  const name = document.getElementById('cu-name').value.trim();
  if(!name){ showToast('Passenger name is required'); return; }
  const payload = {
    name,
    dob: document.getElementById('cu-dob').value,
    phone: document.getElementById('cu-phone').value.trim(),
    idNumber: document.getElementById('cu-idnum').value.trim(),
    medicalCondition: document.getElementById('cu-medical').value.trim(),
    passportNumber: document.getElementById('cu-passport-number').value.trim(),
    passportExpiry: document.getElementById('cu-passport-expiry').value,
    amount: Number(document.getElementById('cu-amount').value)||0,
    depositAmount: Number(document.getElementById('cu-deposit').value)||0,
    balancePaid: Number(document.getElementById('cu-payment').value)||0,
    paymentStatus: document.getElementById('cu-status').dataset.cancelled ? 'Cancelled' : payStatusFrom(Number(document.getElementById('cu-amount').value), Number(document.getElementById('cu-deposit').value), Number(document.getElementById('cu-payment').value)),
    notes: document.getElementById('cu-notes').value.trim()
  };
  // Ticket fields only render in the modal once the trip is Approved+ —
  // guard each lookup so this doesn't break when they're absent.
  const ticketPurchaserEl = document.getElementById('cu-ticket-purchaser');
  const ticketStatusEl = document.getElementById('cu-ticket-status');
  const airlineEl = document.getElementById('cu-airline');
  const bookingRefEl = document.getElementById('cu-booking-ref');
  if(ticketPurchaserEl) payload.ticketPurchaser = ticketPurchaserEl.value;
  if(ticketStatusEl) payload.ticketStatus = ticketStatusEl.value;
  if(airlineEl) payload.airline = airlineEl.value.trim();
  if(bookingRefEl) payload.bookingReference = bookingRefEl.value.trim();
  if(editingCustomerId){
    try{
      const updated = await apiFetch(`/passengers/${editingCustomerId}`, { method:'PUT', body: JSON.stringify(payload) });
      const idx = customers.findIndex(c=>c.id===editingCustomerId);
      if(idx>-1) customers[idx] = updated;
      showToast('Passenger updated');
    }catch(e){
      showToast(e.message || 'Could not update the passenger');
    }
  } else {
    try{
      const created = await apiFetch(`/trips/${view.tripId}/passengers`, { method:'POST', body: JSON.stringify(payload) });
      customers.push(created);
      const t = trips.find(x=>x.id===view.tripId);
      if(t) t.passengerCount = (t.passengerCount||0) + 1;
      showToast('Passenger added');
    }catch(e){
      showToast(e.message || 'Could not add the passenger');
    }
  }
  closeOverlay('overlay-customer');
  render();
}

async function handleDeleteCustomer(id, fromModal){
  if(!id) return;
  if(!confirm('Remove this passenger from the trip?')) return;
  try{
    const c = customers.find(x=>x.id===id);
    await apiFetch(`/passengers/${id}`, { method:'DELETE' });
    customers = customers.filter(x=>x.id!==id);
    if(c){ const t = trips.find(x=>x.id===c.tripId); if(t) t.passengerCount = Math.max(0,(t.passengerCount||1)-1); }
    if(fromModal) closeOverlay('overlay-customer');
    showToast('Passenger removed');
  }catch(e){
    showToast(e.message || 'Could not remove that passenger');
  }
  render();
}

async function handleFile(file){
  uploadCtx.fileName = file.name;
  try{
    const {rows, hasTripColumns} = await parseWorkbookFile(file);
    if(!rows.length){
      showToast('No passenger rows detected — check the file has a Name column');
      uploadCtx.parsedRows = [];
      uploadCtx.groups = [];
    }else{
      uploadCtx.parsedRows = rows;
      uploadCtx.hasTripColumns = hasTripColumns;
      uploadCtx.groups = hasTripColumns ? buildGroups(rows) : [];
    }
  }catch(err){
    showToast('Could not read that file');
    uploadCtx.parsedRows = [];
    uploadCtx.groups = [];
  }
  render();
  openOverlay('overlay-upload');
}

async function handleConfirmUpload(){
  const rowsToImport = uploadCtx.parsedRows;

  if(uploadCtx.groups.length){
    // Trip Type + Location present — the server groups rows into the right
    // trips (matching existing ones or creating new Draft trips) atomically.
    try{
      const result = await apiFetch('/trips/bulk-import', { method:'POST', body: JSON.stringify({ rows: rowsToImport }) });
      await loadBootstrap();
      closeOverlay('overlay-upload');
      showToast(`${result.importedCount} passenger(s) imported`);
      uploadCtx = {mode:'existing', targetTripId:null, parsedRows:[], fileName:'', groups:[], hasTripColumns:false};
      if(result.tripIds && result.tripIds.length===1){
        view.mode='detail'; view.tripId=result.tripIds[0];
      } else {
        view.mode='list';
      }
    }catch(e){
      showToast(e.message || 'Could not import passengers');
    }
    render();
    return;
  }

  // Manual single-target flow (fallback when Trip Type/Location columns are absent)
  let targetId = null;
  if(uploadCtx.mode==='existing'){
    const sel = document.getElementById('up-trip-select');
    targetId = sel ? sel.value : uploadCtx.targetTripId;
    if(!targetId){ showToast('Choose a trip to upload into'); return; }
  } else {
    const nameEl = document.getElementById('up-nt-name');
    const name = nameEl ? nameEl.value.trim() : '';
    if(!name){ showToast('Trip name is required'); return; }
    try{
      const t = await apiFetch('/trips', { method:'POST', body: JSON.stringify({
        name,
        type: document.getElementById('up-nt-type').value,
        destination: document.getElementById('up-nt-dest').value.trim(),
        startDate:'', endDate:''
      }) });
      trips.push({ ...t, passengerCount: 0 });
      targetId = t.id;
    }catch(e){
      showToast(e.message || 'Could not create the trip');
      return;
    }
  }

  try{
    const created = await Promise.all(rowsToImport.map(r => apiFetch(`/trips/${targetId}/passengers`, {
      method:'POST',
      body: JSON.stringify({
        name: r.name, dob: r.dob, phone: r.phone, idNumber: r.idNumber,
        medicalCondition: r.medicalCondition, passportNumber: r.passportNumber, passportExpiry: r.passportExpiry, notes: r.notes,
      })
    })));
    customers = customers.concat(created);
    const t = trips.find(x=>x.id===targetId);
    if(t) t.passengerCount = (t.passengerCount||0) + created.length;

    closeOverlay('overlay-upload');
    showToast(`${created.length} passenger(s) imported`);
    uploadCtx = {mode:'existing', targetTripId:null, parsedRows:[], fileName:'', groups:[], hasTripColumns:false};
    view.mode='detail'; view.tripId=targetId;
  }catch(e){
    showToast(e.message || 'Some passengers could not be imported');
  }
  render();
}

/* =========================================================
   Public self-registration page
   A completely separate, unauthenticated view — reached via
   ?register=TOKEN in the URL. Never touches currentUser, trips,
   customers, or any other app state; only ever knows about the one
   trip its token points to. Supports registering multiple passengers
   (e.g. a family) in one submission, with a review step before the
   final confirm.
   ========================================================= */
let publicReg = { status:'loading', trip:null, error:'', passengers:[], submittedNames:[] }; // status: loading|form|review|closed|invalid|success

function makeBlankPublicPassenger(){
  return { name:'', dob:'', phone:'', idNumber:'', medicalCondition:'', wantsFlight:false, passportNumber:'', passportExpiry:'', notes:'' };
}

function publicRegShell(inner){
  return `
  <div style="max-width:520px;margin:60px auto 0;">
    <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:26px;">
      <div class="brand-badge">EX</div>
      <div>
        <h1 style="font-family:var(--font-display);font-weight:700;font-size:20px;margin:0;color:var(--navy-deep);">Excapism Passenger Management</h1>
        <p style="margin:0;font-size:12.5px;color:var(--ink-soft);">Passenger registration</p>
      </div>
    </div>
    <div class="panel" style="padding:26px 24px;">${inner}</div>
  </div>`;
}

function publicPassengerBlockHTML(p, i, total){
  return `
  <div style="border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span style="font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--navy-deep);">Passenger ${i+1}</span>
      ${total>1 ? `<button type="button" class="icon-btn danger" data-remove-passenger="${i}" title="Remove this passenger">✕ Remove</button>` : ''}
    </div>
    <div class="field"><label>Full name (as per IC)</label><input id="pr-name-${i}" style="text-transform:uppercase;" placeholder="AS PER IC / PASSPORT" value="${esc(p.name)}"></div>
    <div class="field-row">
      <div class="field"><label>Date of birth</label><input type="date" id="pr-dob-${i}" value="${esc(p.dob)}"></div>
      <div class="field"><label>Contact number</label><input id="pr-phone-${i}" value="${esc(p.phone)}"></div>
    </div>
    <div class="field"><label>IC / Passport no. <span style="font-weight:400;">(optional)</span></label><input id="pr-idnum-${i}" value="${esc(p.idNumber)}"></div>
    <div class="field"><label>Medical condition / history <span style="font-weight:400;">(if applicable)</span></label><textarea id="pr-medical-${i}" rows="2" placeholder="Leave blank if none">${esc(p.medicalCondition)}</textarea></div>
    <div class="field" style="margin-bottom:${p.wantsFlight?'10px':'0'};">
      <label style="display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;">
        <input type="checkbox" id="pr-wants-flight-${i}" data-flight-toggle="${i}" ${p.wantsFlight?'checked':''} style="width:auto;">
        I'd like Excapism to arrange my flight ticket
      </label>
    </div>
    ${p.wantsFlight ? `
    <div class="field-row">
      <div class="field"><label>Passport number <span style="color:var(--coral);font-weight:600;">*required</span></label><input id="pr-passport-number-${i}" value="${esc(p.passportNumber)}"></div>
      <div class="field"><label>Passport expiry date <span style="color:var(--coral);font-weight:600;">*required</span></label><input type="date" id="pr-passport-expiry-${i}" value="${esc(p.passportExpiry)}"></div>
    </div>` : ''}
    <div class="field" style="margin-bottom:0;"><label>Notes</label><textarea id="pr-notes-${i}" rows="2">${esc(p.notes)}</textarea></div>
  </div>`;
}

function publicRegistrationHTML(){
  if(publicReg.status==='loading'){
    return publicRegShell(`<p style="text-align:center;color:var(--ink-soft);margin:20px 0;">Loading…</p>`);
  }
  if(publicReg.status==='invalid'){
    return publicRegShell(`
      <h3 style="font-family:var(--font-display);font-size:18px;margin:0 0 8px;color:var(--navy-deep);">Link not found</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0;">This registration link isn't valid. Please double-check the link, or contact whoever sent it to you.</p>
    `);
  }
  if(publicReg.status==='closed'){
    const t = publicReg.trip;
    return publicRegShell(`
      <h3 style="font-family:var(--font-display);font-size:18px;margin:0 0 8px;color:var(--navy-deep);">${esc(t.name)}</h3>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0;">Registration is closed for this trip. Please contact your travel coordinator if you believe this is a mistake.</p>
    `);
  }
  if(publicReg.status==='success'){
    return publicRegShell(`
      <h3 style="font-family:var(--font-display);font-size:18px;margin:0 0 8px;color:var(--navy-deep);">You're registered! 🎉</h3>
      <p style="font-size:13.5px;color:var(--ink);margin:0 0 10px;">Thanks — the following passenger${publicReg.submittedNames.length===1?'':'s'} have been received:</p>
      <ul style="margin:0 0 10px;padding-left:20px;font-size:13.5px;color:var(--ink);">
        ${publicReg.submittedNames.map(n=>`<li>${esc(n)}</li>`).join('')}
      </ul>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0;">Your travel coordinator will be in touch with next steps.</p>
    `);
  }

  const t = publicReg.trip;
  const header = `
    <div style="margin-bottom:16px;">
      <h3 style="font-family:var(--font-display);font-size:18px;margin:0 0 4px;color:var(--navy-deep);">${esc(t.name)}</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin:0;">${esc(t.destination||'Destination TBC')} ${t.startDate ? '· ' + fmtDate(t.startDate) + ' → ' + fmtDate(t.endDate) : ''}</p>
    </div>`;
  const errorBlock = publicReg.error ? `<p style="color:var(--coral);font-size:13px;margin:0 0 14px;font-weight:600;">${esc(publicReg.error)}</p>` : '';

  if(publicReg.status==='review'){
    const summary = publicReg.passengers.map((p,i)=>`
      <div style="border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;">
        <div style="font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--navy-deep);margin-bottom:6px;">${i+1}. ${esc((p.name||'').toUpperCase())}</div>
        <div class="cust-sub">${[p.dob?('DOB '+fmtDate(p.dob)):'', p.phone].filter(Boolean).join(' · ')||'—'}</div>
        ${p.idNumber ? `<div class="cust-sub">IC/Passport no.: ${esc(p.idNumber)}</div>` : ''}
        ${p.medicalCondition ? `<div class="cust-sub">Medical: ${esc(p.medicalCondition)}</div>` : ''}
        <div class="cust-sub">Flight: ${p.wantsFlight ? 'Requested — Excapism to arrange' : 'Not requested'}</div>
        ${p.wantsFlight ? `<div class="cust-sub">Passport: ${esc(p.passportNumber)} · exp ${fmtDate(p.passportExpiry)}</div>` : ''}
        ${p.notes ? `<div class="cust-sub">Notes: ${esc(p.notes)}</div>` : ''}
      </div>`).join('');
    return publicRegShell(`
      ${header}
      <h3 style="font-family:var(--font-display);font-size:15px;margin:0 0 12px;color:var(--navy-deep);">Review before submitting</h3>
      ${errorBlock}
      ${summary}
      <div style="display:flex;gap:10px;margin-top:6px;">
        <button type="button" class="btn btn-ghost" style="flex:1;justify-content:center;" data-action="back-to-public-form">← Back to edit</button>
        <button type="button" class="btn btn-primary" style="flex:1;justify-content:center;" data-action="confirm-public-registration">Confirm &amp; submit</button>
      </div>
    `);
  }

  const blocks = publicReg.passengers.map((p,i)=>publicPassengerBlockHTML(p, i, publicReg.passengers.length)).join('');
  return publicRegShell(`
    ${header}
    ${errorBlock}
    ${blocks}
    <button type="button" class="btn btn-ghost" style="width:100%;justify-content:center;margin-bottom:14px;" data-action="add-public-passenger">+ Add another passenger</button>
    <button type="button" class="btn btn-primary" style="width:100%;justify-content:center;" data-action="review-public-registration">Review registration</button>
    <p class="hint" style="margin-top:14px;">Your details are only visible to your travel coordinator's team — this link doesn't show you anyone else's information.</p>
  `);
}

async function loadPublicTrip(token){
  try{
    const trip = await publicApiFetch(`/public/trips/${token}`);
    publicReg.trip = trip;
    publicReg.status = trip.acceptingRegistrations ? 'form' : 'closed';
    publicReg.passengers = [makeBlankPublicPassenger()];
  }catch(e){
    publicReg.status = 'invalid';
  }
  render();
}

// Reads whatever is currently in the DOM's input fields back into
// publicReg.passengers — called before any action that re-renders the
// form (adding/removing a passenger, toggling the flight checkbox,
// moving to review) so nothing typed gets lost in the process.
function syncPublicFormFromDOM(){
  publicReg.passengers.forEach((p, i)=>{
    const nameEl = document.getElementById(`pr-name-${i}`);
    if(!nameEl) return;
    p.name = nameEl.value;
    p.dob = document.getElementById(`pr-dob-${i}`).value;
    p.phone = document.getElementById(`pr-phone-${i}`).value;
    p.idNumber = document.getElementById(`pr-idnum-${i}`).value;
    p.medicalCondition = document.getElementById(`pr-medical-${i}`).value;
    const flightEl = document.getElementById(`pr-wants-flight-${i}`);
    if(flightEl) p.wantsFlight = flightEl.checked;
    const passNumEl = document.getElementById(`pr-passport-number-${i}`);
    if(passNumEl) p.passportNumber = passNumEl.value;
    const passExpEl = document.getElementById(`pr-passport-expiry-${i}`);
    if(passExpEl) p.passportExpiry = passExpEl.value;
    p.notes = document.getElementById(`pr-notes-${i}`).value;
  });
}

function validatePublicPassengers(){
  for(let i=0;i<publicReg.passengers.length;i++){
    const p = publicReg.passengers[i];
    if(!p.name || !p.name.trim()) return `Passenger ${i+1}: full name is required.`;
    if(p.wantsFlight && (!p.passportNumber || !p.passportNumber.trim() || !p.passportExpiry)){
      return `Passenger ${i+1}: passport number and expiry date are required since a flight was requested.`;
    }
  }
  return '';
}

async function handlePublicRegistrationSubmit(token){
  const picUserId = new URLSearchParams(location.search).get('pic') || undefined;
  const payload = {
    passengers: publicReg.passengers.map(p=>({
      name: (p.name||'').trim().toUpperCase(),
      dob: p.dob, phone: p.phone, idNumber: p.idNumber, medicalCondition: p.medicalCondition,
      wantsFlight: !!p.wantsFlight, passportNumber: p.passportNumber, passportExpiry: p.passportExpiry, notes: p.notes,
    })),
    ...(picUserId ? { picUserId } : {}),
  };
  try{
    const result = await publicApiFetch(`/public/trips/${token}/register`, { method:'POST', body: JSON.stringify(payload) });
    publicReg.status = 'success';
    publicReg.submittedNames = result.names || [];
    publicReg.error = '';
  }catch(e){
    publicReg.error = e.message || 'Could not submit your registration — please try again.';
  }
  render();
}

function bindPublicRegistrationEvents(token){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-flight-toggle]').forEach(el=>{
    el.addEventListener('change', ()=>{ syncPublicFormFromDOM(); render(); });
  });

  const addBtn = app.querySelector('[data-action="add-public-passenger"]');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    syncPublicFormFromDOM();
    publicReg.passengers.push(makeBlankPublicPassenger());
    render();
  });

  app.querySelectorAll('[data-remove-passenger]').forEach(el=>{
    el.addEventListener('click', ()=>{
      syncPublicFormFromDOM();
      publicReg.passengers.splice(parseInt(el.dataset.removePassenger,10), 1);
      render();
    });
  });

  const reviewBtn = app.querySelector('[data-action="review-public-registration"]');
  if(reviewBtn) reviewBtn.addEventListener('click', ()=>{
    syncPublicFormFromDOM();
    const err = validatePublicPassengers();
    if(err){ publicReg.error = err; render(); return; }
    publicReg.error = '';
    publicReg.status = 'review';
    render();
  });

  const backBtn = app.querySelector('[data-action="back-to-public-form"]');
  if(backBtn) backBtn.addEventListener('click', ()=>{
    publicReg.error = '';
    publicReg.status = 'form';
    render();
  });

  const confirmBtn = app.querySelector('[data-action="confirm-public-registration"]');
  if(confirmBtn) confirmBtn.addEventListener('click', ()=>handlePublicRegistrationSubmit(token));
}

/* =========================================================
   Init
   If a saved session exists (from a previous sign-in) and its token
   still checks out against the API, restore it straight into the app
   instead of showing the login screen again.
   ========================================================= */
(async function init(){
  loaded = true;
  const registerToken = new URLSearchParams(location.search).get('register');
  if(registerToken){
    // Public registration is a fully separate flow — never touches
    // login state, never calls restoreSession/loadBootstrap.
    render = (function(originalRender){
      return function(){
        const app = document.getElementById('app');
        app.innerHTML = publicRegistrationHTML();
        bindPublicRegistrationEvents(registerToken);
      };
    })(render);
    render();
    await loadPublicTrip(registerToken);
    return;
  }
  const restored = await restoreSession();
  if(!restored) authView = 'login';
  render();
})();
</script>
</body>
</html>
